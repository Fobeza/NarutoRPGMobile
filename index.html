    add(100, 118, { id: 'shino', dir: 'down', talk: 'shino_talk', sched: [[14 * H, 18 * H, 'wd'], [10 * H, 17 * H, 'we']], dryOnly: true });
    add(38, 115, { id: 'lee', dir: 'left', talk: 'lee_talk', sched: [[15 * H, 21 * H, 'wd'], [6 * H, 21 * H, 'we']], cond: () => day() >= 18 || G.state.flags.met_lee });
    add(40, 115, { id: 'guy', dir: 'left', talk: 'guy_talk', sched: [[16 * H, 20 * H]], cond: () => G.state.flags.met_lee });
    add(58, 27, { id: 'mizuki', dir: 'down', talk: 'mizuki_talk', sched: [[13 * H, 17 * H, 'wd']], cond: () => day() >= 8 && day() < 54 });
    // ночной торговец в переулке (каждую третью ночь)
    add(104, 68, { id: 'thief', name: 'Ночной торговец', dir: 'down', shop: 'night', reach: 20, sched: [[21 * H, 26 * H]], cond: () => day() % 3 === 0 });
    // объекты тренировок на полигонах
    for (const o of m.objects) {
      if (o.kind === 'target') o.talk = 'train_throw';
      else if (o.kind === 'dummy') o.talk = 'train_dummy';
      else if (o.kind === 'post') o.talk = 'train_tree';
      else if (o.kind === 'log' || o.kind === 'stump') o.talk = 'train_log';
    }
    const obj = (kind, tx, ty, talk) => { const p = this.freeTile(m, tx, ty, true); if (p) return m.addObject(kind, p[0] * T + 8, p[1] * T + 15, { talk }); };
    obj('sign', 44, 28, 'board');
    obj('sign', 81, 46, 'train_run');
    obj('stump', 123, 112, 'train_falls');
    obj('stump', 138, 104, 'train_water');
    obj('stump', 16, 30, 'train_stealth');
    // 20 секретных свитков (план §5.9): спрятаны по всей деревне
    const rnd = G.util.rng(2024), pts = m.spawnPoints.slice();
    const kinds = ['barrel', 'crate', 'stump', 'rock'];
    const used = [];
    for (let i = 0; i < 20 && pts.length; i++) {
      let p = null;
      for (let k = 0; k < 40; k++) { const c = pts[Math.floor(rnd() * pts.length)]; if (used.every((u) => Math.hypot(u.x - c.x, u.y - c.y) > 200)) { p = c; break; } }
      if (!p) p = pts[Math.floor(rnd() * pts.length)];
      used.push(p);
      const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
      const o = obj(kinds[i % 4], tx, ty, 'scroll_' + i);
      if (o) o.secret = i;
    }
    G.outdoor.addHerbs(m);
    m.finalize();
  };

  // интерьеры: учёба, додзё, дом героя
  const K = G.interiors.KINDS;
  const wrap = (kind, fn) => { const base = K[kind]; K[kind] = (info) => { const m = base(info); fn(m, info); return m; }; };
  wrap('library', (m) => { for (const n of m.npcs) n.talk = 'library_talk'; });
  wrap('dojo', (m) => { for (const n of m.npcs) n.talk = 'dojo_talk'; for (const o of m.objects) if (o.kind === 'dummy') o.talk = 'train_dummy'; });
  wrap('hero_home', (m) => {
    for (const o of m.objects) {
      if (o.kind === 'desk') o.talk = 'home_desk';
      if (o.kind === 'flowerpot') o.talk = 'home_flower';
      if (o.kind === 'chest') o.talk = 'home_chest';
    }
  });
  for (const k of ['nara_hall', 'akimichi_hall', 'hyuga_hall', 'inuzuka_hall']) {
    const base = K[k];
    K[k] = (info) => { const m = base(info); return m; };
  }
})();

  // ── проверка «приблизился к месту» для шагов visit ──
  let acc = 0;
  function poll(world, dt) {
    acc += dt; if (acc < 0.4) return; acc = 0;
    const m = world.map; if (!m || !m.outdoor) return;
    const p = world.player, tx = p.x / T, ty = p.y / T;
    for (const id of G.quests.activeList()) {
      const st = G.quests.curStep(id);
      if (!st || !st.visit || !G.quests.timeOk(st)) continue;
      const b = (m.buildings || []).find((x) => x.tplId === st.visit) || (m.spots && m.spots[st.visit]);
      if (!b) continue;
      const cx = (b.tx != null ? b.tx : b.x) + (b.tw || 1) / 2, cy = (b.ty != null ? b.ty : b.y) + (b.th || 1) / 2;
      if (Math.abs(tx - cx) < (b.tw || 1) / 2 + 5 && Math.abs(ty - cy) < (b.th || 1) / 2 + 5) {
        G.quests.step(id, st.id); world.showToast && world.showToast('Место найдено: ' + (b.name || st.text)); G.audio.sfx.confirm();
      }
    }
  }
  return { npcTick, drawEmotes, poll, villagerTalk };
})();

// Применение расписания: персонажи переходят от места к месту в течение дня + запросы для календаря.
G.schedule = (() => {
  const H = 60;
  const match = (d, day) => d === 'all' || (d === 'wd') === G.life.weekday(day);
  function rowsFor(id, day = G.state.vars.day) {
    const s = G.SCHED[id];
    if (!s || day < s.since) return [];
    return s.rows.filter((r) => match(r[0], day)).sort((a, b) => a[1] - b[1]);
  }
  function at(id, day = G.state.vars.day, min = G.state.vars.min) {
    const h = min / 60;
    return rowsFor(id, day).find((r) => h >= r[1] && h < r[2]) || null;
  }
  function label(id, day, min) {
    const r = at(id, day, min);
    if (r) return r[3];
    const h = ((min ?? G.state.vars.min) / 60) % 24;
    return h < 6 || h >= 22 ? 'Спит дома' : 'Занят своими делами';
  }
  function who() { return Object.keys(G.SCHED).filter((id) => !['chunin'].includes(id)); }

  // перемещение уличных персонажей: окна sched заменяются окнами всех уличных строк, место — по текущей строке
  const basePop = G.world.populateKonoha.bind(G.world);
  G.world.populateKonoha = function (m) {
    basePop(m);
    const T = G.CONFIG.TILE;
    const L = (tpl) => G.KONOHA_DRAFT.buildings.find((b) => b.tpl === tpl);
    for (const n of m.npcs) {
      const s = G.SCHED[n.id];
      if (!s || n.shop || n.route) continue;
      const rows = s.rows.filter((r) => r[4]);
      if (!rows.length || (n.id === 'chunin')) continue;
      const home = { x: n.x, y: n.y };
      n.route = rows.map((r) => {
        let spot = null;
        if (r[4] === '@') spot = home;
        else { const b = L(r[4]); const p = b && this.freeTile(m, b.x + r[5], b.y + r[6]); if (p) spot = { x: p[0] * T + 8, y: p[1] * T + 12 }; }
        return { w: [r[1] * H, r[2] * H, r[0] === 'wd' ? 'wd' : r[0] === 'we' ? 'we' : undefined], spot };
      }).filter((s2) => s2.spot);
      if (!n.route.length) { n.route = null; continue; }
      n.sched = n.route.map((s2) => s2.w);
    }
  };
  // вызывается из refreshNpcs/softRefresh мира: переносит NPC на место текущего окна (не на глазах у героя)
  function sync(world) {
    const m = world.map;
    if (!m || m.outdoor === false) return;
    const cam = world.cam;
    for (const n of m.npcs) {
      if (!n.route) continue;
      const i = n.route.findIndex((s2) => G.life.inWindow(s2.w));
      if (i < 0 || i === n._stop) continue;
      const onScr = cam && n._stop !== undefined && n.x > cam.x - 16 && n.x < cam.x + G.screen.W + 16 && n.y > cam.y - 8 && n.y < cam.y + G.screen.H + 40;
      if (onScr) continue;
      const sp = n.route[i].spot;
      n._stop = i; n.x = sp.x; n.y = sp.y; n.home = { x: sp.x, y: sp.y }; n.path = null; n._snap = 0; n.moving = false;
    }
  }
  return { sync, rowsFor, at, label, who };
})();


// ===== world/roofs.js =====
// Слой крыш: герой запрыгивает на крышу (A у стены дома), бегает по крышам, перепрыгивает проулки
// (до ~4 клеток) и спрыгивает вниз (A на краю). Открывается сценой с Наруто (флаг roofs).
G.roofs = {
  JUMP: 64,          // максимальный прыжок между крышами, px
  SPEED: 1.25,       // на крышах быстрее
  XP_DAY: 6,         // опыт Скорости за день от бега по крышам (максимум)
  wallH(id, tpl) { return G.buildgfx.wallH(tpl, id); },
  rects(m) {
    if (m._roofs) return m._roofs;
    const T = G.CONFIG.TILE, out = [];
    for (const b of m.buildings) {
      if (b.sortY < 0 || b.tplId === 'gate' || !b.tplDef || !b.spr) continue;
      const HF = b.th * T, OV = -b.oy, wh = this.wallH(b.tplId, b.tplDef);
      const top = b.ty * T - OV + 7;
      let bottom = b.ty * T + HF - wh + 3;
      if (bottom - top < 14) bottom = top + 14;
      out.push({ x: b.tx * T + 4, y: top, w: b.tw * T - 8, h: bottom - top, b });
    }
    return (m._roofs = out);
  },
  at(m, x, y) { for (const r of this.rects(m)) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; return null; },
  of(m, b) { return this.rects(m).find((r) => r.b === b); },
  unlocked() { return !!G.state.flags.roofs; },
  canClimb(world, b) { const p = world.player; return this.unlocked() && world.map.outdoor && !p.roof && !p.jump && !!this.of(world.map, b); },
  clampIn(r, x, y) { return [Math.max(r.x + 5, Math.min(r.x + r.w - 5, x)), Math.max(r.y + 6, Math.min(r.y + r.h - 2, y))]; },
  climb(world, b) {
    const p = world.player, r = this.of(world.map, b), v = G.actors.DIRV[p.dir];
    const [x, y] = this.clampIn(r, p.x + v[0] * 20, p.dir === 'up' ? r.y + r.h - 4 : p.y + v[1] * 20 - (p.y - (r.y + r.h)) * 0.5);
    this.startJump(p, x, y, true);
    if (!G.state.flags.tip_roofs) { G.state.flags.tip_roofs = 1; world.showToast('На крыше: A у края — спрыгнуть'); }
  },
  startJump(p, x1, y1, toRoof) {
    const d = Math.hypot(x1 - p.x, y1 - p.y);
    p.jump = { t: 0, dur: 0.28 + d / 260, x0: p.x, y0: p.y, x1, y1, toRoof, h: 10 + Math.min(16, d / 4) };
    p.roof = false; p.moving = false;
    G.audio.tone ? G.audio.tone(700, 0.08, 'triangle', 0.06, 1100) : G.audio.sfx.blip();
  },
  updateJump(world, dt) {
    const p = world.player, j = p.jump; if (!j) return;
    j.t += dt; const k = Math.min(1, j.t / j.dur);
    p.x = j.x0 + (j.x1 - j.x0) * k; p.y = j.y0 + (j.y1 - j.y0) * k;
    if (k >= 1) { p.jump = null; p.roof = j.toRoof; G.audio.sfx.step(); }
  },
  // движение по крышам; true — обработано
  move(world, p, ax, speed) {
    if (!p.roof) return false;
    const m = world.map, sp = speed * this.SPEED;
    const dx = ax.x * sp, dy = ax.y * sp;
    const ok = (x, y) => !!this.at(m, x, y);
    const x0 = p.x, y0 = p.y;
    if (ok(p.x + dx, p.y + dy)) { p.x += dx; p.y += dy; }
    else if (dx && ok(p.x + dx, p.y)) p.x += dx;
    else if (dy && ok(p.x, p.y + dy)) p.y += dy;
    else {
      // край: ищем крышу впереди в пределах прыжка
      const cur = this.at(m, p.x, p.y), len = Math.hypot(ax.x, ax.y) || 1, ux = ax.x / len, uy = ax.y / len;
      for (let s = 8; s <= this.JUMP; s += 4) {
        const r = this.at(m, p.x + ux * s, p.y + uy * s);
        if (r && r !== cur) { const [x, y] = this.clampIn(r, p.x + ux * (s + 8), p.y + uy * (s + 8)); this.startJump(p, x, y, true); return true; }
      }
      if (!world._edgeTip) { world._edgeTip = 1; world.showToast('Край крыши. A — спрыгнуть'); }
    }
    // опыт Скорости за пробежку по крышам
    const moved = Math.hypot(p.x - x0, p.y - y0), v = G.state.vars, d = G.state.daily;
    p.roofRun = (p.roofRun || 0) + moved;
    if (p.roofRun > 320) { p.roofRun = 0; if ((d.roofxp || 0) < this.XP_DAY) { d.roofxp = (d.roofxp || 0) + 0.5; G.train.addXp('spd', 0.5); } v.roofdist = (v.roofdist || 0) + 1; }
    return true;
  },
  // A на крыше — спрыгнуть
  interact(world) {
    const p = world.player; if (!p.roof) return false;
    const m = world.map, r = this.at(m, p.x, p.y); if (!r) { p.roof = false; return true; }
    const T = G.CONFIG.TILE, b = r.b, v = G.actors.DIRV[p.dir];
    const gy = b.ty * T + (p.y - r.y) / r.h * b.th * T;     // проекция на землю
    let x = p.x, y = gy;
    if (p.dir === 'down') y = (b.ty + b.th) * T + 8;
    else if (p.dir === 'up') y = b.ty * T - 4;
    else if (p.dir === 'left') x = b.tx * T - 8;
    else x = (b.tx + b.tw) * T + 8;
    for (const [ox, oy] of [[0, 0], [0, 6], [0, -6], [6, 0], [-6, 0], [0, 12], [12, 0], [-12, 0], [0, -12], [v[0] * 10, v[1] * 10]]) {
      const fx = x + ox, fy = y + oy;
      if (!m.blockedRect(G.actors.feet(p, fx, fy)) && !this.inFootprint(m, fx, fy)) { this.startJump(p, fx, fy, false); return true; }
    }
    world.showToast('Отсюда не спрыгнуть'); G.audio.sfx.error();
    return true;
  },
  inFootprint(m, x, y) { const T = G.CONFIG.TILE; return m.buildings.some((b) => b.sortY >= 0 && x >= b.tx * T && x < (b.tx + b.tw) * T && y >= b.ty * T && y < (b.ty + b.th) * T); },
  drawPlayer(ctx, world) {
    const p = world.player, j = p.jump;
    const lift = j ? Math.sin(Math.PI * Math.min(1, j.t / j.dur)) * j.h : 0;
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#000';
    ctx.fillRect(Math.round(p.x - 5 + lift * 0.1), Math.round(p.y - 2), 10, 3);
    ctx.globalAlpha = 1;
    const frame = p.moving ? G.chars.WALK[Math.floor(p.anim) % 4] : j ? 1 : 0;
    G.chars.draw(ctx, p.id, p.dir, frame, p.x, Math.round(p.y - lift));
  },
};


// ===== world/fx.js =====
// Визуальные эффекты мира: тени от зданий и деревьев по положению солнца, светящиеся ночью окна,
// падающие лепестки, светлячки и мягкая виньетка. Всё включается настройкой «Эффекты» (S.fx !== false).
G.fx = (() => {
  const T = G.CONFIG.TILE;
  const H = G.util.hash2;
  const enabled = () => G.storage.settings.fx !== false;

  // Положение солнца: -1 утро (тень на запад) … 0 полдень … +1 вечер; sun — сила дневного света 0..1
  function sun(min) {
    const h = min / 60;
    const a = Math.max(-1, Math.min(1, (h - 12) / 6));
    const sun = Math.max(0, Math.min(1, Math.min((h - 5.5) / 1.5, (19.5 - h) / 1.5)));
    return { a, sun };
  }

  function ellipse(ctx, cx, cy, rx, ry) {
    for (let y = -ry; y <= ry; y++) {
      const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01))));
      ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
    }
  }
  const TREES = { tree: [8, 3], pine: [7, 3], sakura: [9, 3], maple: [8, 3], ginkgo: [8, 3], bamboo: [5, 2], watertower: [7, 3] };

  // V9: статичные мягкие тени. Свет всегда сверху-слева, поэтому тени ложатся вправо-вниз.
  // Днём тень плотнее, ночью остаётся только контактная (мягче). Форма тени здания запекается один раз.
  const SH_L = 0.62;   // длина тени здания относительно высоты стены
  function buildingShadow(o) {
    if (o._shadow) return o._shadow;
    const W = o.tw * T, FH = o.th * T, wh = G.buildgfx.wallH(o.tplDef, o.tplId);
    const L = Math.max(6, Math.min(18, Math.round(wh * SH_L))), D = 7, pad = 3;
    const side = Math.round(FH * 0.55);
    const B = G.shade.box;
    const img = G.shade.soft(W + L + pad * 2, side + D + pad * 2, (x, y) => {
      x -= pad; y -= pad;
      // контактная полоса у фасада + косая тень справа; к дальнему краю — светлее
      const front = B(x, y, 1, side - 2, W + L * 0.6, side + D, 4) * (1 - 0.35 * Math.max(0, (y - side) / D));
      const sk = (side + D - y) * 0.45;   // скос: верх тени справа короче
      const right = B(x, y, W - 3, 2, W + L - sk * 0.4, side + D, 4) * (1 - 0.6 * Math.max(0, (x - W) / L));
      return Math.max(front, right);
    }, 0.4);
    return (o._shadow = { img, dx: -pad, dy: FH - side - pad });
  }

  // Тени на земле: рисуем до объектов, чтобы здания и деревья ложились поверх
  function shadows(ctx, vis, map, min) {
    if (!enabled()) return;
    const { sun: s } = sun(min);
    const k = map.outdoor ? 0.55 + 0.45 * s : 0.8;
    ctx.globalAlpha = k;
    for (const o of vis) {
      if (o.isBuilding) {
        if (!map.outdoor || o.sortY < 0 || o.tplId === 'gate' || !o.tw) continue;
        const sh = buildingShadow(o);
        ctx.drawImage(sh.img, o.x + sh.dx, o.y + sh.dy);
      } else if (TREES[o.kind]) {
        const [rx, ry] = TREES[o.kind];
        G.shade.shadow(ctx, o.x + 3, o.y, rx + 2, ry + 1, 0.32);
      } else if (o.kind === 'lamp' || o.kind === 'stonelamp') {
        G.shade.shadow(ctx, o.x + 3, o.y, 4, 2, 0.3);
      } else if (o.img && o.layer !== 'floor' && o.box && o.w <= 48) {
        G.shade.shadow(ctx, o.x + o.ox + o.w / 2 + 2, o.y - 1, o.w * 0.46, Math.max(2, Math.min(4, o.w * 0.15)), 0.3);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Окна светятся тёплым светом ночью (карта окон хранится в спрайте здания: spr.glow)
  function windows(ctx, vis, map, k, time) {
    if (!enabled() || !map.outdoor || k <= 0.02) return;
    ctx.globalCompositeOperation = 'lighter';
    for (const o of vis) {
      if (!o.isBuilding || !o.spr || !o.spr.glow) continue;
      const lit = H(o.tx, o.ty, 77);
      if (lit < 0.28) continue;
      const flick = lit > 0.9 ? 0.85 + 0.15 * Math.sin(time * 7 + o.tx) : 1;
      ctx.globalAlpha = Math.min(1, k) * 0.62 * flick;
      ctx.drawImage(o.spr.glow, o.x + o.spr.ox, o.y + o.spr.oy);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // Лепестки днём, светлячки ночью (в мировых координатах вокруг камеры)
  function particles(ctx, cx, cy, W, VH, map, min, time) {
    if (!enabled() || !map.outdoor || G.life.raining()) return;
    const { sun: s } = sun(min);
    if (s > 0.3) {
      for (let i = 0; i < 16; i++) {
        const sp = 9 + (i % 5) * 4;
        const x = cx + ((i * 47 + time * sp) % (W + 24)) - 12 + Math.sin(time * 1.6 + i) * 4;
        const y = cy + ((i * 83 + time * (14 + (i % 4) * 4)) % (VH + 24)) - 12;
        ctx.fillStyle = i % 3 ? '#f8c0d4' : '#fff0f6';
        ctx.globalAlpha = 0.85;
        ctx.fillRect(Math.round(x), Math.round(y), 2, 1); ctx.fillRect(Math.round(x) + 1, Math.round(y) + 1, 1, 1);
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 14; i++) {
        const bl = 0.5 + 0.5 * Math.sin(time * (1.2 + (i % 4) * 0.3) + i * 2.1);
        if (bl < 0.25) continue;
        const x = cx + ((i * 61 + Math.sin(time * 0.5 + i) * 18 + 400) % W);
        const y = cy + VH * 0.35 + ((i * 37) % (VH * 0.6)) + Math.sin(time * 0.8 + i * 1.7) * 6;
        const gr = ctx.createRadialGradient(x, y, 0, x, y, 6);
        gr.addColorStop(0, `rgba(210,255,120,${(0.8 * bl).toFixed(2)})`); gr.addColorStop(1, 'rgba(160,255,80,0)');
        ctx.fillStyle = gr; ctx.fillRect(x - 6, y - 6, 12, 12);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // Мягкое затемнение по краям (в экранных координатах)
  let vig = null, vigKey = '';
  function vignette(ctx, W, VH, y0) {
    if (!enabled()) return;
    const key = W + 'x' + VH;
    if (key !== vigKey) {
      vigKey = key; vig = G.gfx.canvas(W, VH); const c = vig.getContext('2d');
      const gr = c.createRadialGradient(W / 2, VH / 2, Math.min(W, VH) * 0.45, W / 2, VH / 2, Math.hypot(W, VH) * 0.56);
      gr.addColorStop(0, 'rgba(8,10,30,0)'); gr.addColorStop(1, 'rgba(8,10,30,0.34)');
      c.fillStyle = gr; c.fillRect(0, 0, W, VH);
    }
    ctx.drawImage(vig, 0, y0);
  }

  return { sun, shadows, windows, particles, vignette, enabled };
})();


// ===== engine/debug.js =====
// Режим отладки: FPS, стек сцен, координаты, читы.
// Включение: клавиша ` (или F2) на ПК, пункт «Отладка» в меню на телефоне, или ?debug в адресе.
G.debug = {
  on: false,
  fps: 60,
  _acc: 0, _frames: 0,
  lines: [],      // доп. строки от сцен

  init() {
    this.on = BUILD.debug || /[?&]debug/.test(location.search);
  },
  toggle() { this.on = !this.on; G.audio.sfx.select(); },

  tick(dt) {
    this._acc += dt; this._frames++;
    if (this._acc >= 0.5) { this.fps = Math.round(this._frames / this._acc); this._acc = 0; this._frames = 0; }
  },

  draw(ctx) {
    if (!this.on) return;
    const top = G.scenes.top();
    const rows = [
      `FPS ${this.fps}  ${G.screen.W}x${G.screen.H} x${G.screen.scale}`,
      'Сцены: ' + G.scenes.stack.map((s) => s.name || '?').join(' > '),
      ...((top && top.debugInfo && top.debugInfo()) || []),
      `v${BUILD.release} (${BUILD.version})`,
    ];
    const w = Math.max(...rows.map((r) => G.font.measure(r))) + 6;
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 20, w, rows.length * 10 + 4);
    ctx.globalAlpha = 1;
    rows.forEach((r, i) => G.font.draw(ctx, r, 3, 22 + i * 10, { color: '#7cff7c' }));
  },

  // Читы (будут расширяться: время, деньги, статы, неделя)
  cheats: {
    teleport(scene, x, y) { if (scene.player) { scene.player.x = x; scene.player.y = y; } },
  },
};


// ===== scenes/codebox.js =====
// Окно ввода/копирования кода сохранения — обычный DOM-элемент поверх игры (iOS даёт в нём копировать и вставлять).
// Используется в «Сохранение…» (экспорт, импорт) и на титульном экране («Загрузить игру»).
//   G.codeBox.open({ title, text, readonly, okLabel, hint, onOk(ta, close) })
//   G.codeBox.isOpen — пока окно открыто, сцены не обрабатывают ввод
//   G.codeBox.hintErr(текст) — красная подсказка (код не подошёл)
G.codeBox = (() => {
  let open = false;
  const $ = (id) => document.getElementById(id);
  function show({ title, text, readonly, okLabel, hint, onOk }) {
    const box = $('code-box'), ta = $('cb-text');
    $('cb-title').textContent = title;
    $('cb-hint').textContent = hint || '';
    $('cb-hint').className = 'te-hint';
    const ok = $('cb-ok');
    ok.textContent = okLabel;
    ta.value = text || ''; ta.readOnly = !!readonly;
    box.classList.remove('hidden'); open = true;
    const close = () => { box.classList.add('hidden'); open = false; ta.blur(); G.input.consume(); };
    ok.onpointerdown = (e) => { e.preventDefault(); onOk(ta, close); };
    $('cb-cancel').onpointerdown = (e) => { e.preventDefault(); close(); };
    setTimeout(() => { if (readonly) { ta.focus(); ta.select(); } else ta.focus(); }, 50);
  }
  const hintErr = (t) => { const h = $('cb-hint'); h.textContent = t; h.className = 'te-hint err'; };
  return { open: show, hintErr, get isOpen() { return open; } };
})();


// ===== scenes/title.js =====
// Титульный экран: ночная Коноха, Скала Хокаге, «Воля Огня».
G.scenes.register('title', () => {
  let t = 0;
  let idx = 0;
  let items = [];   // кнопки главного меню: { label, act }
  let bg = null;

  // Фон — готовая картинка (gfx/title_art.js), растянутая на экран; пока не загрузилась или её нет — рисуем кодом
  let art = null;
  function artReady() {
    if (!G.titleArt || typeof Image === 'undefined') return false;
    if (!art) { art = new Image(); art.onload = () => { bg = buildBg(); }; art.src = G.titleArt; }
    return art.complete && (art.naturalWidth || art.width) > 0;
  }
  function buildBg() {
    const W = G.screen.W, H = G.screen.H;
    if (artReady()) {
      const c = G.gfx.canvas(W, H), x = c.getContext('2d');
      x.imageSmoothingEnabled = false; x.drawImage(art, 0, 0, W, H);
      return c;
    }
    return drawBg(W, H);
  }
  // V9: ночная Коноха со светотенью — запасной фон кодом
  function drawBg(W, H) {
    const S = G.shade, BG = G.battleBg, Hh = G.util.hash2;
    const c = G.gfx.canvas(W, H), x = c.getContext('2d');
    x.fillStyle = '#100c1a'; x.fillRect(0, 0, W, H);
    const rockY = Math.floor(H * 0.42), roofY = Math.floor(H * 0.6);
    S.grad(c, 0, 0, W, roofY + 20, ['#07061a', '#120e30', '#241a48', '#3e2656', '#7a3450', '#c05a3e'], { dir: 'v', steps: 3 });
    for (let i = 0; i < 90; i++) {
      const sx = Math.floor(Hh(i, 1, 21) * W), sy = Math.floor(Hh(1, i, 22) * H * 0.38), b = Hh(i, i, 23);
      x.fillStyle = b > 0.85 ? '#ffffff' : b > 0.5 ? '#c8c0e8' : '#6a6498'; x.fillRect(sx, sy, 1, 1);
      if (b > 0.95) { x.globalAlpha = 0.45; x.fillRect(sx - 1, sy, 3, 1); x.fillRect(sx, sy - 1, 1, 3); x.globalAlpha = 1; }
    }
    // луна слева сверху — источник света сцены
    const mx = Math.round(W * 0.24), my = Math.round(H * 0.15);
    BG.glow(c, mx, my, 80, '#9a98d8', 0.3); BG.glow(c, mx, my, 34, '#e8e0ff', 0.25);
    S.ball(c, mx, my, 15, 15, ['#c8bea0', '#e0d8b8', '#f4ecd0', '#fffaf0']);
    x.fillStyle = '#c8bc9c'; x.fillRect(mx - 5, my - 3, 4, 3); x.fillRect(mx + 4, my + 4, 3, 3); x.fillRect(mx - 1, my + 7, 2, 2);
    for (let i = 0; i < 3; i++) { const cl = BG.cloudImg(i, false, true); x.globalAlpha = 0.85; x.drawImage(cl, Math.round(W * (0.45 + i * 0.22) - 20), Math.round(H * (0.08 + i * 0.06))); x.globalAlpha = 1; }
    // Скала Хокаге: каменная гряда, склоны к луне светлее
    const rockTop = Math.floor(H * 0.21);
    BG.cols(c, (px) => rockTop + 10 - BG.noise1(px / 40, 7) * 22, roofY + 10, ['#7a6058', '#66504a', '#523e3e', '#3e2e34'], { lit: 0.6, litCol: '#c8c0e8' });
    // слои породы: пологие полосы светлее/темнее
    S.tint(c, 0, rockTop, W, roofY - rockTop, (u, v) => (BG.noise1(u * 3 + v * 9, 41) - 0.5) * 0.35 - u * 0.12);
    // трещины и уступы скалы
    for (let i = 0; i < 26; i++) {
      const cx0 = Hh(i, 2, 31) * W, cy0 = rockTop + 20 + Hh(2, i, 32) * (roofY - rockTop - 20);
      x.fillStyle = '#2e2228'; x.fillRect(Math.round(cx0), Math.round(cy0), 1 + Math.floor(Hh(i, 5, 33) * 8), 1);
      x.fillStyle = '#8a7268'; x.fillRect(Math.round(cx0), Math.round(cy0) - 1, 1 + Math.floor(Hh(i, 5, 33) * 6), 1);
    }
    // четыре высеченных лица: формы с объёмом, свет луны слева сверху
    const { E, R, RR, PO, LN, OR, AND, SUB } = G.icons.shapes, I = G.icons;
    const FW = Math.min(96, Math.floor(W * 0.3)), FH = Math.round(FW * 100 / 72);
    const st = '#86685c', hairC = '#6e564e';
    const HAIR = [
      // Первый: длинные прямые волосы на пробор
      () => OR(E(36, 30, 27, 24), RR(7, 26, 19, 92, 5), RR(53, 26, 65, 92, 5)),
      // Второй: короткие торчащие пряди
      () => OR(E(36, 30, 26, 22), ...[0, 1, 2, 3, 4, 5].map((k) => PO([[12 + k * 9, 24], [16 + k * 9 + (k - 2.5) * 2, 2 + Math.abs(k - 2.5) * 3], [22 + k * 9, 24]]))),
      // Третий: зачёсанные назад волосы и бородка
      () => OR(E(36, 28, 26, 21), RR(8, 24, 16, 52, 4), RR(56, 24, 64, 52, 4), PO([[28, 86], [44, 86], [36, 97]])),
      // Четвёртый: длинная растрёпанная чёлка
      () => OR(E(36, 30, 27, 23), ...[0, 1, 2, 3, 4, 5, 6].map((k) => PO([[8 + k * 9, 26], [10 + k * 9, 4 + (k % 2) * 6], [17 + k * 9, 24]])), PO([[9, 30], [4, 62], [16, 44]]), PO([[63, 30], [68, 62], [56, 44]])),
    ];
    for (let k = 0; k < 4; k++) {
      const face = I.raster(72, 100, (B) => {
        I.fill(B, PO([[14, 66], [58, 66], [70, 100], [2, 100]]), '#5e4844', { lit: 0.3, dark: 0.5 });   // шея-уступ: лицо вырастает из скалы
        I.fill(B, HAIR[k](), hairC, { seam: true, lit: 0.42 });
        const head = OR(E(36, 46, 22, 27), PO([[15, 52], [57, 52], [50, 80], [36, 90], [22, 80]]));
        I.fill(B, head, st, { lit: 0.42, dark: 0.5, vx: 1.1 });
        if (k === 0 || k === 3) I.fill(B, AND(head, R(0, 0, 72, 34)), hairC, { seam: true });     // чёлка
        I.flat(B, OR(RR(19, 40, 32, 44, 2), RR(40, 40, 53, 44, 2)), '#4e3c3a');                  // надбровные дуги
        I.flat(B, OR(E(26, 49, 5.5, 3), E(46, 49, 5.5, 3)), '#2a1e24');                        // глазницы
        I.flat(B, OR(R(21, 51, 31, 52), R(41, 51, 51, 52)), '#b09a8e');                         // освещённое веко
        I.fill(B, PO([[36, 48], [40, 66], [33, 66]]), '#9a8074', { lit: 0.5 });                 // нос
        I.flat(B, PO([[38, 55], [42, 67], [36, 67]]), '#4e3c3a');                              // тень носа
        I.flat(B, OR(R(28, 74, 44, 76), R(30, 76, 42, 77)), '#3a2c30');                          // рот
        I.flat(B, AND(head, PO([[50, 40], [60, 40], [56, 84], [44, 88]])), '#5e4a46');          // тень щеки
        I.outline(B, 0.6);
      });
      const fx = Math.round(W * (0.13 + k * 0.248) - FW / 2), fy = rockTop + 6 + (k % 2) * 8;
      x.drawImage(face, fx, fy, FW, FH);
    }
    S.tint(c, 0, rockTop - 14, W, roofY - rockTop + 24, (u, v) => 0.14 - 0.42 * u - 0.12 * v, { keepInk: false });   // лунный свет слева, правый край в тени
    BG.haze(c, rockY, roofY + 10, '#3a2a50', 0.0, 0.45);
    // лес под скалой и крыши деревни с тёплыми окнами
    x.fillStyle = '#1a1422'; x.fillRect(0, roofY + 4, W, H);
    BG.treeline(c, roofY + 2, W, 71, ['#0a0a14', '#12121e', '#1a1a2a', '#26263a', '#4a4a6a'], { step: 13, size: 8 });
    for (let row = 0; row < 5; row++) {
      for (let i = -1; i < 18; i++) {
        const rx = i * 20 - 6 + Math.floor(Hh(i, 7 + row, 3) * 10) + row * 9, rw = 18 + Math.floor(Hh(7 + row, i, 4) * 12);
        const ry = roofY + 8 + row * 22 + Math.floor(Hh(i, 9 + row, 5) * 8), dk = row * 0.12;
        x.fillStyle = S.toneHex('#2e2232', -dk); x.fillRect(rx, ry, rw, H);
        S.tint(c, rx, ry, rw, 24, (u, v) => 0.12 - u * 0.25 - v * 0.2);
        x.fillStyle = S.toneHex('#3e2a3a', -dk); x.beginPath(); x.moveTo(rx - 5, ry + 2); x.lineTo(rx + rw / 2, ry - 7); x.lineTo(rx + rw + 5, ry + 2); x.fill();
        x.fillStyle = '#7a6a9a'; x.fillRect(rx - 4, ry + 1, Math.round(rw / 2) + 2, 1);           // лунный блик на скате
        for (let w = 0; w < 2; w++) if (Hh(i, w + row * 3, 11) > 0.4) {
          const wx = rx + 4 + w * Math.max(6, rw - 12), wy = ry + 6 + Math.floor(Hh(w, i, 12) * 6);
          BG.glow(c, wx + 1.5, wy + 1.5, 7, '#ffb050', 0.3);
          x.fillStyle = '#ffc870'; x.fillRect(wx, wy, 3, 3); x.fillStyle = '#fff0b8'; x.fillRect(wx, wy, 1, 1);
        }
      }
    }
    BG.haze(c, roofY + 40, H, '#100c1a', 0.2, 0.85);
    return c;
  }

  // Главное меню: «Продолжить» (если есть сохранение), «Новая игра», «Загрузить игру» (по коду), «Настройки»
  function buildItems() {
    items = [];
    if (G.storage.hasSave()) items.push({ label: 'Продолжить', act: () => G.game.loadSaved() });
    items.push({ label: 'Новая игра', act: newGame });
    items.push({ label: 'Загрузить игру', act: loadByCode });
    items.push({ label: 'Настройки', act: () => G.scenes.push(G.scenes.make('settings')) });
  }
  const BTN_H = 22, BTN_GAP = 6, BTN_W = 168;
  const menuY = (i) => G.screen.H - 26 - items.length * (BTN_H + BTN_GAP) + BTN_GAP + i * (BTN_H + BTN_GAP);

  function newGame() {
    if (G.storage.hasSave()) {
      // перезапись сохранения — только после подтверждения
      G.dialog.start('confirm_new', { bottom: 30, onEnd: () => {
        if (G.state.flags._confirm) { G.game.newState(); G.scenes.fadeTo(G.scenes.make('nameinput')); }
        delete G.state.flags._confirm;
      } });
    } else {
      G.game.newState();
      G.scenes.fadeTo(G.scenes.make('nameinput'));
    }
  }

  // «Загрузить игру»: вставить код, полученный в «Сохранение… → Экспорт кода»
  function loadByCode() {
    G.codeBox.open({
      title: 'Загрузить игру', text: '', readonly: false, okLabel: 'ЗАГРУЗИТЬ',
      hint: G.storage.hasSave() ? 'Вставь код сохранения. Текущая игра уйдёт в резервную копию' : 'Вставь код сохранения (его даёт «Сохранение… → Экспорт кода»)',
      onOk: (ta, close) => {
        if (!G.storage.importCode(ta.value)) { G.codeBox.hintErr('Код не подходит. Проверь, что он скопирован целиком'); G.audio.sfx.error(); return; }
        close(); G.audio.sfx.confirm(); G.game.loadSaved();
      },
    });
  }

  return {
    name: 'title',
    enter() {
      bg = buildBg();
      buildItems();
      idx = 0;
      this._resize = G.events.on('resize', () => { bg = buildBg(); });
    },
    exit() { G.events.off('resize', this._resize); },

    update(dt) {
      t += dt;
      if (G.codeBox.isOpen) return;   // окно «Загрузить игру» открыто — меню ждёт
      const I = G.input;
      if (I.repeat('up', dt)) { idx = (idx + items.length - 1) % items.length; G.audio.sfx.select(); }
      if (I.repeat('down', dt)) { idx = (idx + 1) % items.length; G.audio.sfx.select(); }
      if (I.tapNow) {
        items.forEach((it, i) => { if (Math.abs(I.tapNow.y - (menuY(i) + BTN_H / 2)) <= (BTN_H + BTN_GAP) / 2 && Math.abs(I.tapNow.x - G.screen.W / 2) < BTN_W / 2 + 10) { idx = i; this.choose(); } });
        return;
      }
      if (I.pressed('a')) this.choose();
    },

    choose() {
      G.audio.sfx.confirm();
      items[idx].act();
    },

    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, U = G.ui, C = U.C, F = G.font;
      ctx.drawImage(bg, 0, 0);
      // название на свитке: знак Листа сверху, «NARUTO RPG» и крупное «ВОЛЯ ОГНЯ»
      const sy = 10 + Math.round(Math.sin(t * 1.5) * 1.5), sw = Math.min(W - 24, 250), sx = Math.round((W - sw) / 2);
      U.panel(ctx, sx, sy + 12, sw, 64, 'scroll');
      G.icons.draw(ctx, 'emblem', Math.round(W / 2 - 16), sy - 10, 32, 32);
      F.draw(ctx, 'NARUTO RPG', W / 2, sy + 30, { align: 'center', color: C.inkDim });
      const title = 'ВОЛЯ ОГНЯ';
      const tw = F.measure(title);
      const tmp = G.gfx.canvas(tw + 4, 18);
      F.draw(tmp.getContext('2d'), title, 2, 5, { color: C.red, outline: C.ink });
      ctx.drawImage(tmp, Math.round(W / 2 - tmp.lw), sy + 44, tmp.lw * 2, tmp.lh * 2);
      // кнопки главного меню: деревянные дощечки, выбранная — красный лак
      items.forEach((it, i) => {
        const y = menuY(i), sel = i === idx;
        U.button(ctx, Math.round((W - BTN_W) / 2), y, BTN_W, BTN_H, it.label, sel ? 'sel' : 'normal');
      });
      F.small.draw(ctx, 'v' + BUILD.release, W - 5, H - 14, { align: 'right', color: '#c8b48a', shadow: '#160c06' });
    },
  };
});


// ===== scenes/nameinput.js =====
// Ввод имени героя: Ирука спрашивает, игрок вводит имя (реальный <input> → клавиатура iOS).
G.scenes.register('nameinput', () => {
  const el = () => document.getElementById('text-entry');
  const inp = () => document.getElementById('te-input');
  const hint = () => document.getElementById('te-hint');
  let stage = 'ask'; // ask → typing → confirm
  let onOk = null, onKey = null;
  let t = 0;

  // Разрешены буквы, которые есть в пиксельном шрифте, пробел и дефис
  const ALLOWED = /^[A-Za-zА-Яа-яЁё\- ]+$/;

  function validate(v) {
    const s = v.replace(/\s+/g, ' ').trim();
    if (!s) return { err: 'Введи имя' };
    if ([...s].length > 12) return { err: 'Не больше 12 символов' };
    if (!ALLOWED.test(s)) return { err: 'Только буквы, пробел и дефис' };
    return { ok: s };
  }

  return {
    name: 'nameinput',
    enter() {
      stage = 'ask';
      G.dialog.start('ask_name_tmp', { bottom: 30, onEnd: () => this.openEntry() });
    },
    resume() {},

    openEntry() {
      stage = 'typing';
      const box = el();
      box.classList.remove('hidden');
      const i = inp();
      i.value = G.state.hero.name || '';
      hint().textContent = '1–12 символов';
      hint().classList.remove('err');
      setTimeout(() => { i.focus(); }, 50);
      const submit = () => {
        const r = validate(i.value);
        if (r.err) { hint().textContent = r.err; hint().classList.add('err'); G.audio.sfx.error(); return; }
        i.blur();
        box.classList.add('hidden');
        G.state.hero.name = r.ok;
        G.audio.sfx.confirm();
        stage = 'confirm';
        G.dialog.start('intro_name_confirm', {
          bottom: 30,
          onEnd: () => {
            if (G.state.flags.name_ok) {
              G.state.started = true;
              G.storage.save(G.state);
              G.scenes.fadeTo(G.scenes.make('world', Object.assign(G.world.startPos(), { intro: 'home_wake' })));
            } else this.openEntry();
          },
        });
      };
      onOk = (e) => { e.preventDefault(); submit(); };
      onKey = (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
      document.getElementById('te-ok').onpointerdown = onOk;
      i.onkeydown = onKey;
    },

    exit() { el().classList.add('hidden'); },

    update(dt) { t += dt; },

    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, U = G.ui;
      // класс Академии: деревянный пол, доска в раме
      U.backdrop(ctx);
      U.wood(ctx, 0, 90, W, H - 90, '#8a5a36', false, 11);
      U.panel(ctx, 14, 12, W - 28, 64, 'plank');
      ctx.fillStyle = '#1f3a2e'; ctx.fillRect(18, 16, W - 36, 56);
      G.shade.tint(ctx, 18, 16, W - 36, 56, (u, v) => 0.1 - 0.25 * v, { keepInk: false, steps: 10 });
      G.font.draw(ctx, 'Вступительный тест', W / 2, 26, { align: 'center', color: '#e8f0e0' });
      G.font.small.draw(ctx, 'Академия Конохи', W / 2, 48, { align: 'center', color: '#b8d0b8' });
      // Ирука у доски
      G.shade.shadow(ctx, W / 2 + 1, 100, 8, 2, 0.35);
      G.chars.draw(ctx, 'iruka', 'down', 0, W / 2, 100);
    },
  };
});
