    { label: 'Карта: открыть всю', act: () => { G.state.fog = '1'.repeat(G.nav.fogSize().bw * G.nav.fogSize().bh); say('Туман убран'); } },
    { label: 'Сбросить сюжет дня 1', act: () => {
      const f = G.state.flags; for (const k of ['enrolled', 'naruto_invited', 'ramen_done', 'met_naruto', 'met_iruka']) delete f[k];
      Object.assign(G.state.vars, { day: 1, min: 480, friend_naruto: 0 }); G.state.goal = null; G.state.log = [];
      G.state.quests = {}; G.state.tracked = null; G.state.marker = null; G.quests.start('day1'); say('Сброшено');
    } },
  ];
  return {
    name: 'cheats',
    transparent: true,
    rect() { const w = Math.min(G.screen.W - 8, 170), h = items.length * RH + 26; return { x: Math.round((G.screen.W - w) / 2), y: Math.max(22, Math.min(G.screen.H - h - 22, Math.round((G.screen.H - h) / 2))), w, h }; },
    update(dt) {
      const I = G.input, n = items.length;
      if (toastT > 0) { toastT -= dt; if (toastT <= 0) toast = null; }
      if (I.repeat('up', dt)) { idx = (idx + n - 1) % n; G.audio.sfx.select(); }
      if (I.repeat('down', dt)) { idx = (idx + 1) % n; G.audio.sfx.select(); }
      if (I.pressed('b') || I.pressed('menu')) { G.audio.sfx.cancel(); G.scenes.pop(); return; }
      if (I.tapNow) {
        const r = this.rect(), i = Math.floor((I.tapNow.y - r.y - 17) / 12);
        if (i >= 0 && i < n && I.tapNow.x > r.x && I.tapNow.x < r.x + r.w) { idx = i; G.audio.sfx.confirm(); items[i].act(); }
        return;
      }
      if (I.pressed('a')) { G.audio.sfx.confirm(); items[idx].act(); }
    },
    draw(ctx) {
      const r = this.rect(), FS = G.font.small, U = G.ui, C = U.C;
      ctx.globalAlpha = 0.55; ctx.fillStyle = '#0a0604'; ctx.fillRect(0, 0, G.screen.W, G.screen.H); ctx.globalAlpha = 1;
      U.panel(ctx, r.x, r.y, r.w, r.h, 'frame');
      U.title(ctx, 'ЧИТЫ (отладка)', r.x + r.w / 2, r.y - 7, 0);
      items.forEach((it, i) => {
        const y = r.y + 15 + i * RH, sel = i === idx;
        U.row(ctx, r.x + 6, y - 1, r.w - 12, RH, sel);
        FS.draw(ctx, it.label, r.x + 12, y + 2, { color: sel ? '#f8eed0' : C.ink, shadow: sel ? '#5a1408' : null, maxW: r.w - 24 });
      });
      if (toast) {
        const w = FS.measure(toast) + 20;
        U.panel(ctx, Math.round((G.screen.W - w) / 2), r.y + r.h + 4, w, 17, 'night');
        FS.draw(ctx, toast, G.screen.W / 2, r.y + r.h + 9, { align: 'center', color: '#f8eed0' });
      }
    },
  };
});


// ===== scenes/journal.js =====
// Журнал заданий (§2.6): вкладки «Активные / Выполненные», подробности, выбор отслеживаемого.
G.scenes.register('journal', () => {
  let tab = 0, idx = 0, top = 0, detail = null, toast = null, toastT = 0;
  const TABS = ['Активные', 'Завершённые'];

  const items = () => {
    const Qs = G.quests;
    if (tab === 0) return Qs.activeList();
    return Qs.list().filter((id) => !Qs.active(id)).reverse();
  };

  function stepsView(id) {
    const d = G.QUESTS[id], s = G.quests.state(id);
    return d.steps.map((st, i) => ({ st, done: i < s.step || s.st === 'done', cur: s.st === 'active' && i === s.step, future: s.st === 'active' && i > s.step }));
  }

  const ROW = 18, LIST_Y = 44;
  const listH = () => G.screen.H - LIST_Y - 6;
  const rowsN = () => Math.floor((listH() - 12) / ROW);
  const btnRects = () => { const W = G.screen.W, H = G.screen.H, bw = Math.round((W - 14) / 2); return { track: { x: 4, y: H - 30, w: bw, h: 26 }, back: { x: 4 + bw + 6, y: H - 30, w: bw, h: 26 } }; };
  const inR = (t, r) => t.x >= r.x && t.x < r.x + r.w && t.y >= r.y && t.y < r.y + r.h;

  return {
    name: 'journal',
    update(dt) {
      const I = G.input;
      if (toastT > 0) { toastT -= dt; if (toastT <= 0) toast = null; }
      if (detail) {
        const B = btnRects();
        const track = () => { if (G.quests.active(detail)) { G.quests.track(detail); G.audio.sfx.confirm(); toast = 'Отслеживается ★'; toastT = 1.3; } else G.audio.sfx.error(); };
        if (I.pressed('b') || I.pressed('menu')) { G.audio.sfx.cancel(); detail = null; return; }
        if (I.pressed('a')) { track(); return; }
        if (I.tapNow) { if (inR(I.tapNow, B.track)) track(); else if (inR(I.tapNow, B.back)) { G.audio.sfx.cancel(); detail = null; } }
        return;
      }
      const L = items();
      if (I.pressed('b') || I.pressed('menu')) { G.audio.sfx.cancel(); G.scenes.pop(); return; }
      if (I.pressed('left') || I.pressed('right')) { tab = 1 - tab; idx = 0; top = 0; G.audio.sfx.select(); return; }
      if (I.tapNow) {
        const t = I.tapNow;
        if (t.y < LIST_Y - 2 && t.y > 18) { const nt = t.x < G.screen.W / 2 ? 0 : 1; if (nt !== tab) { tab = nt; idx = 0; top = 0; G.audio.sfx.select(); } return; }
        const i = top + Math.floor((t.y - LIST_Y - 6) / ROW);
        if (t.y > LIST_Y + 4 && i >= 0 && i < L.length) { idx = i; detail = L[i]; G.audio.sfx.confirm(); }
        return;
      }
      if (!L.length) return;
      if (I.repeat('up', dt)) { idx = (idx + L.length - 1) % L.length; G.audio.sfx.select(); }
      if (I.repeat('down', dt)) { idx = (idx + 1) % L.length; G.audio.sfx.select(); }
      if (I.pressed('a')) { detail = L[idx]; G.audio.sfx.confirm(); }
    },

    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, F = G.font, U = G.ui, C = U.C;
      U.backdrop(ctx);
      U.title(ctx, 'ЗАДАНИЯ', W / 2, 3, 90);
      if (detail) return this.drawDetail(ctx, detail);

      // вкладки
      TABS.forEach((t, i) => U.tab(ctx, 4 + i * (W / 2 - 2), 21, W / 2 - 6, 20, t, i === tab));
      const L = items(), rows = rowsN();
      U.panel(ctx, 4, LIST_Y, W - 8, listH(), 'frame');
      if (idx < top) top = idx;
      if (idx >= top + rows) top = idx - rows + 1;
      if (!L.length) F.draw(ctx, tab === 0 ? 'Нет активных заданий' : 'Пока пусто', W / 2, LIST_Y + 24, { align: 'center', color: C.inkDim });
      const tracked = G.quests.tracked();
      for (let r = 0; r < rows && top + r < L.length; r++) {
        const id = L[top + r], d = G.QUESTS[id], cat = G.QUEST_CATS[d.cat], s = G.quests.state(id);
        const y = LIST_Y + 7 + r * ROW, sel = top + r === idx;
        U.row(ctx, 9, y, W - 18, ROW - 2, sel);
        F.draw(ctx, cat.icon, 14, y + 3, { color: sel ? '#f8eed0' : C.redDark });
        const col = sel ? '#f8eed0' : s.st === 'failed' ? '#a05a50' : s.st === 'done' ? C.inkFaint : C.ink;
        F.draw(ctx, d.title, 28, y + 3, { color: col, shadow: sel ? '#5a1408' : null, maxW: W - 66 });
        const mark = id === tracked ? '★' : s.st === 'done' ? '✔' : s.st === 'failed' ? '×' : '';
        F.draw(ctx, mark, W - 16, y + 3, { align: 'right', color: id === tracked ? '#f4d46a' : C.inkFaint, shadow: sel ? '#5a1408' : null });
      }
      if (top > 0) F.small.draw(ctx, '▲', W - 18, LIST_Y + 9, { color: C.red });
      if (top + rows < L.length) F.small.draw(ctx, '▼', W - 18, LIST_Y + listH() - 18, { color: C.red });
    },

    drawDetail(ctx, id) {
      const W = G.screen.W, H = G.screen.H, F = G.font, U = G.ui, C = U.C;
      const d = G.QUESTS[id], cat = G.QUEST_CATS[d.cat], s = G.quests.state(id);
      U.panel(ctx, 4, 22, W - 8, H - 58, 'frame');
      const x0 = 14, tw = W - 28;
      let y = 32;
      F.draw(ctx, cat.icon + ' ' + cat.name, x0, y, { color: C.redDark }); y += 15;
      for (const ln of F.wrap(d.title, tw)) { F.draw(ctx, ln, x0, y, { color: C.ink }); y += 14; }
      y += 2;
      for (const ln of F.small.wrap(d.desc, tw)) { F.small.draw(ctx, ln, x0, y, { color: C.inkDim }); y += 12; }
      y += 6;
      for (const v of stepsView(id)) {
        const txt = v.future ? '…' : v.st.text;
        const mark = v.done ? '✔' : v.cur ? '▶' : '·';
        const col = v.done ? C.ok : v.cur ? C.ink : C.inkFaint;
        F.small.draw(ctx, mark, x0, y, { color: v.done ? C.ok : C.red });
        F.small.wrap(txt, tw - 16).forEach((ln) => { F.small.draw(ctx, ln, x0 + 14, y, { color: col }); y += 12; });
        if (v.cur && v.st.time) {
          const ok = G.quests.timeOk(v.st);
          F.small.draw(ctx, `⏰ ${G.game.clock(v.st.time[0])}–${G.game.clock(v.st.time[1] % 1440)}${ok ? '' : ' (сейчас нельзя)'}`, x0 + 14, y, { color: ok ? '#3a62a0' : '#b8321c' }); y += 12;
        }
        y += 3;
      }
      y += 3;
      if (s.due != null && s.st === 'active') {
        const left = s.due - G.state.vars.day;
        F.small.draw(ctx, `Срок: до конца дня ${s.due} (${G.game.dayName(s.due)})${left === 0 ? ' — сегодня!' : ''}`, x0, y, { color: left === 0 ? C.err : C.inkDim }); y += 13;
      }
      if (d.reward && d.reward.text) { F.small.draw(ctx, 'Награда: ' + d.reward.text, x0, y, { color: '#8a5a10', maxW: tw }); y += 13; }
      const st = { active: 'Активно', done: 'Выполнено ✔', failed: 'Провалено' }[s.st];
      F.small.draw(ctx, st + (G.quests.tracked() === id ? ' · ★ отслеживается' : ''), x0, H - 48, { color: s.st === 'failed' ? C.err : C.ok });
      const B = btnRects();
      U.button(ctx, B.track.x, B.track.y, B.track.w, B.track.h, 'Отслеживать', s.st === 'active' ? 'sel' : 'dis');
      U.button(ctx, B.back.x, B.back.y, B.back.w, B.back.h, 'Назад', 'normal');
      if (toast) {
        const w = F.measure(toast) + 22;
        U.panel(ctx, Math.round((W - w) / 2), H - 78, w, 19, 'night');
        F.draw(ctx, toast, W / 2, H - 73, { align: 'center', color: '#f4d46a' });
      }
    },
  };
});


// ===== scenes/calendar.js =====
// Календарь (месяц = 4 недели, 2 страницы за игру) и расписания персонажей.
G.scenes.register('calendar', () => {
  const F = G.font, P = G.PAL;
  const STORY_NAMES = { tora: 'Пропал кот Тора', konohamaru: 'Мелкий Коноханамару', iruka_story: 'Вечер с Ирукой', hinata_rain: 'Дождь и Хината', ino_sakura: 'Ино и Сакура',
    sasuke_sunset: 'Закат с Саске', clouds: 'Шикамару и облака', anko: 'Анко и данго', will_fire: 'Воля Огня', mizuki1: 'Подозрительный Мизуки', mizuki2: 'Мизуки и свиток',
    kiba: 'Киба', roofs: 'Крыши с Наруто', prank: 'Шалость Наруто', lee: 'Рок Ли', festival: 'Фестиваль', night: 'Ночь экзамена' };
  const WEATHER = { sun: 'ясно', cloud: 'облачно', rain: 'дождь' };
  let tab = 0, sel = G.state.vars.day, ci = 0, wk = true, scroll = 0;
  const ids = G.schedule.who();
  const page = () => Math.floor((sel - 1) / 28);

  function dayItems(d) {
    const out = [];
    const ev = G.calendar.EVENTS[d];
    if (ev) out.push({ c: '#c8581a', t: ev });
    for (const e of G.STORY) if (e.day === d && STORY_NAMES[e.id] && ev !== STORY_NAMES[e.id]) out.push({ c: '#c8581a', t: STORY_NAMES[e.id] });
    if (G.calendar.BDAY[d]) out.push({ c: '#c89010', t: 'День рождения: ' + G.chars.nameOf(G.calendar.BDAY[d]) });
    if (G.academy.isSchoolDay(d)) out.push({ c: '#3a62a0', t: 'Уроки 8:00–13:00' + ((d - 1) % 7 === 4 ? ' · тест' : '') });
    else if (d < 54) out.push({ c: '#8a7a60', t: (d - 1) % 7 >= 5 ? 'Выходной' : d === 1 ? 'Первый день в деревне' : 'Нет уроков' });
    const Q = G.state.quests || {};
    for (const id of Object.keys(Q)) if (Q[id].st === 'active' && Q[id].due === d && G.QUESTS[id]) out.push({ c: '#b8321c', t: 'Срок: ' + G.QUESTS[id].title });
    out.push({ c: '#6a5238', t: 'Погода: ' + WEATHER[G.life.weather(d)] });
    return out;
  }
  function marks(d) {
    const m = [];
    if (G.calendar.EVENTS[d] || G.STORY.some((e) => e.day === d && STORY_NAMES[e.id])) m.push('#c8581a');
    if (G.calendar.BDAY[d]) m.push('#c89010');
    const Q = G.state.quests || {};
    if (Object.keys(Q).some((id) => Q[id].st === 'active' && Q[id].due === d)) m.push('#b8321c');
    return m;
  }
  const GY = 62, CH = 30;   // верх сетки дней и высота ячейки
  const hh = (a, b) => String(a).padStart(2, '0') + '–' + String(b).padStart(2, '0');

  return {
    name: 'calendar',
    update(dt) {
      const I = G.input, W = G.screen.W;
      if (I.pressed('b') || I.pressed('menu')) { G.audio.sfx.cancel(); G.scenes.pop(); return; }
      if (I.tapNow) {
        const t = I.tapNow;
        if (t.y >= 20 && t.y < 42) { const nt = t.x < W / 2 ? 0 : 1; if (nt !== tab) { tab = nt; G.audio.sfx.select(); } return; }
        if (tab === 0) {
          const cw = (W - 14) / 7, col = Math.floor((t.x - 7) / cw), row = Math.floor((t.y - GY) / CH);
          if (col >= 0 && col < 7 && row >= 0 && row < 4) { sel = page() * 28 + row * 7 + col + 1; G.audio.sfx.select(); }
          else if (t.y >= 42 && t.y < GY) { sel = t.x < W / 2 ? Math.max(1, sel - 28) : Math.min(56, sel + 28); G.audio.sfx.select(); }
        } else {
          if (t.y < 68) { ci = (ci + (t.x < W / 2 ? ids.length - 1 : 1)) % ids.length; scroll = 0; G.audio.sfx.select(); }
          else if (t.y < 90) { wk = !wk; scroll = 0; G.audio.sfx.select(); }
        }
        return;
      }
      if (I.pressed('a')) { tab = 1 - tab; G.audio.sfx.select(); return; }
      if (tab === 0) {
        if (I.repeat('left', dt)) { sel = Math.max(1, sel - 1); G.audio.sfx.select(); }
        if (I.repeat('right', dt)) { sel = Math.min(56, sel + 1); G.audio.sfx.select(); }
        if (I.repeat('up', dt)) { sel = Math.max(1, sel - 7); G.audio.sfx.select(); }
        if (I.repeat('down', dt)) { sel = Math.min(56, sel + 7); G.audio.sfx.select(); }
      } else {
        if (I.repeat('left', dt)) { ci = (ci + ids.length - 1) % ids.length; scroll = 0; G.audio.sfx.select(); }
        if (I.repeat('right', dt)) { ci = (ci + 1) % ids.length; scroll = 0; G.audio.sfx.select(); }
        if (I.pressed('up') || I.pressed('down')) { wk = !wk; scroll = 0; G.audio.sfx.select(); }
      }
    },
    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, V = G.state.vars, U = G.ui;
      U.backdrop(ctx);
      U.title(ctx, 'КАЛЕНДАРЬ', W / 2, 3, 100);
      ['Дни', 'Расписание'].forEach((t, i) => U.tab(ctx, 4 + i * (W / 2 - 2), 21, W / 2 - 6, 20, t, i === tab));
      if (tab === 0) this.drawDays(ctx, W, H, V); else this.drawSched(ctx, W, H, V);
    },
    drawDays(ctx, W, H, V) {
      const U = G.ui, C = U.C, pg = page(), cw = (W - 14) / 7;
      U.panel(ctx, 4, 44, W - 8, GY + 4 * CH - 40, 'frame');
      for (let c = 0; c < 7; c++) F.small.draw(ctx, ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'][c], 7 + c * cw + cw / 2, 49, { align: 'center', color: c > 4 ? C.red : C.inkDim });
      for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) {
        const d = pg * 28 + r * 7 + c + 1;
        if (d > 56) continue;
        const x = Math.round(7 + c * cw), y = GY + r * CH, w = Math.round(cw) - 2;
        U.card(ctx, x, y, w, CH - 3, d === sel);
        if (d === V.day) { ctx.fillStyle = C.ok; ctx.fillRect(x + 3, y + 3, 5, 5); }
        F.small.draw(ctx, String(d), x + 5 + (d === V.day ? 5 : 0), y + 3, { color: d < V.day ? C.inkFaint : c > 4 ? C.red : C.ink });
        marks(d).slice(0, 3).forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(x + 4 + i * 6, y + CH - 11, 5, 5); });
        if (G.academy.isSchoolDay(d)) { ctx.fillStyle = '#3a62a0'; ctx.fillRect(x + w - 8, y + 4, 5, 5); }
      }
      // подробности выбранного дня
      const dy = GY + 4 * CH + 8;
      U.panel(ctx, 4, dy, W - 8, H - dy - 4, 'well');
      let y = dy + 8;
      F.draw(ctx, `День ${sel} · ${G.game.dayNameFull(sel)}`, 12, y, { color: C.redDark }); y += 16;
      for (const it of dayItems(sel)) {
        if (y > H - 20) break;
        ctx.fillStyle = it.c; ctx.fillRect(12, y + 3, 4, 4);
        for (const ln of F.small.wrap(it.t, W - 36)) { if (y > H - 20) break; F.small.draw(ctx, ln, 21, y, { color: C.ink }); y += 12; }
        y += 2;
      }
    },
    drawSched(ctx, W, H, V) {
      const U = G.ui, C = U.C, id = ids[ci], s = G.SCHED[id];
      U.panel(ctx, 4, 44, W - 8, H - 50, 'frame');
      F.draw(ctx, '‹', 16, 53, { color: C.red }); F.draw(ctx, '›', W - 20, 53, { color: C.red });
      F.draw(ctx, G.chars.nameOf(id), W / 2, 53, { align: 'center', color: C.redDark });
      const known = V.day >= s.since;
      if (!known) { F.draw(ctx, 'Пока не знакомы', W / 2, 96, { align: 'center', color: C.inkDim }); F.small.draw(ctx, `(появится с дня ${s.since})`, W / 2, 112, { align: 'center', color: C.inkDim }); return; }
      F.small.draw(ctx, 'Сейчас: ' + G.schedule.label(id), 12, 72, { color: C.redDark, maxW: W - 24 });
      U.row(ctx, 10, 87, W - 20, 17, true);
      F.draw(ctx, wk ? 'БУДНИ' : 'ВЫХОДНЫЕ', W / 2, 90, { align: 'center', color: '#f8eed0', shadow: '#5a1408' });
      F.small.draw(ctx, '⇅', W - 20, 91, { color: '#f4d46a' });
      const rows = G.schedule.rowsFor(id, wk ? 36 : 41);
      let y = 112;
      for (const r of rows) {
        const now = G.schedule.at(id) === r;
        F.small.draw(ctx, hh(r[1], r[2]), 12, y, { color: now ? C.red : C.inkDim });
        const lines = F.small.wrap(r[3], W - 66);
        lines.forEach((ln, i) => F.small.draw(ctx, ln, 54, y + i * 12, { color: now ? C.red : C.ink }));
        y += Math.max(1, lines.length) * 12 + 6;
        if (y > H - 20) break;
      }
      if (!rows.length) F.small.draw(ctx, 'Нет данных', 12, y, { color: C.inkDim });
    },
  };
});


// ===== scenes/charcreate.js =====
// Вступительный тест у Ируки (план §3): распределить 12 очков по 8 характеристикам (база 3, максимум 7)
// и выбрать 2 стартовых навыка из 9. onDone() — продолжение сюжета.
G.scenes.register('charcreate', (onDone) => {
  const B = G.STAT_BASE, MAX = G.STAT_MAX_START;
  const vals = {}; for (const s of G.STATS) vals[s.id] = B;
  const picked = [];
  let page = 0, idx = 0, msg = null, msgT = 0, confirm = false;
  const left = () => G.STAT_POINTS - G.STATS.reduce((a, s) => a + vals[s.id] - B, 0);
  const ROW = 20, TOP = 46;
  const say = (t) => { msg = t; msgT = 1.6; };

  const S = {
    name: 'charcreate',
    // для автотеста и кнопки «Случайно»
    finish(stats, skills) {
      G.state.hero.stats = Object.assign({}, vals, stats || {});
      G.state.hero.skills = (skills || picked).slice(0, 2);
      G.game.note('Вступительный тест пройден');
      G.scenes.pop();
      onDone && onDone();
    },
    randomize() {
      for (const s of G.STATS) vals[s.id] = B;
      let n = G.STAT_POINTS;
      while (n > 0) { const s = G.STATS[Math.floor(Math.random() * G.STATS.length)]; if (vals[s.id] < MAX) { vals[s.id]++; n--; } }
    },
    rows() { return page === 0 ? G.STATS.length + 2 : G.SKILLS.length + 1; },

    change(d) {
      const s = G.STATS[idx];
      if (!s) return;
      if (d > 0 && (left() <= 0 || vals[s.id] >= MAX)) { G.audio.sfx.error(); say(left() <= 0 ? 'Очки закончились' : `Максимум на старте — ${MAX}`); return; }
      if (d < 0 && vals[s.id] <= B) { G.audio.sfx.error(); return; }
      vals[s.id] += d; G.audio.sfx.blip();
    },
    activate() {
      if (page === 0) {
        if (idx < G.STATS.length) { this.change(+1); return; }
        if (idx === G.STATS.length) { this.randomize(); G.audio.sfx.puff(); return; }
        if (left() > 0) { G.audio.sfx.error(); say(`Осталось очков: ${left()}`); return; }
        page = 1; idx = 0; G.audio.sfx.confirm(); return;
      }
      if (idx < G.SKILLS.length) {
        const id = G.SKILLS[idx].id, i = picked.indexOf(id);
        if (i >= 0) { picked.splice(i, 1); G.audio.sfx.cancel(); }
        else if (picked.length >= 2) { G.audio.sfx.error(); say('Можно выбрать только 2 навыка'); }
        else { picked.push(id); G.audio.sfx.select(); }
        return;
      }
      if (picked.length < 2) { G.audio.sfx.error(); say('Выбери 2 навыка'); return; }
      confirm = true; G.audio.sfx.confirm();
    },

    update(dt) {
      const I = G.input;
      if (msgT > 0) { msgT -= dt; if (msgT <= 0) msg = null; }
      if (confirm) {
        if (I.pressed('a') || (I.tapNow && I.tapNow.x < G.screen.W / 2)) { G.audio.sfx.confirm(); this.finish(); }
        else if (I.pressed('b') || I.tapNow) { confirm = false; G.audio.sfx.cancel(); }
        return;
      }
      const n = this.rows();
      if (I.repeat('up', dt)) { idx = (idx + n - 1) % n; G.audio.sfx.select(); }
      if (I.repeat('down', dt)) { idx = (idx + 1) % n; G.audio.sfx.select(); }
      if (page === 0 && I.repeat('right', dt)) this.change(+1);
      if (page === 0 && I.repeat('left', dt)) this.change(-1);
      if (I.pressed('b') && page === 1) { page = 0; idx = G.STATS.length + 1; G.audio.sfx.cancel(); return; }
      if (I.pressed('a')) this.activate();
      if (I.tapNow) {
        const t = I.tapNow, i = Math.floor((t.y - TOP) / ROW);
        if (i < 0 || i >= n) return;
        idx = i;
        if (page === 0 && i < G.STATS.length) this.change(t.x > G.screen.W - 34 ? +1 : t.x > G.screen.W - 70 ? -1 : 0);
        else this.activate();
      }
    },

    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, F = G.font, S = G.font.small, U = G.ui, C = U.C;
      U.backdrop(ctx);
      U.title(ctx, 'ВСТУПИТЕЛЬНЫЙ ТЕСТ', W / 2, 3, 150);
      const bar = (txt, right, rcol) => { U.panel(ctx, 4, 22, W - 8, 20, 'frame'); S.draw(ctx, txt, 14, 28, { color: C.inkDim }); right && S.draw(ctx, right, W - 14, 28, { align: 'right', color: rcol }); };
      const rowBg = (y, sel) => { U.row(ctx, 6, y, W - 12, ROW - 3, sel); };
      if (page === 0) {
        const l = left();
        bar('Характеристики', `Очки: ${l}`, l ? '#8a5a10' : C.ok);
        U.panel(ctx, 4, TOP - 2, W - 8, (G.STATS.length + 2) * ROW + 6, 'frame');
        G.STATS.forEach((s, i) => {
          const y = TOP + 3 + i * ROW, sel = i === idx, v = vals[s.id];
          rowBg(y, sel);
          F.draw(ctx, s.name, 14, y + 2, { color: sel ? '#f8eed0' : C.ink, shadow: sel ? '#5a1408' : null, maxW: 90 });
          // кружки: база — тёмные, добавленные — красные, свободные — пустые
          for (let k = 0; k < MAX; k++) {
            const cx = 112 + k * 9, cy = y + 7;
            ctx.fillStyle = k < B ? '#6a5238' : k < v ? C.red : 'rgba(46,30,20,.28)';
            ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 7); ctx.fill();
            if (k < v && k >= B) { ctx.fillStyle = C.redHi; ctx.fillRect(cx - 1, cy - 2, 1, 1); }
          }
          U.button(ctx, W - 68, y - 1, 20, 16, '−', v > B ? 'normal' : 'dis');
          F.draw(ctx, String(v), W - 40, y + 2, { align: 'center', color: sel ? '#f4d46a' : C.redDark, shadow: sel ? '#5a1408' : null });
          U.button(ctx, W - 30, y - 1, 20, 16, '+', l > 0 && v < MAX ? 'normal' : 'dis');
        });
        const yb = TOP + 3 + G.STATS.length * ROW;
        [['Случайно', idx === G.STATS.length], [l > 0 ? `Далее (осталось ${l})` : 'Далее', idx === G.STATS.length + 1]].forEach(([t, sel], k) => {
          const y = yb + k * ROW;
          rowBg(y, sel);
          F.draw(ctx, t, W / 2, y + 2, { align: 'center', color: sel ? '#f8eed0' : C.redDark, shadow: sel ? '#5a1408' : null });
        });
        const st = G.STATS[idx];
        this.drawDesc(ctx, st ? st.desc : idx === G.STATS.length ? 'Распределить очки случайно.' : 'Перейти к выбору навыков.');
      } else {
        bar('Навыки: выбери 2', `${picked.length}/2`, picked.length === 2 ? C.ok : '#8a5a10');
        U.panel(ctx, 4, TOP - 2, W - 8, (G.SKILLS.length + 1) * ROW + 6, 'frame');
        G.SKILLS.forEach((s, i) => {
          const y = TOP + 3 + i * ROW, sel = i === idx, on = picked.includes(s.id);
          rowBg(y, sel);
          // чекбокс-печать
          ctx.fillStyle = sel ? '#f8eed0' : C.ink; ctx.fillRect(13, y + 3, 9, 9); ctx.fillStyle = sel ? C.red : '#ecdcb0'; ctx.fillRect(14, y + 4, 7, 7);
          if (on) { ctx.fillStyle = sel ? '#f8eed0' : C.red; ctx.fillRect(16, y + 6, 3, 3); }
          F.draw(ctx, s.name, 28, y + 2, { color: sel ? '#f8eed0' : on ? C.redDark : C.ink, shadow: sel ? '#5a1408' : null, maxW: W - 66 });
          if (s.now) F.draw(ctx, '★', W - 16, y + 2, { align: 'right', color: sel ? '#f4d46a' : '#8a5a10' });
        });
        const y = TOP + 3 + G.SKILLS.length * ROW, sel = idx === G.SKILLS.length;
        rowBg(y, sel);
        F.draw(ctx, 'Готово', W / 2, y + 2, { align: 'center', color: sel ? '#f8eed0' : C.redDark, shadow: sel ? '#5a1408' : null });
        const s = G.SKILLS[idx];
        this.drawDesc(ctx, s ? s.desc + (s.now ? '  ★ действует сразу' : '') : 'Закончить тест.');
      }
      if (msg) {
        const w = F.measure(msg) + 22;
        U.panel(ctx, Math.round((W - w) / 2), H / 2 - 10, w, 20, 'night');
        F.draw(ctx, msg, W / 2, H / 2 - 4, { align: 'center', color: '#f4d46a' });
      }
      if (confirm) {
        ctx.globalAlpha = 0.6; ctx.fillStyle = '#0a0604'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
        const bh = 112, by = Math.round(H / 2 - bh / 2);
        U.panel(ctx, 10, by, W - 20, bh, 'frame');
        F.draw(ctx, 'Всё верно?', W / 2, by + 11, { align: 'center', color: C.redDark });
        const line = G.STATS.map((s) => `${s.short} ${vals[s.id]}`).join(' · ');
        S.wrap(line, W - 44).forEach((ln, i) => S.draw(ctx, ln, W / 2, by + 30 + i * 12, { align: 'center', color: C.inkDim }));
        S.draw(ctx, picked.map((id) => G.SKILLS.find((s) => s.id === id).name).join(', '), W / 2, by + 56, { align: 'center', color: C.redDark, maxW: W - 44 });
        U.button(ctx, 20, by + bh - 34, Math.round((W - 52) / 2), 24, 'Да', 'sel');
        U.button(ctx, 32 + Math.round((W - 52) / 2), by + bh - 34, Math.round((W - 52) / 2), 24, 'Нет', 'normal');
      }
    },
    drawDesc(ctx, text) {
      const W = G.screen.W, H = G.screen.H, S = G.font.small;
      const lines = S.wrap(text, W - 32).slice(0, 3);
      const h = 18 + lines.length * 12;
      const y = H - h - 4;
      G.ui.panel(ctx, 4, y, W - 8, h, 'frame');
      lines.forEach((ln, i) => S.draw(ctx, ln, 14, y + 9 + i * 12, { color: G.ui.C.ink }));
    },
  };
  return S;
});

// Статус героя (меню → «Статус»): нужды, характеристики, навыки, дружба, день и погода.
G.scenes.register('status', () => {
  const FRIENDS = Object.keys(G.FRIENDS);
  return {
    name: 'status',
    update() {
      const I = G.input;
      if (I.pressed('b') || I.pressed('a') || I.pressed('menu') || I.tapNow) { G.audio.sfx.cancel(); G.scenes.pop(); }
    },
    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, F = G.font, S = G.font.small, U = G.ui, C = U.C, g = G.game, v = g.v;
      U.backdrop(ctx);
      U.title(ctx, 'СТАТУС', W / 2, 3, 80);
      let y = 20;
      // герой, неделя, дата и погода
      U.panel(ctx, 4, y, W - 8, 44, 'frame');
      F.draw(ctx, G.state.hero.name || 'Герой', 14, y + 9, { color: C.redDark });
      S.draw(ctx, `Неделя ${g.week()}`, W - 14, y + 11, { align: 'right', color: C.inkDim });
      const wt = G.life.WEATHER[G.life.weather()];
      S.draw(ctx, `${g.dayName()}, день ${v.day} · ${g.clock()} · ${G.life.period()}`, 14, y + 28, { color: C.inkDim, maxW: W - 90 });
      S.draw(ctx, wt.icon + ' ' + wt.name, W - 14, y + 28, { align: 'right', color: '#3a62a0' });
      y += 48;
      // нужды: бамбуковые шкалы
      const bars = [['Здоровье', v.hp, C.hp], ['Чакра', v.chakra, C.chakra], ['Сытость', v.food, C.food], ['Энергия', v.energy, C.energy], ['Настроение', v.mood, '#a860c0']];
      U.panel(ctx, 4, y, W - 8, bars.length * 16 + 12, 'frame');
      bars.forEach(([nm, val, col], i) => {
        const yy = y + 9 + i * 16;
        S.draw(ctx, nm, 14, yy, { color: C.ink });
        const bw = W - 8 - 14 * 2 - 82 - 62;
        U.gauge(ctx, 14 + 82, yy + 1, bw, 7, Math.max(0, Math.min(100, val)) / 100, col);
        S.draw(ctx, i === 4 ? g.moodName() : String(Math.round(val)), W - 14, yy, { align: 'right', color: val < 20 ? C.err : C.ink });
      });
      y += bars.length * 16 + 16;
      // характеристики
      const rows = Math.ceil(G.STATS.length / 2);
      U.panel(ctx, 4, y, W - 8, rows * 15 + 14, 'well');
      if (!G.hero.ready()) S.draw(ctx, 'Вступительный тест ещё не пройден', W / 2, y + 12, { align: 'center', color: C.inkDim });
      else G.STATS.forEach((st, i) => {
        const cw = Math.floor((W - 24) / 2), x = 12 + (i % 2) * cw, yy = y + 8 + Math.floor(i / 2) * 15;
        S.draw(ctx, st.id === 'ctrl' ? 'Контроль' : st.name, x, yy, { color: C.ink });
        F.draw(ctx, String(G.hero.stat(st.id)), x + cw - 12, yy - 2, { align: 'right', color: C.redDark });
      });
      y += rows * 15 + 18;
      // навыки, Академия, дружба
      U.panel(ctx, 4, y, W - 8, H - y - 4, 'frame');
      let ty = y + 9;
      const sk = (G.state.hero.skills || []).map((id) => (G.SKILLS.find((s) => s.id === id) || {}).name).filter(Boolean);
      S.draw(ctx, 'Навыки: ' + (sk.join(', ') || '—'), 12, ty, { color: C.redDark, maxW: W - 24 }); ty += 13;
      const A = G.academy, vv = G.state.vars;
      S.draw(ctx, `Оценки ${A.avg() || '—'} · посещ. ${A.attendance()}% · реп. ${vv.rep || 0}`, 12, ty, { color: '#3a62a0', maxW: W - 24 }); ty += 12;
      S.draw(ctx, `Неделя ${g.week()}/8 · экзамен через ${Math.max(0, 54 - vv.day)} дн. · свитки ${vv.scrolls || 0}`, 12, ty, { color: C.inkDim, maxW: W - 24 }); ty += 15;
      const met = FRIENDS.filter((id) => G.state.flags['met_' + id]);
      F.draw(ctx, 'Дружба', 12, ty, { color: C.redDark }); ty += 16;
      if (!met.length) S.draw(ctx, 'Пока ни с кем не знаком', 12, ty, { color: C.inkDim });
      met.forEach((id, i) => {
        const cw = Math.floor((W - 24) / 2), x = 12 + (i % 2) * cw, yy = ty + Math.floor(i / 2) * 13;
        if (yy > H - 18) return;
        const hn = Math.max(0, Math.min(5, G.friends.level(id)));
        S.draw(ctx, G.chars.nameOf(id), x, yy, { color: C.ink });
        S.draw(ctx, '♥'.repeat(hn), x + cw - 12 - S.measure('·'.repeat(5 - hn)), yy, { align: 'right', color: C.red });
        S.draw(ctx, '·'.repeat(5 - hn), x + cw - 12, yy, { align: 'right', color: C.inkFaint });
      });
    },
  };
});

// ===== scenes/savemenu.js =====
// Меню «Сохранение» (этап 4): сохранить, экспорт и импорт кода, восстановить утреннюю копию.
G.scenes.register('savemenu', () => {
  let idx = 0, toast = null, toastT = 0;
  const W = 236;
  const say = (t) => { toast = t; toastT = 1.8; };
  const world = () => G.scenes.stack.find((s) => s.name === 'world');

  const openBox = (o) => G.codeBox.open(o), hintErr = (t) => G.codeBox.hintErr(t);

  const items = () => {
    const bi = G.storage.backupInfo();
    return [
      { label: 'Сохранить сейчас', act: () => { const w = world(); w && w.savePos(); say(G.storage.save(G.state) ? 'Сохранено ✔' : 'Не удалось сохранить! Память браузера полна?'); } },
      { label: 'Экспорт кода', act: () => {
        const w = world(); w && w.savePos(); G.storage.save(G.state);
        openBox({ title: 'Код сохранения', text: G.storage.exportCode(), readonly: true, okLabel: 'КОПИРОВАТЬ',
          hint: 'Сохрани код в Заметках — по нему можно восстановить игру',
          onOk: (ta, close) => {
            ta.select();
            const done = () => { document.getElementById('cb-hint').textContent = 'Скопировано ✔'; };
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand('copy'); done(); });
            else { document.execCommand('copy'); done(); }
          } });
      } },
      { label: 'Импорт кода', act: () => {
        openBox({ title: 'Вставь код сохранения', text: '', readonly: false, okLabel: 'ЗАГРУЗИТЬ',
          hint: 'Текущая игра уйдёт в резервную копию',
          onOk: (ta, close) => {
            if (!G.storage.importCode(ta.value)) { hintErr('Код не подходит. Проверь, что он скопирован целиком'); G.audio.sfx.error(); return; }
            close(); G.audio.sfx.confirm(); G.game.loadSaved();
          } });
      } },
      { label: bi ? 'Резервная копия' : 'Резервной копии нет', value: bi ? `день ${bi.day}, ${G.game.clock(bi.min)}` : null, dis: !bi, act: () => {
        if (!bi) { G.audio.sfx.error(); return; }
        if (G.storage.restoreBackup()) { G.audio.sfx.confirm(); G.game.loadSaved(); }
      } },
      { label: 'Назад', act: () => G.scenes.pop() },
    ];
  };

  return {
    name: 'savemenu',
    transparent: true,
    openBox, // для автотеста
    get boxOpen() { return G.codeBox.isOpen; },
    update(dt) {
      if (G.codeBox.isOpen) return;
      const I = G.input, list = items();
      if (toastT > 0) { toastT -= dt; if (toastT <= 0) toast = null; }
      if (I.repeat('up', dt)) { idx = (idx + list.length - 1) % list.length; G.audio.sfx.select(); }
      if (I.repeat('down', dt)) { idx = (idx + 1) % list.length; G.audio.sfx.select(); }
      if (I.pressed('b') || I.pressed('menu')) { G.audio.sfx.cancel(); G.scenes.pop(); return; }
      if (I.tapNow) {
        const i = G.ui.menu.hit(I.tapNow, list.length, W);
        if (i >= 0) { idx = i; G.audio.sfx.confirm(); list[i].act(); }
        return;
      }
      if (I.pressed('a')) { G.audio.sfx.confirm(); list[idx].act(); }
    },
    draw(ctx) {
      const list = items();
      const r = G.ui.menu.draw(ctx, 'СОХРАНЕНИЕ', list, idx, W);
      if (toast) {
        const F = G.font, w = F.measure(toast) + 22;
        G.ui.panel(ctx, Math.round((G.screen.W - w) / 2), r.y + r.h + 6, w, 19, 'night');
        F.draw(ctx, toast, G.screen.W / 2, r.y + r.h + 11, { align: 'center', color: '#f4d46a' });
      }
    },
  };
});


// ===== scenes/battle_fx.js =====
// Визуальные эффекты боя «Дуэль шиноби»: всплывающий урон, дым, искры, снаряды, ауры, печати.
// Вынесено из scenes/battle.js (пункт «разбить монолит боя»): ядро боя отвечает за состояния и ходы,
// этот модуль — только за картинку эффектов. Поведение не изменилось (проверяется tools/node/golden.js).
//
// C — контекст боя, собирается один раз в scenes/battle.js:
//   { fx, layout, X, rnd, PAL, P, E, sgn, other, state, seals }
// fx и layout — объекты, которые меняются на месте (ссылка стабильна); state и seals — изменяемые
// переменные ядра, поэтому приходят геттерами и читаются как C.state / C.seals.
G.battleFx = {
  make(C) {
    const fx = C.fx, layout = C.layout, X = C.X, rnd = C.rnd, PAL = C.PAL;
    const P = C.P, E = C.E, sgn = C.sgn, other = C.other;

    const pop = (f, text, col, big) => fx.pops.push({ x: X(f.pos) + rnd(-6, 6), y: layout.groundY - 46, text, col: col || PAL.white, t: 0, big });
    const puff = (pos, n = 10) => { for (let i = 0; i < n; i++) fx.puffs.push({ x: X(pos) + rnd(-8, 8), y: layout.groundY - rnd(4, 30), r: rnd(3, 7), vx: rnd(-20, 20), vy: rnd(-20, 4), t: 0 }); };

    // ── визуальные эффекты боя: удары, урон, метание, печати, техники ──
    const cy = () => layout.groundY - 22;
    const V1 = (o) => { o.t = 0; o.delay = o.delay || 0; fx.vfx.push(o); return o; };
    const hurt = (f, d, dirx) => { f.hurt = 0.42; f.kb = (dirx || (f === P ? -1 : 1)) * Math.min(12, 4 + d * 0.5); f.hs = d >= 15 ? 0.12 : 0.06; };
    const impact = (f, d, col, kind) => {
      const x = X(f.pos), big = d >= 15, dirx = f === P ? -1 : 1;
      hurt(f, d, sgn(other(f), f));
      V1({ type: 'star', x, y: cy(), r: big ? 20 : 13, dur: 0.28, col: col || '#fff6c8' });
      V1({ type: 'slash', x, y: cy(), dir: dirx, dur: 0.26, big, col: kind === 'nin' ? '#9ad0ff' : '#ffffff' });
      for (let i = 0; i < (big ? 12 : 6); i++) V1({ type: 'bit', x, y: cy(), vx: rnd(-70, 70) + dirx * 30, vy: rnd(-90, -10), dur: 0.5, col: i % 2 ? '#ffd84a' : '#ffffff' });
      if (big) { fx.hitstop = 0.09; fx.zoom = 1.14; fx.zoomX = x; }
    };
    const lunge = (f, mul = 1) => { f.lg = sgn(f, other(f)) * 10 * mul; };
    const proj = (from, to, kind, n = 1) => {
      for (let i = 0; i < n; i++) V1({ type: 'proj', kind, x: X(from.pos), y: cy() - 4 + (i - (n - 1) / 2) * 7, x2: X(to.pos), y2: cy() - 2 + (i - (n - 1) / 2) * 5, dur: 0.22, delay: i * 0.05 });
    };
    const burst = (pos, col, r = 30) => { V1({ type: 'ring', x: X(pos), y: cy(), r, dur: 0.45, col }); V1({ type: 'ring', x: X(pos), y: cy(), r: r * 0.6, dur: 0.35, col: '#ffffff' }); };
    const aura = (f, col, dur = 0.9) => V1({ type: 'aura', f, dur, col });
    const leaves = (pos, n = 14) => { for (let i = 0; i < n; i++) V1({ type: 'leaf', x: X(pos), y: cy(), a: rnd(0, 6.28), sp: rnd(30, 80), dur: rnd(0.6, 1) }); };

    function enemyFx(k) {
      if (k === 'bug') { proj(E, P, 'bug', 4); aura(E, '#4a4a2a', 0.6); }
      else if (k === 'duo') { lunge(E, 1.5); V1({ type: 'ring', x: X(E.pos), y: cy(), r: 24, dur: 0.35, col: '#c8a070' }); proj(E, P, 'fang', 2); }
      else if (k === 'snake') { proj(E, P, 'snake', 3); aura(E, '#6a3a8a', 0.6); }
      else if (k === 'blades') { lunge(E, 1.4); V1({ type: 'slash', x: X(P.pos), y: cy(), dir: -sgn(E, P), dur: 0.4, big: true, col: '#8ad0ff' }); }
      else if (k === 'smoke') { puff(E.pos, 16); puff(P.pos, 10); }
      else if (k === 'fire') { proj(E, P, 'fire', 1); aura(E, '#ff7a20', 0.5); }
    }
    function updateVfx(dt) {
      for (const v of fx.vfx) {
        if (v.delay > 0) { v.delay -= dt; continue; }
        v.t += dt;
        if (v.type === 'bit') { v.x += v.vx * dt; v.y += v.vy * dt; v.vy += 260 * dt; }
      }
      fx.vfx = fx.vfx.filter((v) => v.delay > 0 || v.t < v.dur);
      for (const f of [P, E]) {
        if (f.hurt > 0) f.hurt = Math.max(0, f.hurt - dt);
        if (f.hs > 0) f.hs = Math.max(0, f.hs - dt);
        if (f.kb) { f.kb *= Math.pow(0.002, dt); if (Math.abs(f.kb) < 0.3) f.kb = 0; }
        if (f.lg) { f.lg *= Math.pow(0.0005, dt); Math.abs(f.lg) < 0.3 && (f.lg = 0); }
      }
    }
    function drawVfx(ctx, t) {
      for (const v of fx.vfx) {
        if (v.delay > 0) continue;
        const k = v.t / v.dur, a = 1 - k;
        ctx.save();
        if (v.type === 'star') {
          ctx.globalAlpha = a; ctx.strokeStyle = v.col; ctx.lineWidth = 2; ctx.beginPath();
          for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4 + 0.4, r0 = v.r * 0.25 * (1 + k), r1 = v.r * (0.5 + k); ctx.moveTo(v.x + Math.cos(an) * r0, v.y + Math.sin(an) * r0); ctx.lineTo(v.x + Math.cos(an) * r1, v.y + Math.sin(an) * r1); }
          ctx.stroke(); ctx.fillStyle = '#fff'; ctx.globalAlpha = a * 0.9; ctx.beginPath(); ctx.arc(v.x, v.y, v.r * 0.28 * a + 1, 0, 7); ctx.fill();
        } else if (v.type === 'slash') {
          ctx.globalAlpha = a; ctx.strokeStyle = v.col; ctx.lineCap = 'round';
          const L = v.big ? 26 : 18, sw = k * 0.9;
          for (let i = 0; i < (v.big ? 3 : 2); i++) { ctx.lineWidth = 3 - i; ctx.beginPath(); ctx.arc(v.x - v.dir * 4, v.y, L - i * 4, -1.2 * v.dir - 0.5 + sw * v.dir, 1.0 * v.dir + sw * v.dir * 0.4, v.dir < 0); ctx.stroke(); }
        } else if (v.type === 'bit') {
          ctx.globalAlpha = a; ctx.fillStyle = v.col; ctx.fillRect(Math.round(v.x), Math.round(v.y), 2, 2);
        } else if (v.type === 'proj') {
          const px = v.x + (v.x2 - v.x) * k, py = v.y + (v.y2 - v.y) * k - Math.sin(k * Math.PI) * 4, dirx = Math.sign(v.x2 - v.x) || 1;
          if (v.kind === 'fire') { ctx.globalAlpha = 0.9; ctx.fillStyle = '#ff9a30'; ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.fill(); ctx.fillStyle = '#ffe070'; ctx.beginPath(); ctx.arc(px + dirx * 2, py, 3, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,120,30,0.5)'; ctx.fillRect(px - dirx * 14, py - 2, 14, 4); ctx.restore(); continue; }
          if (v.kind === 'water') { ctx.globalAlpha = 0.9; ctx.fillStyle = '#4a9ae8'; ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#cfe8ff'; ctx.fillRect(px - 2, py - 3, 2, 2); ctx.fillStyle = 'rgba(74,154,232,0.5)'; ctx.fillRect(px - dirx * 16, py - 2, 16, 4); ctx.restore(); continue; }
          if (v.kind === 'bolt') { ctx.strokeStyle = '#f0f070'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(v.x, v.y); for (let i = 1; i <= 7; i++) { const q = i / 7; ctx.lineTo(v.x + (px - v.x) * q, v.y + (py - v.y) * q + (i % 2 ? -6 : 6) * (1 - q) + Math.sin(t * 90 + i) * 2); } ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore(); continue; }
          if (v.kind === 'wind') { ctx.strokeStyle = 'rgba(200,240,220,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, 7, t * 20, t * 20 + 4); ctx.stroke(); ctx.beginPath(); ctx.arc(px - dirx * 10, py, 5, -t * 20, -t * 20 + 3.5); ctx.stroke(); ctx.restore(); continue; }
          if (v.kind === 'bug') { ctx.fillStyle = '#2a2a1a'; for (let i = 0; i < 5; i++) ctx.fillRect(px - dirx * i * 3 + Math.sin(t * 40 + i * 2) * 3, py + Math.cos(t * 30 + i) * 4, 2, 2); ctx.restore(); continue; }
          if (v.kind === 'snake') { ctx.strokeStyle = '#4a9a3a'; ctx.lineWidth = 3; ctx.beginPath(); for (let i = 0; i <= 8; i++) { const q = i / 8, xx = v.x + (px - v.x) * q, yy = py + Math.sin(q * 9 + t * 20) * 4; i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke(); ctx.restore(); continue; }
          if (v.kind === 'fang') { ctx.globalAlpha = 0.7; ctx.fillStyle = '#e8e0d0'; ctx.beginPath(); ctx.moveTo(px - dirx * 12, py - 4); ctx.lineTo(px + dirx * 6, py); ctx.lineTo(px - dirx * 12, py + 4); ctx.fill(); ctx.restore(); continue; }
          ctx.translate(px, py);
          ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff'; ctx.fillRect(-dirx * 14, -1, 14 * dirx > 0 ? 14 : -14, 1);
          ctx.globalAlpha = 1;
          if (v.kind === 'shuriken') { ctx.rotate(t * 30); ctx.fillStyle = '#c8ccd8'; ctx.fillRect(-5, -1, 10, 2); ctx.fillRect(-1, -5, 2, 10); ctx.fillStyle = '#555a6a'; ctx.fillRect(-1, -1, 2, 2); }
          else { ctx.rotate(dirx > 0 ? 0 : Math.PI); ctx.rotate(k * 2); ctx.fillStyle = '#c8ccd8'; ctx.fillRect(-1, -6, 3, 8); ctx.fillStyle = '#6a4a2a'; ctx.fillRect(-1, 2, 3, 4); if (v.kind === 'tag') { ctx.fillStyle = '#e8dcc0'; ctx.fillRect(2, 0, 3, 5); ctx.fillStyle = '#d03020'; ctx.fillRect(3, 1, 1, 3); } }
        } else if (v.type === 'ring') {
          ctx.globalAlpha = a * 0.8; ctx.strokeStyle = v.col; ctx.lineWidth = 3 * a + 1; ctx.beginPath(); ctx.arc(v.x, v.y, v.r * (0.2 + k * 0.8), 0, 7); ctx.stroke();
          if (k < 0.5) { ctx.globalAlpha = (0.5 - k); ctx.fillStyle = v.col; ctx.fill(); }
        } else if (v.type === 'leaf') {
          const an = v.a + k * 7, r = 4 + k * v.sp * 0.5;
          ctx.globalAlpha = a; ctx.fillStyle = '#5a9a3a'; ctx.fillRect(Math.round(v.x + Math.cos(an) * r), Math.round(v.y - k * 18 + Math.sin(an) * r * 0.6), 3, 2);
        } else if (v.type === 'aura') {
          const x = X(v.f.pos) + (v.f.kb || 0), pulse = 0.6 + 0.4 * Math.sin(t * 18);
          ctx.globalAlpha = Math.min(1, a * 1.4) * 0.5 * pulse; ctx.fillStyle = v.col; ctx.beginPath(); ctx.ellipse(x, layout.groundY - 14, 14, 24, 0, 0, 7); ctx.fill();
        }
        ctx.restore();
      }
    }
    // аура и печати над героем, пока идёт ввод печатей
    function drawSealGlow(ctx, t) {
      if (C.state !== 'seals' || !C.seals) return;
      const x = X(P.pos), n = C.seals.seq.length, prog = C.seals.i / n, gy = layout.groundY;
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.35 * prog; ctx.fillStyle = '#5ab0ff';
      ctx.beginPath(); ctx.ellipse(x, gy - 16, 12 + prog * 6, 22 + prog * 6, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      for (let i = 0; i < 8; i++) { const ph = (t * 1.3 + i / 8) % 1; ctx.fillStyle = i % 2 ? '#bfe4ff' : '#5ab0ff'; ctx.fillRect(Math.round(x + Math.sin(i * 2.4 + t * 3) * (10 + prog * 6)), Math.round(gy - 6 - ph * 40), 2, 2); }
      // кружок печати над головой: сегменты по числу печатей
      const cy0 = gy - 56, R = 9;
      ctx.translate(x, cy0); ctx.rotate(t * (1 + prog * 3));
      ctx.strokeStyle = '#9ad0ff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
      for (let i = 0; i < n; i++) { const an = i / n * 6.283; ctx.fillStyle = i < C.seals.i ? '#ffe070' : '#33507a'; ctx.fillRect(Math.round(Math.cos(an) * R) - 1, Math.round(Math.sin(an) * R) - 1, 3, 3); }
      ctx.restore();
    }

    return { pop, puff, cy, V1, hurt, impact, lunge, proj, burst, aura, leaves, enemyFx, updateVfx, drawVfx, drawSealGlow };
  },
};


// ===== scenes/battle_ai.js =====
// ИИ противника в бою «Дуэль шиноби»: какие приёмы допустимы, какой выбрать, что показать игроку.
// Вынесено из scenes/battle.js — выбор хода врага не зависит от состояний и отрисовки, ему нужны только
// бойцы, арена и данные противника. Поведение не изменилось (проверяется tools/node/golden.js).
//
// C — контекст боя: { P, E, ed, traps, dist, has, canStand, sgn, rnd, Hh }
//   ed — данные противника (уже с поправкой на рост уличных врагов), Hh — G.hero.
G.battleAi = {
  make(C) {
    const P = C.P, E = C.E, ed = C.ed, traps = C.traps, Hh = C.Hh;
    const dist = C.dist, has = C.has, canStand = C.canStand, sgn = C.sgn, rnd = C.rnd;

    // ── ИИ противника ──
    function validAct(id, d) {
      const a = G.EACTS[id]; if (!a) return false;
      if (d < a.range[0] || d > a.range[1]) return false;
      if (a.jutsu && E.ch < 10) return false;
      if (a.kind === 'tai' && P.s.high && !has('climb')) return false;
      if (a.kind === 'throw' && P.s.hidden) return false;
      if (a.kind === 'move' && E.s.bound) return false;
      if (a.kind === 'move' && a.dir > 0 && !canStand(E, E.pos + sgn(E, P))) return false;
      if (a.kind === 'move' && a.dir < 0 && !canStand(E, E.pos - sgn(E, P))) return false;
      if (id === 'clones' && E.clones > 0) return false;
      if (id === 'trap' && traps.some((t) => t.owner === 'e')) return false;
      if (id === 'shadow' && P.s.bound) return false;
      if (id === 'mind' && P.s.conf) return false;
      if (id === 'taunt' && (P.s.shaken || Math.random() < 0.5)) return false;
      if ((id === 'kunai' || id === 'shuriken') && P.s.hidden) return false;
      return true;
    }
    function decide() {
      const d = dist();
      if (has('lazy') && Math.random() < 0.15) return 'yawn';
      let cand = (ed.acts || ['stand']).filter((id) => validAct(id, d));
      if (P.s.hidden) cand = cand.filter((id) => G.EACTS[id].kind !== 'throw');
      if (!cand.length) cand = ['guard'];
      const hurt = E.hp / E.hpMax;
      const w = cand.map((id) => {
        const a = G.EACTS[id]; let s = 1;
        if (a.kind === 'tai') s = d === 1 ? (ed.pref <= 1 ? 4 : 2) : 2.5;
        if (a.kind === 'throw') s = d >= 2 ? (ed.pref >= 2 ? 3.5 : 1.5) : 0.4;
        if (a.kind === 'move') s = (a.dir > 0 ? (d > ed.pref ? 3 + (has('impulsive') ? 2 : 0) : 0.2) : (d < ed.pref ? 3 : 0.2));
        if (a.jutsu) s *= 1.6;
        if (id === 'guard') s = has('defensive') ? 1.5 : (hurt < 0.35 ? 0.8 : 0.15);
        if (id === 'focus') s = E.ch < 20 ? 2 : 0.3;
        if (id === 'clones') s = 3;
        if (id === 'trap') s = 2;
        if (E.s.prov && a.kind === 'tai') s *= 3;
        if (E.s.prov && (a.kind === 'move' && a.dir < 0 || id === 'guard')) s = 0.05;
        return s * rnd(0.7, 1.3);
      });
      let sum = w.reduce((a, b) => a + b, 0), r = Math.random() * sum;
      for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) return cand[i]; }
      return cand[0];
    }
    function plan() {
      E.plan = decide();
      E.shown = E.plan;
      if (has('deceive') && E.an <= 0 && Math.random() < 0.3) {
        const alt = (ed.acts || []).filter((id) => id !== E.plan && G.EACTS[id] && G.EACTS[id].kind !== 'move');
        if (alt.length) E.shown = alt[Math.floor(Math.random() * alt.length)];
      }
      E.plan2 = Hh.has('analyst') ? decide() : null;
    }
    const actName = (id) => id === 'yawn' ? 'Зевает' : (G.EACTS[id] || G.EACTS.stand).name;
    const actOf = (id) => id === 'yawn' ? Object.assign({}, G.EACTS.stand, { name: 'Зевает' }) : (G.EACTS[id] || G.EACTS.stand);

    return { validAct, decide, plan, actName, actOf };
  },
};


// ===== scenes/battle_bg.js =====
// Фоны арен V9: небо, дальние планы, дымка и земля — кодом, со светом сверху-слева и дизерными переходами.
// Фон запекается один раз на размер арены (кэш по арене и размеру); облака плывут поверх каждый кадр.
//   G.battleBg.get(terrain, W, H) → холст W×H (лог. px); земля начинается на H − 14
//   G.battleBg.clouds(ctx, terrain, x0, y0, W, H, t) — облака с объёмом
//   G.battleBg.obj(kind, dark) → { img, ox, oy } — предметы на арене (дерево, куст, камень, брёвна, вода)
G.battleBg = (() => {
  const S = G.shade, Hh = G.util.hash2;
  const cache = {};
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // гладкий одномерный шум (сумма октав) — для хребтов и кромок
  function noise1(x, seed) {
    let v = 0, amp = 1, f = 1, tot = 0;
    for (let o = 0; o < 4; o++) {
      const xi = Math.floor(x * f), t = x * f - xi, s = t * t * (3 - 2 * t);
      const a = Hh(xi, seed + o * 13, 401), b = Hh(xi + 1, seed + o * 13, 401);
      v += (a + (b - a) * s) * amp; tot += amp; amp *= 0.5; f *= 2.1;
    }
    return v / tot;
  }

  // ---------- примитивы ----------
  // полупрозрачная заливка по столбцам: top(x) → верх, цвет — по высоте (0 у верха, 1 у низа) из ступеней cols
  function cols(c, top, bottom, colsArr, o = {}) {
    const P = S.pix(c), k = P.k, C = colsArr.map(S.rgb), n = C.length;
    const lit = o.lit != null ? o.lit : 0.3, litC = S.rgb(o.litCol || '#fff2cc'), rimC = o.rim ? S.rgb(o.rim) : null;
    for (let i = 0; i < P.w; i++) {
      const x = (i + 0.5) / k, y0 = top(x), y1 = bottom;
      const slope = top(x + 1.5) - top(x - 1.5);           // < 0 — склон смотрит влево, к свету
      const J0 = Math.max(0, Math.ceil(y0 * k)), J1 = Math.min(P.h, Math.round(y1 * k));
      for (let j = J0; j < J1; j++) {
        const f = (j - J0) / Math.max(1, J1 - J0);
        const q = clamp(Math.floor(f * (n - 0.01) + (S.bayer(i, j) - 0.5) * 0.9), 0, n - 1);
        let col = C[q];
        const depth = (j - J0) / k;
        if (rimC && depth < 1) col = rimC;
        else if (slope < -0.25 && depth < 6) {                 // освещённый склон: тёплый блик, к глубине гаснет
          const a = clamp(-slope * 0.35, 0, 1) * lit * (1 - depth / 6);
          if (a > S.bayer(i + 2, j) * 0.6) col = S.mix(col, litC, Math.min(0.6, a + 0.12));
        }
        const p = (j * P.w + i) * 4;
        P.d[p] = col[0]; P.d[p + 1] = col[1]; P.d[p + 2] = col[2]; P.d[p + 3] = 255;
      }
    }
    P.put();
  }
  // дымка: к низу полосы плотнее (атмосферная перспектива), сглаженно
  function haze(c, y0, y1, col, a0, a1) {
    const P = S.pix(c), k = P.k, C = S.rgb(col);
    for (let j = Math.max(0, Math.round(y0 * k)); j < Math.min(P.h, Math.round(y1 * k)); j++) {
      const f = (j / k - y0) / (y1 - y0), a = a0 + (a1 - a0) * f;
      for (let i = 0; i < P.w; i++) {
        const p = (j * P.w + i) * 4; if (!P.d[p + 3]) continue;
        const q = Math.floor(a * 8 + S.bayer(i, j)) / 8;
        P.d[p] += (C[0] - P.d[p]) * q; P.d[p + 1] += (C[1] - P.d[p + 1]) * q; P.d[p + 2] += (C[2] - P.d[p + 2]) * q;
      }
    }
    P.put();
  }
  // свечение (солнце, луна, фонарь): мягкое радиальное смешивание
  function glow(c, cx, cy, r, col, a) {
    S.grad(c, cx - r, cy - r, r * 2, r * 2, [col, col], { dir: 'r', cx, cy, r, alpha: a, fade: true, clip: true });
  }
  // лиственная гряда: ряд шаров листвы со светом
  function treeline(c, base, W, seed, pal, o = {}) {
    const step = o.step || 16, sz = o.size || 12;
    for (let x = -step; x < W + step; x += step * (0.7 + Hh(x, seed, 5) * 0.5)) {
      const r = sz * (0.75 + Hh(x, seed, 6) * 0.5), y = base - r * 0.6 - Hh(seed, x, 7) * sz * 0.5;
      if (o.trunk) { const ctx = c.getContext('2d'); ctx.fillStyle = o.trunk; ctx.fillRect(Math.round(x - 1), Math.round(y), 3, Math.ceil(base - y + 4)); }
      S.ball(c, x, y, r, r * 0.9, pal, { noise: 0.42, grain: 1.5, seed: seed + Math.round(x) });
      S.ball(c, x - r * 0.35, y - r * 0.3, r * 0.55, r * 0.5, pal.slice(1), { noise: 0.4, grain: 1.5, seed: seed + 7 + Math.round(x) });
    }
  }
  // земля: градиент от кромки вниз, кромка-блик, кочки травы и камешки
  function ground(c, y0, W, H, pal, o = {}) {
    S.grad(c, 0, y0, W, H - y0, pal, { dir: 'v', steps: 2 });
    const ctx = c.getContext('2d');
    ctx.fillStyle = o.edge || S.toneHex(pal[0], 0.25); ctx.fillRect(0, y0, W, 1);
    ctx.globalAlpha = 0.35; ctx.fillStyle = S.toneHex(pal[0], -0.5); ctx.fillRect(0, y0 + 1, W, 1); ctx.globalAlpha = 1;
    for (let i = 0; i < W / 5; i++) {
      const x = Math.floor(Hh(i, 3, 71) * W), y = y0 + 3 + Math.floor(Hh(3, i, 72) * (H - y0 - 4)), r = Hh(i, i, 73);
      if (o.tufts && r > 0.5) { ctx.fillStyle = o.tufts[0]; ctx.fillRect(x, y - 2, 1, 2); ctx.fillRect(x + 2, y - 1, 1, 1); ctx.fillStyle = o.tufts[1]; ctx.fillRect(x + 1, y - 3, 1, 3); }
      else { ctx.fillStyle = S.toneHex(pal[1], r > 0.25 ? 0.22 : -0.3); ctx.fillRect(x, y, r > 0.15 ? 2 : 1, 1); }
    }
  }

  // ---------- арены ----------
  const DRAW = {
    field(c, W, H, gy, s) {
      S.grad(c, 0, 0, W, gy + 2, ['#4a8ad8', '#7ab4ec', '#b4dcf6', '#e4f2f8'], { dir: 'v', steps: 3 });
      glow(c, W * 0.18, H * 0.12, 70, '#fff6d8', 0.55);
      const m1 = (x) => gy - (46 + noise1(x / 60, 3) * 40) * s;
      cols(c, m1, gy, ['#8aa8c8', '#9ab8d0', '#a8c4d8'], { lit: 0.45 });
      haze(c, gy - 90 * s, gy, '#d8ecf6', 0.1, 0.45);
      const m2 = (x) => gy - (22 + noise1(x / 38, 9) * 26) * s;
      cols(c, m2, gy, ['#4e8a5a', '#5a9a5e', '#6aa868'], { lit: 0.5 });
      haze(c, gy - 50 * s, gy, '#cfe6ee', 0, 0.3);
      treeline(c, gy, W, 21, ['#24502e', '#2e6a32', '#3e8a42', '#5aaa52', '#86c46a'], { step: 15, size: 9 });
      ground(c, gy, W, H, ['#7cb05a', '#5e9446', '#4a7a3a'], { tufts: ['#3e7a34', '#9ad070'] });
    },
    yard(c, W, H, gy, s) {
      S.grad(c, 0, 0, W, gy + 2, ['#5a9ae0', '#8ac2ee', '#c4e2f6', '#f0f2ea'], { dir: 'v', steps: 3 });
      glow(c, W * 0.15, H * 0.1, 80, '#fff4d0', 0.6);

      const rock = (x) => gy - (58 + noise1(x / 24, 5) * 14 + Math.max(0, 30 - Math.abs(x - W * 0.62) * 0.3)) * s;
