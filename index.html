      for (const lx of [3, W - 9]) { px(c, lx, wy - 2, P.ink, 6, 9); px(c, lx + 1, wy - 1, '#e84a3a', 4, 7); px(c, lx + 1, wy + 1, '#f0d040', 4, 1); }
    },

    official(c, o) {
      const { W, HF, OV, seed, tpl, id } = o;
      const wh = wallH(tpl, id), wy = OV + HF - wh;
      const offPl = tpl.unique ? '#e8dcc0' : PLASTER[Math.floor(H(seed, 17, 1) * PLASTER.length)];
      wall(c, 0, wy, W, wh, id === 'hospital' ? '#f4f8fa' : offPl, id === 'hospital' || !tpl.unique ? null : '#7a4a2a');
      const dx = tpl.door[0] * T + 2;
      windowsRow(c, o, wy + 8, dx);
      if (!tpl.unique) facadeDetails(c, o, wy, wh, null, offPl);
      if (wh > 36) windowsRow(c, o, wy + 22, dx, { every: 2 });
      door(c, dx, OV + HF - 22, 22, 'big');
      const flat = id === 'hospital' || (!tpl.unique && H(seed, 15, 2) > 0.5);
      if (flat) roofFlat(c, 0, 0, W, wy + 4, id === 'hospital' ? '#c8d0d8' : ROOFS[Math.floor(H(seed, 16, 1) * ROOFS.length)], seed, id !== 'hospital');
      else roofGable(c, 0, 0, W, wy + 4, shade(tpl.color, -0.2));
      if (id === 'hospital') {
        const cx = W / 2, cy = (wy + 4) / 2;
        px(c, cx - 3, cy - 9, '#d83a2a', 6, 18); px(c, cx - 9, cy - 3, '#d83a2a', 18, 6);
        icon(c, 'cross', dx + 3, wy + 2, '#d83a2a');
      }
      if (TPL_ICON[id] && id !== 'hospital') signboard(c, Math.floor(W / 2) - 9, wy - 13, 18, tpl.color, TPL_ICON[id]);
    },

    clan(c, o) {
      const { W, HF, OV, seed, tpl, id } = o;
      const wh = wallH(tpl, id), wy = OV + HF - wh;
      const uchiha = id.startsWith('uchiha') || id === 'sasuke_home';
      wall(c, 0, wy, W, wh, uchiha ? '#d8d0c8' : '#e8e0d0', '#3a2a20');
      const dx = tpl.door ? tpl.door[0] * T + 2 : null;
      for (let x = 6; x + 10 < W - 4; x += 16) {
        if (dx != null && x + 10 > dx - 4 && x < dx + 16) continue;
        px(c, x, wy + 8, '#3a2a20', 11, 10); px(c, x + 1, wy + 9, '#f0e6cc', 9, 8);
        px(c, x + 5, wy + 9, '#3a2a20', 1, 8); px(c, x + 1, wy + 12, '#c8b898', 9, 1);
      }
      if (dx != null) door(c, dx, OV + HF - 22, 22, uchiha ? 'shoji' : 'noren', tpl.color);
      roofGable(c, 0, 0, W, wy + 4, uchiha ? '#3a3a4a' : '#4a4a5a');
      if (uchiha) {
        uchihaFan(c, dx != null ? dx + 1 : W / 2 - 4, wy + 1);
        if (id === 'uchiha_house') { // заброшенность: доски на окнах
          for (let x = 6; x + 10 < W - 4; x += 32) { px(c, x - 1, wy + 11, '#7a5a3a', 13, 2); px(c, x - 1, wy + 15, '#7a5a3a', 13, 2); }
        }
      } else {
        // клановый знак на крыше
        const cx = Math.floor(W / 2) - 6, cy = Math.floor((wy + 4) / 2) - 4;
        px(c, cx, cy, P.ink, 13, 11); px(c, cx + 1, cy + 1, tpl.color, 11, 9);
        icon(c, { clan_inuzuka: 'paw', clan_akimichi: 'meat', clan_nara: 'leaf', clan_hyuga: 'onsen' }[id] || 'leaf', cx + 3, cy + 2, '#f4ecd8', '#2a1e18');
      }
    },

    training(c, o) { GENERIC.clan(c, o); },
    landmark(c, o) { GENERIC.house(c, o); },
  };

  // ---------- Уникальные здания ----------
  const SPECIAL = {
    // Резиденция Хокаге: красная круглая башня с кандзи «火» на крыше
    hokage_tower(c, o) {
      const { W, HF, OV } = o;
      const wh = 56, wy = OV + HF - wh;
      const red = '#c8402a', redD = '#8a2a1a', redL = '#e05a3a';
      // корпус со скруглёнными боками
      px(c, 6, wy, P.ink, W - 12, wh); px(c, 2, wy + 4, P.ink, W - 4, wh - 8);
      px(c, 7, wy, red, W - 14, wh - 1); px(c, 3, wy + 4, red, W - 6, wh - 9);
      px(c, 3, wy + wh - 9, redD, W - 6, 5); px(c, 7, wy + wh - 5, redD, W - 14, 4);
      for (let x = 10; x < W - 14; x += 14) px(c, x, wy + 4, redL, 2, wh - 12);
      // окна поясом
      for (let row = 0; row < 2; row++) for (let x = 12; x < W - 20; x += 14) {
        if (x > W / 2 - 22 && x < W / 2 + 12 && row === 1) continue;
        windowAt(c, x, wy + 8 + row * 18, false);
      }
      // вход
      const dx = o.tpl.door[0] * T + 2;
      door(c, dx, OV + HF - 22, 22, 'big');
      px(c, dx - 6, OV + HF - 30, P.ink, 24, 6); px(c, dx - 5, OV + HF - 29, '#f0c040', 22, 4);
      // крыша-купол
      const rh = wy + 6, cx = W / 2;
      for (let y = 0; y < rh; y++) {
        const t = 1 - Math.pow((y - rh * 0.55) / (rh * 0.6), 2);
        const half = Math.max(8, Math.floor((W / 2 - 2) * Math.sqrt(Math.max(0.1, t))));
        px(c, cx - half - 1, y, P.ink, half * 2 + 2, 1);
        px(c, cx - half, y, y % 6 < 1 ? redD : red, half * 2, 1);
        px(c, cx - half, y, redL, 3, 1);
      }
      px(c, 0, rh - 4, P.ink, W, 4); px(c, 1, rh - 4, redD, W - 2, 2);
      // белый круг и кандзи
      const r = 15, ky = Math.floor(rh * 0.5);
      for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) if (xx * xx + yy * yy <= r * r) px(c, cx + xx, ky + yy, xx * xx + yy * yy > (r - 2) * (r - 2) ? P.ink : '#f4ecd8');
      kanji(c, cx - 11, ky - 11, P.ink, 2);
    },

    // Академия: широкое оранжевое здание, большая вывеска с листом
    academy(c, o) {
      const { W, HF, OV, seed, tpl } = o;
      const wh = 48, wy = OV + HF - wh;
      wall(c, 0, wy, W, wh, '#f0d8b0', '#a84a2a');
      const dx = tpl.door[0] * T + 2;
      windowsRow(c, o, wy + 8, null);
      windowsRow(c, o, wy + 24, dx);
      door(c, dx, OV + HF - 22, 22, 'big');
      roofGable(c, 0, 0, W, wy + 4, '#d8623a');
      // вывеска «火» в круге на фронтоне
      const cx = W / 2, cy = Math.floor((wy + 4) * 0.52);
      const r = 13;
      for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) if (xx * xx + yy * yy <= r * r) px(c, cx + xx, cy + yy, xx * xx + yy * yy > (r - 2) * (r - 2) ? P.ink : '#f0d040');
      kanji(c, cx - 11, cy - 11, '#c8402a', 2);
      // часы/табличка над дверью
      const tw = G.font.measure('Академия') + 8;
      px(c, dx + 6 - tw / 2, wy + 1, P.ink, tw, 11); px(c, dx + 7 - tw / 2, wy + 2, '#f4ecd8', tw - 2, 9);
      G.font.draw(c, 'Академия', dx + 6, wy + 1, { align: 'center', color: P.ink, max: 99 });
    },

    library(c, o) {
      const { W, HF, OV, tpl } = o;
      const wh = 40, wy = OV + HF - wh;
      wall(c, 0, wy, W, wh, '#d8d0c0', null);
      for (let x = 4; x < W - 4; x += 14) { px(c, x, wy + 2, P.ink, 6, wh - 6); px(c, x + 1, wy + 2, '#f0eadc', 4, wh - 7); }
      const dx = tpl.door[0] * T + 2;
      door(c, dx, OV + HF - 22, 22, 'big');
      roofGable(c, 0, 0, W, wy + 4, '#6a5a8a');
      signboard(c, W / 2 - 9, wy - 13, 18, tpl.color, 'book');
    },

    onsen(c, o) {
      const { W, HF, OV, tpl } = o;
      const wh = 36, wy = OV + HF - wh;
      wall(c, 0, wy, W, wh, '#c8a878', '#5a3a24');
      for (let x = 2; x < W - 2; x += 3) px(c, x, wy + 2, '#a8885a', 1, wh - 7);
      const dx = tpl.door[0] * T + 2;
      door(c, dx, OV + HF - 20, 20, 'noren', '#3a6ac8');
      roofGable(c, 0, 0, W, wy + 4, '#3a4a6a');
      signboard(c, W / 2 - 9, wy - 13, 18, '#3a6ac8', 'onsen');
      // пар
      for (let i = 0; i < 3; i++) { px(c, W - 20 + i * 4, 2 + i, '#ffffff', 2, 3); }
    },

    market(c, o) { // открытые ряды под полосатыми навесами
      const { W, HF, OV, tpl } = o;
      const ay = OV + HF - 34;
      px(c, 0, OV + HF - 14, P.ink, W, 12); px(c, 1, OV + HF - 13, '#a8703e', W - 2, 10);
      for (let x = 4; x < W - 6; x += 7) {
        const cols = ['#e84a3a', '#f0c040', '#7ac04a', '#e87a3a', '#f4ecd8'];
        for (let k = 0; k < 2; k++) px(c, x + k * 3, OV + HF - 17, cols[(x + k) % 5], 3, 3);
      }
      for (let x = 0; x < W; x += 8) { px(c, x + 2, ay + 10, '#3a2a20', 2, 22); }
      roofGable(c, 0, 0, W, ay + 4, '#c8a040');
      for (let x = 0; x < W; x += 6) px(c, x, ay + 4, (x / 6) % 2 ? '#f4ecd8' : '#d84a3a', 6, 7);
      px(c, 0, ay + 11, P.ink, W, 1);
      signboard(c, W / 2 - 9, ay - 8, 18, tpl.color, 'coin');
    },

    // Главные ворота «А» и «УН»: два столба, балка с табличкой, зелёные створки
    gate(c, o) {
      const { W, HF, OV } = o;
      const g = '#4a8a4a', gD = '#2e5a2e', gL = '#6aaa5a';
      // створки (внизу, закрыты)
      px(c, 16, OV + HF - 24, P.ink, W - 32, 24);
      px(c, 17, OV + HF - 23, g, (W - 34) / 2 - 1, 23); px(c, W / 2 + 1, OV + HF - 23, g, (W - 34) / 2 - 1, 23);
      for (let x = 20; x < W - 20; x += 8) px(c, x, OV + HF - 23, gD, 1, 23);
      px(c, W / 2 - 1, OV + HF - 23, P.ink, 2, 23);
      G.font.draw(c, 'А', W / 2 - 18, OV + HF - 18, { color: '#f4ecd8', max: 9 });
      G.font.draw(c, 'УН', W / 2 + 8, OV + HF - 18, { color: '#f4ecd8', max: 9 });
      // столбы
      for (const x of [0, W - 16]) { px(c, x, 6, P.ink, 16, OV + HF - 6); px(c, x + 1, 7, g, 14, OV + HF - 8); px(c, x + 2, 7, gL, 3, OV + HF - 8); px(c, x + 1, OV + HF - 6, gD, 14, 5); }
      // балка
      px(c, 0, 0, P.ink, W, 12); px(c, 1, 1, g, W - 2, 10); px(c, 1, 1, gL, W - 2, 2);
      px(c, W / 2 - 22, 2, P.ink, 44, 9); px(c, W / 2 - 21, 3, '#f4ecd8', 42, 7);
      G.font.draw(c, 'Коноха', W / 2, 1, { align: 'center', color: '#c8402a', max: 99 });
    },

    guard_post(c, o) {
      const { W, HF, OV } = o;
      const wy = OV + HF - 20;
      wall(c, 0, wy, W, 20, '#d8c8a8', '#5a3a24');
      px(c, 6, wy + 4, '#4a3020', W - 12, 8); px(c, 7, wy + 5, '#8ac0e0', W - 14, 6);
      roofGable(c, 0, 0, W, wy + 3, '#4a6a4a');
    },

    // Скала Хокаге: четыре лица на отвесной скале (рисуется в пятне шаблона)
    hokage_rock(c, o) {
      const { W, HF, OV } = o;
      const baseY = OV + HF; // низ спрайта = подножие скалы
      const faces = [
        { x: W * 0.14, hair: 'long' }, { x: W * 0.38, hair: 'short' },
        { x: W * 0.62, hair: 'old' }, { x: W * 0.86, hair: 'spiky' },
      ];
      const rock = '#a8947e', rockD = '#7a6a58', rockL = '#c4b098';
      for (const f of faces) {
        const cx = Math.round(f.x), top = baseY - 74, fw = 40, fh = 56;
        // волосы/силуэт
        c.fillStyle = rockD;
        if (f.hair === 'long') { c.fillRect(cx - 24, top - 2, 48, fh + 10); }
        if (f.hair === 'short') { c.fillRect(cx - 22, top - 4, 44, 22); for (let i = 0; i < 5; i++) c.fillRect(cx - 20 + i * 9, top - 9, 5, 6); }
        if (f.hair === 'old') { c.fillRect(cx - 21, top + 2, 42, 16); }
        if (f.hair === 'spiky') { c.fillRect(cx - 23, top - 2, 46, 22); for (let i = 0; i < 6; i++) { c.fillRect(cx - 24 + i * 9, top - 8, 6, 8); } c.fillRect(cx - 26, top + 10, 6, 26); c.fillRect(cx + 20, top + 10, 6, 26); }
        // лицо
        px(c, cx - fw / 2, top + 8, P.ink, fw, fh - 10); px(c, cx - fw / 2 + 2, top + 10, P.ink, fw - 4, fh - 6);
        px(c, cx - fw / 2 + 1, top + 9, rock, fw - 2, fh - 12); px(c, cx - fw / 2 + 3, top + 11, rock, fw - 6, fh - 9);
        px(c, cx - fw / 2 + 1, top + 9, rockL, 4, fh - 14);
        // глаза, нос, рот
        px(c, cx - 12, top + 22, rockD, 9, 3); px(c, cx + 3, top + 22, rockD, 9, 3);
        px(c, cx - 10, top + 25, P.ink, 5, 2); px(c, cx + 5, top + 25, P.ink, 5, 2);
        px(c, cx - 1, top + 26, rockD, 2, 10); px(c, cx - 3, top + 35, rockD, 6, 2);
        px(c, cx - 7, top + 41, rockD, 14, 2);
        if (f.hair === 'old') { px(c, cx - 4, top + 45, rockD, 8, 6); px(c, cx - 14, top + 30, rockD, 2, 8); px(c, cx + 12, top + 30, rockD, 2, 8); }
        if (f.hair !== 'old') { px(c, cx - fw / 2 + 2, top + 14, '#8a9aa8', fw - 4, 4); px(c, cx - 4, top + 14, '#c8d0d8', 8, 4); } // протектор
      }
    },
  };

  return { make, shade, icon, kanji, wallH };
})();


// ===== world/map.js =====
// Карта локации: тайлы земли, проходимость, объекты, здания, переходы, NPC.
// Земля запекается кусками (чанками) 32×32 тайла в offscreen-canvas; рисуется только видимое.
// Объекты и здания разложены по «корзинам» 8×8 тайлов — для быстрого поиска при отрисовке и коллизиях.
G.WorldMap = class {
  constructor(id, w, h, opts = {}) {
    this.id = id;
    this.w = w; this.h = h;
    this.name = opts.name || id;
    this.outdoor = !!opts.outdoor;
    this.bg = opts.bg || '#000';
    this.ground = new Uint8Array(w * h);
    this.block = new Uint8Array(w * h);   // 1 — непроходимо (здания и т.п. поверх тайла)
    this.objects = [];                    // {kind, x, y, box, talk, layer, img?, ox, oy}
    this.buildings = [];                  // {tpl, id, tx, ty, w, h, spr, door, name, interior}
    this.warps = [];                      // {rect, to:{map,x,y,dir}, dir:'up'|'down', building}
    this.npcs = [];
    this.districts = [];                  // для названия места
    this.spawn = null;                    // точка появления по умолчанию {x,y,dir}
    this.BK = 8;                          // размер корзины в тайлах
    this.buckets = new Map();
    this.chunks = new Map();
    this.CH = 32;
    this._stamp = 1;
  }

  idx(tx, ty) { return ty * this.w + tx; }
  inside(tx, ty) { return tx >= 0 && ty >= 0 && tx < this.w && ty < this.h; }
  get(tx, ty) { return this.inside(tx, ty) ? this.ground[ty * this.w + tx] : -1; }
  set(tx, ty, id) { if (this.inside(tx, ty)) this.ground[ty * this.w + tx] = id; }
  setBlock(tx, ty, v = 1) { if (this.inside(tx, ty)) this.block[ty * this.w + tx] = v; }

  solidTile(tx, ty) {
    if (!this.inside(tx, ty)) return true;
    const i = ty * this.w + tx;
    return this.block[i] === 1 || !!G.tiles.SOLID[this.ground[i]];
  }

  // ---------- Объекты ----------
  addObject(kind, x, y, extra) {
    extra = extra || {};
    const spr = G.tiles.object(kind);
    const o = Object.assign({ kind, x, y, ox: spr.ox, oy: spr.oy, img: spr.img, layer: spr.layer, w: spr.w, h: spr.h }, extra);
    o.box = extra.box !== undefined ? extra.box : spr.box ? { x: x + spr.box.x, y: y + spr.box.y, w: spr.box.w, h: spr.box.h } : null;
    o.sortY = y;
    this.objects.push(o);
    return o;
  }

  addBuilding(b) {
    // b: {tpl, id, tx, ty, spr, ...}; рисуется как объект с сортировкой по нижней кромке
    const T = G.CONFIG.TILE;
    b.x = b.tx * T; b.y = b.ty * T;
    b.isBuilding = true;
    b.img = b.spr.img; b.ox = b.spr.ox; b.oy = b.spr.oy; b.w = b.spr.w; b.h = b.spr.h;
    if (b.sortY == null) b.sortY = (b.ty + b.th) * T - 1;
    this.buildings.push(b);
    this.objects.push(b);
    return b;
  }

  drawRect(o) { return { x: o.x + o.ox, y: o.y + o.oy, w: o.w, h: o.h }; }

  finalize() {
    const T = G.CONFIG.TILE, S = this.BK * T;
    this.buckets.clear();
    const add = (o, r) => {
      const x0 = Math.floor(r.x / S), x1 = Math.floor((r.x + r.w - 1) / S);
      const y0 = Math.floor(r.y / S), y1 = Math.floor((r.y + r.h - 1) / S);
      for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++) {
        const k = by * 1000 + bx;
        let arr = this.buckets.get(k);
        if (!arr) this.buckets.set(k, (arr = []));
        if (arr[arr.length - 1] !== o) arr.push(o);
      }
    };
    for (const o of this.objects) {
      const r = this.drawRect(o);
      if (o.box) { // объединённый прямоугольник отрисовки и коллизии
        const x = Math.min(r.x, o.box.x), y = Math.min(r.y, o.box.y);
        add(o, { x, y, w: Math.max(r.x + r.w, o.box.x + o.box.w) - x, h: Math.max(r.y + r.h, o.box.y + o.box.h) - y });
      } else add(o, r);
    }
    this.chunks.clear();
  }

  // Объекты, чей прямоугольник может пересекать r
  query(r, out = []) {
    const T = G.CONFIG.TILE, S = this.BK * T;
    const st = ++this._stamp;
    const x0 = Math.floor(r.x / S), x1 = Math.floor((r.x + r.w - 1) / S);
    const y0 = Math.floor(r.y / S), y1 = Math.floor((r.y + r.h - 1) / S);
    for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++) {
      const arr = this.buckets.get(by * 1000 + bx);
      if (!arr) continue;
      for (const o of arr) if (o._st !== st) { o._st = st; out.push(o); }
    }
    return out;
  }

  // Прямоугольник (в пикселях) упирается в стену/объект?
  blockedRect(b) {
    const T = G.CONFIG.TILE;
    if (b.x < 0 || b.y < 0 || b.x + b.w > this.w * T || b.y + b.h > this.h * T) return true;
    const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 1) / T);
    const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 1) / T);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.solidTile(tx, ty)) return true;
    const near = this.query(b, this._q || (this._q = []));
    let hit = false;
    for (const o of near) if (o.box && G.util.rectsOverlap(b, o.box)) { hit = true; break; }
    near.length = 0;
    return hit;
  }

  districtAt(tx, ty) {
    for (let i = this.districts.length - 1; i >= 0; i--) {
      const d = this.districts[i];
      if (tx >= d.x && ty >= d.y && tx < d.x + d.w && ty < d.y + d.h) return d;
    }
    return null;
  }

  // ---------- Отрисовка земли ----------
  chunk(cx, cy) {
    const k = cy * 100 + cx;
    let c = this.chunks.get(k);
    if (c) { this.chunks.delete(k); this.chunks.set(k, c); return c; } // LRU: в конец
    const T = G.CONFIG.TILE, CH = this.CH;
    const tw = Math.min(CH, this.w - cx * CH), th = Math.min(CH, this.h - cy * CH);
    c = G.gfx.canvas(tw * T, th * T);
    const ctx = c.getContext('2d');
    for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
      G.tiles.renderTile(ctx, this, cx * CH + x, cy * CH + y, x * T, y * T);
    }
    if (!this.outdoor) this.roomLight(c, cx * CH, cy * CH, tw, th);
    else this.groundLight(c, cx * CH, cy * CH, tw, th);
    G.gfx.smooth(c);
    this.chunks.set(k, c);
    if (this.chunks.size > 12) this.chunks.delete(this.chunks.keys().next().value);
    return c;
  }

  // V9: плавные пятна света и тени на земле — гладкий шум в мировых координатах (швов между тайлами и чанками нет),
  // трава заметнее, дороги и камень — едва; ступени между оттенками размыты дизерингом.
  groundLight(c, gx, gy, tw, th) {
    const T = G.CONFIG.TILE, ID = G.tiles.ID, S = G.shade, Hh = G.util.hash2;
    const GR = G.tiles.GRASSY, RD = G.tiles.ROADY;
    const lat = (ix, iy, sd) => Hh(ix, iy, 900 + sd);
    const vn = (x, y, wl, sd) => {            // билинейный шум с плавным сглаживанием
      const fx = x / wl, fy = y / wl, ix = Math.floor(fx), iy = Math.floor(fy);
      let u = fx - ix, v = fy - iy; u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
      const a = lat(ix, iy, sd), b = lat(ix + 1, iy, sd), cc = lat(ix, iy + 1, sd), d = lat(ix + 1, iy + 1, sd);
      return a + (b - a) * u + (cc - a) * v + (a - b - cc + d) * u * v;
    };
    S.tint(c, 0, 0, tw * T, th * T, (u, v) => {
      const wx = gx * T + u * tw * T, wy = gy * T + v * th * T;
      const tile = this.get(Math.floor(wx / T), Math.floor(wy / T));
      const grass = GR.has(tile);
      if (!grass && !RD.has(tile)) return 0;
      const n = (vn(wx, wy, 56, 1) - 0.5) * 0.7 + (vn(wx, wy, 22, 2) - 0.5) * 0.3;   // −0.5…+0.5
      return n * (grass ? 0.2 : 0.07);
    }, { steps: 40, keepInk: false });
  }

  // V9: свет в комнате — пол у стены в мягкой тени (стена заслоняет свет), к дальним углам чуть темнее
  roomLight(c, gx, gy, tw, th) {
    const T = G.CONFIG.TILE, ID = G.tiles.ID, S = G.shade;
    const wallish = (tx, ty) => { const v = this.get(tx, ty); return v < 0 || v === ID.IWALL || v === ID.VOID || v === ID.VWALL; };
    S.defer(c);
    for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
      const tx = gx + x, ty = gy + y;
      if (wallish(tx, ty)) continue;
      if (wallish(tx, ty - 1)) S.tint(c, x * T, y * T, T, 8, (u, v) => -0.42 * (1 - v) ** 1.5);          // тень под стеной
      if (wallish(tx - 1, ty)) S.tint(c, x * T, y * T, 5, T, (u) => -0.28 * (1 - u) ** 1.5);          // у левой стены
      if (wallish(tx + 1, ty)) S.tint(c, x * T + 11, y * T, 5, T, (u) => -0.2 * u ** 1.5);             // у правой стены
      // общий свет комнаты: от окон сверху-слева к дальнему углу
      const fx = (tx + 0.5) / this.w, fy = (ty + 0.5) / this.h;
      S.tint(c, x * T, y * T, T, T, (u, v) => 0.06 - 0.22 * Math.max(0, ((fx + u / this.w) - 0.25) * 0.8 + ((fy + v / this.h) - 0.3)));
    }
    S.flush(c);
  }

  drawGround(ctx, camX, camY, vw, vh, time) {
    const T = G.CONFIG.TILE, CP = this.CH * T;
    const cx0 = Math.max(0, Math.floor(camX / CP)), cx1 = Math.min(Math.ceil(this.w / this.CH) - 1, Math.floor((camX + vw - 1) / CP));
    const cy0 = Math.max(0, Math.floor(camY / CP)), cy1 = Math.min(Math.ceil(this.h / this.CH) - 1, Math.floor((camY + vh - 1) / CP));
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) ctx.drawImage(this.chunk(cx, cy), cx * CP, cy * CP);
    // анимация воды
    const W = G.tiles.ID.WATER;
    const tx0 = Math.max(0, Math.floor(camX / T)), tx1 = Math.min(this.w - 1, Math.floor((camX + vw) / T));
    const ty0 = Math.max(0, Math.floor(camY / T)), ty1 = Math.min(this.h - 1, Math.floor((camY + vh) / T));
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      if (this.ground[ty * this.w + tx] === W) G.tiles.waterOverlay(ctx, tx * T, ty * T, tx, ty, time);
    }
  }

  // Картинка для обзорной карты (1 пиксель = 1 тайл)
  overview() {
    if (this._ov) return this._ov;
    const c = G.gfx.canvas(this.w, this.h, true), ctx = c.getContext('2d');
    const img = ctx.createImageData(this.w, this.h);
    const cache = {};
    const rgb = (hex) => cache[hex] || (cache[hex] = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]);
    for (let i = 0; i < this.w * this.h; i++) {
      const col = rgb(G.tiles.MAPCOL[this.ground[i]] || '#888888');
      img.data[i * 4] = col[0]; img.data[i * 4 + 1] = col[1]; img.data[i * 4 + 2] = col[2]; img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    for (const o of this.objects) {
      if (o.isBuilding) {
        if (!o.tplDef || o.tplDef.cat === 'landmark' && !o.tplDef.door) continue;
        ctx.fillStyle = '#2a1e18'; ctx.fillRect(o.tx, o.ty, o.tw, o.th);
        ctx.fillStyle = o.tplDef.unique ? o.tplDef.color : '#b8a088'; ctx.fillRect(o.tx, o.ty, o.tw, o.th - 1);
      } else if (o.kind === 'tree' || o.kind === 'pine') {
        ctx.fillStyle = '#2e6a32'; ctx.fillRect(Math.floor(o.x / 16) - 1, Math.floor(o.y / 16) - 1, 2, 2);
      }
    }
    this._ov = c;
    return c;
  }
};


// ===== world/mapgen.js =====
// Генератор карты Конохи из данных (районы, дороги, ключевые здания из G.KONOHA_DRAFT).
// Результат детерминирован: одинаковые данные + seed → одинаковая деревня.
//   1) земля по типам районов  2) дороги  3) ключевые здания  4) автозастройка жилых кварталов
//   5) декор: лес, деревья, фонари, лотки, заборы кланов  6) точки появления жителей
G.mapgen = (() => {
  const T = G.CONFIG.TILE;
  const H = G.util.hash2;

  function noise(x, y, s, scale) {
    const gx = x / scale, gy = y / scale, x0 = Math.floor(gx), y0 = Math.floor(gy);
    const fx = gx - x0, fy = gy - y0;
    const a = H(x0, y0, s), b = H(x0 + 1, y0, s), c = H(x0, y0 + 1, s), d = H(x0 + 1, y0 + 1, s);
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }

  const SHOP_NAMES = ['Хозяйственная лавка', 'Лавка тканей', 'Гончарная лавка', 'Чайная лавка', 'Лавка свитков', 'Рыбная лавка', 'Лавка сладостей', 'Мастерская'];
  function nameOf(id, tpl, seed) {
    if (id === 'shop_generic' || id === 'shop_s') return SHOP_NAMES[Math.abs(seed) % SHOP_NAMES.length];
    if (tpl.cat === 'house' && !tpl.unique) return 'Жилой дом';
    if (id === 'uchiha_house' || id === 'uchiha_small') return 'Дом клана Учиха';
    return tpl.name;
  }

  function roadRect(r) {
    const w = G.ROADS[r.type].w;
    const x = Math.min(r.x1, r.x2), y = Math.min(r.y1, r.y2);
    if (r.y1 === r.y2) return { x, y: r.y1, w: Math.abs(r.x2 - r.x1) + 1, h: w };
    return { x: r.x1, y, w, h: Math.abs(r.y2 - r.y1) + 1 };
  }

  // Какой интерьер у здания
  function interiorKind(id, tpl) {
    if (tpl.interior) return tpl.interior;
    if (id === 'uchiha_house' || id === 'uchiha_small') return 'abandoned';
    if (id === 'shop_generic') return 'shop';
    if (id === 'dojo') return 'dojo';
    if (id === 'guard_post') return null;
    if (tpl.cat === 'house') return 'house';
    return null;
  }

  function konoha(layout, seed = 7) {
    const ID = G.tiles.ID;
    const W = layout.size.w, HH = layout.size.h;
    const m = new G.WorldMap('konoha', W, HH, { outdoor: true, name: 'Коноха', bg: '#2e5a2e' });
    const rnd = G.util.rng(seed);
    // занятость клеток: 0 свободно, 1 дорога, 2 здание, 3 непроходимая местность, 4 резерв (двор/крыльцо), 5 декор
    const occ = new Uint8Array(W * HH);
    const O = (x, y) => (x >= 0 && y >= 0 && x < W && y < HH ? occ[y * W + x] : 3);
    const setO = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < HH) occ[y * W + x] = v; };
    const grassy = (x, y) => G.tiles.GRASSY.has(m.get(x, y));
    // 6 — мягкое кольцо у автодомов (можно пристроить вплотную); keep — дорожки и крыльца (не застраивать, без декора)
    const keep = new Uint8Array(W * HH);
    const KP = (x, y) => (x >= 0 && y >= 0 && x < W && y < HH ? keep[y * W + x] : 0);
    const setK = (x, y) => { if (x >= 0 && y >= 0 && x < W && y < HH) keep[y * W + x] = 1; };
    const bAt = new Int16Array(W * HH);   // индекс здания + 1 по клеткам пятна

    // ---------- 1. Земля ----------
    for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++) m.set(x, y, H(x, y, seed) < 0.14 ? ID.GRASS2 : ID.GRASS);
    m.districts = layout.districts.map((d) => Object.assign({}, d));

    const each = (d, fn) => { for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) if (m.inside(x, y)) fn(x, y); };
    for (const d of layout.districts) {
      switch (d.type) {
        case 'water': each(d, (x, y) => { m.set(x, y, ID.WATER); setO(x, y, 3); }); break;
        case 'cliff': each(d, (x, y) => { m.set(x, y, y >= d.y + d.h - 5 ? ID.CLIFF : ID.CLIFFTOP); setO(x, y, 3); }); break;
        case 'wall': each(d, (x, y) => { m.set(x, y, ID.VWALL); setO(x, y, 3); }); break;
        case 'forest': each(d, (x, y) => m.set(x, y, noise(x, y, 11, 5) > 0.35 ? ID.DARKGRASS : ID.GRASS2)); break;
        case 'park': each(d, (x, y) => { const n = noise(x, y, 12, 3); if (n > 0.72) m.set(x, y, ID.FLOWERS); else if (n < 0.25) m.set(x, y, ID.CLOVER); }); break;
        case 'training': each(d, (x, y) => { const n = noise(x, y, 13, 4); if (n > 0.62) m.set(x, y, ID.DIRT); else if (n < 0.22) m.set(x, y, ID.GRAVEL); }); break;
        case 'official': each(d, (x, y) => m.set(x, y, noise(x, y, 17, 6) > 0.7 ? ID.BRICK : ID.STONE)); break;
        case 'market': each(d, (x, y) => m.set(x, y, ID.STONE)); break;
        case 'uchiha': each(d, (x, y) => m.set(x, y, noise(x, y, 18, 4) > 0.66 ? ID.MOSS : ID.DARKGRASS)); break;
        case 'residential': case 'clan': each(d, (x, y) => { const n = noise(x, y, 19, 5); if (n > 0.74) m.set(x, y, ID.CLOVER); else if (n < 0.12) m.set(x, y, ID.FLOWERS); }); break;
        default: break;
      }
    }


    // ---------- 1б. Форма деревни по карте из аниме: круглая стена, горы и лес вокруг, круговые комплексы, озёра ----------
    const SH = layout.shape;
    const inRect = (x, y) => x >= 0 && y >= 0 && x < W && y < HH;
    const fillO = (x, y, v) => { if (inRect(x, y)) occ[y * W + x] = v; };
    if (SH) {
      const sup = (x, y, a, b) => Math.pow(Math.abs(x + 0.5 - SH.cx) / a, SH.p) + Math.pow(Math.abs(y + 0.5 - SH.cy) / b, SH.p);
      const wallT = SH.wall || 2.4, mount = new Uint8Array(W * HH);
      const outside = (x, y) => y >= 14 && sup(x, y, SH.a, SH.b) > 1;
      for (let y = 14; y < HH; y++) for (let x = 0; x < W; x++) if (outside(x, y) && y < SH.cy - 8 && noise(x, y, 41, 6) > 0.4) mount[y * W + x] = 1;
      for (let y = 14; y < HH; y++) for (let x = 0; x < W; x++) {
        if (y >= 14 && sup(x, y, SH.a, SH.b) <= 1) {
          if (sup(x, y, SH.a - wallT, SH.b - wallT) > 1) { m.set(x, y, ID.VWALL); setO(x, y, 3); }
        } else if (mount[y * W + x]) { m.set(x, y, mount[(y + 1) * W + x] ? ID.CLIFFTOP : ID.CLIFF); setO(x, y, 3); }
        else if (outside(x, y)) {
          m.set(x, y, noise(x, y, 42, 4) > 0.5 ? ID.GRASS2 : ID.DARKGRASS); setO(x, y, 3);
          if (x % 2 === 0 && y % 2 === 0 && H(x, y, 43) > 0.38 && x > 0 && x < W - 1) m.addObject(H(x, y, 44) > 0.4 ? 'pine' : 'tree', x * T + 8, y * T + 15);
        }
      }
      // круглые комплексы (резиденция Хокаге, арена): стена-кольцо, внутри площадь, проёмы заданы прямоугольниками
      for (const rg of SH.rings || []) {
        const floor = ID[rg.floor || 'PLAZA'];
        for (let y = Math.floor(rg.cy - rg.r) - 1; y <= rg.cy + rg.r + 1; y++) for (let x = Math.floor(rg.cx - rg.r) - 1; x <= rg.cx + rg.r + 1; x++) {
          const d = Math.hypot(x + 0.5 - rg.cx, y + 0.5 - rg.cy);
          if (d > rg.r || !m.inside(x, y) || O(x, y) === 3) continue;
          const gap = (rg.gaps || []).some((g) => x >= g[0] && x <= g[2] && y >= g[1] && y <= g[3]);
          if (d > rg.r - 1.7 && !gap) { m.set(x, y, ID.VWALL); setO(x, y, 3); }
          else { m.set(x, y, floor); setO(x, y, 4); }
        }
      }
      // озёра (с островком)
      for (const lk of SH.lakes || []) {
        for (let y = Math.floor(lk.cy - lk.ry) - 1; y <= lk.cy + lk.ry + 1; y++) for (let x = Math.floor(lk.cx - lk.rx) - 1; x <= lk.cx + lk.rx + 1; x++) {
          if (!m.inside(x, y) || O(x, y) === 3) continue;
          const e = Math.pow((x + 0.5 - lk.cx) / lk.rx, 2) + Math.pow((y + 0.5 - lk.cy) / lk.ry, 2);
          if (e <= 1) { m.set(x, y, ID.WATER); setO(x, y, 3); }
          else if (e <= 1.35 && grassy(x, y)) m.set(x, y, ID.SAND);
        }
        if (lk.isle) {
          const il = lk.isle;
          for (let y = Math.floor(il.cy - il.ry) - 1; y <= il.cy + il.ry + 1; y++) for (let x = Math.floor(il.cx - il.rx) - 1; x <= il.cx + il.rx + 1; x++) {
            if (Math.pow((x + 0.5 - il.cx) / il.rx, 2) + Math.pow((y + 0.5 - il.cy) / il.ry, 2) <= 1) { m.set(x, y, ID.GRASS); setO(x, y, 3); }
          }
          m.addObject('sakura', Math.floor(il.cx) * T + 8, Math.floor(il.cy) * T + 15);
        }
      }
    }

    // ---------- 2. Дороги ----------
    const roadTile = { main: ID.MAINROAD, street: ID.PATH, path: ID.DIRT };
    for (const r of layout.roads) {
      const rr = roadRect(r);
      for (let y = rr.y; y < rr.y + rr.h; y++) for (let x = rr.x; x < rr.x + rr.w; x++) {
        if (!m.inside(x, y) || O(x, y) === 3) continue;
        m.set(x, y, roadTile[r.type]); setO(x, y, 1);
      }
    }


    // ---------- 2б. Реки: плавные кривые; где дорога пересекает реку — мост ----------
    for (const rv of layout.rivers || []) {
      const P = rv.pts, cr = (a, b, c, d, t) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
      const line = [];
      for (let i = 0; i < P.length - 1; i++) {
        const a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], d = P[Math.min(P.length - 1, i + 2)];
        for (let t = 0; t < 1; t += 0.04) line.push([cr(a[0], b[0], c[0], d[0], t), cr(a[1], b[1], c[1], d[1], t)]);
      }
      line.push(P[P.length - 1]);
      const wet = new Set();
      for (const [sx, sy] of line) {
        const r = rv.w / 2;
        for (let y = Math.floor(sy - r) - 1; y <= sy + r + 1; y++) for (let x = Math.floor(sx - r) - 1; x <= sx + r + 1; x++) if (Math.hypot(x + 0.5 - sx, y + 0.5 - sy) <= r) wet.add(y * W + x);
      }
      for (const i of wet) {
        const x = i % W, y = (i / W) | 0; if (!m.inside(x, y) || O(x, y) === 3) continue;
        if (O(x, y) === 1) { m.set(x, y, ID.PLANKS); continue; }
        m.set(x, y, ID.WATER); setO(x, y, 3);
      }
      // набережная: булыжник вдоль воды
      for (const i of wet) {
        const x = i % W, y = (i / W) | 0;
        for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + ax, ny = y + ay; if (m.inside(nx, ny) && !wet.has(ny * W + nx) && O(nx, ny) !== 3 && O(nx, ny) !== 1 && grassy(nx, ny)) m.set(nx, ny, ID.COBBLE); }
      }
    }

    // ---------- 3. Здания ----------
    let bseed = 0;
    const isRoad = (x, y) => O(x, y) === 1 || G.tiles.ROADY.has(m.get(x, y));

    function addBuildingTiles(id, tpl, tx, ty, opts = {}) {
      const spr = G.buildgfx.make(id, tpl, opts.seed != null ? opts.seed : ++bseed);
      const b = m.addBuilding({ tplId: id, tplDef: tpl, tx, ty, tw: tpl.w, th: tpl.h, spr, name: nameOf(id, tpl, tx * 7 + ty * 13) });
      for (let y = ty; y < ty + tpl.h; y++) for (let x = tx; x < tx + tpl.w; x++) { m.setBlock(x, y, 1); setO(x, y, 2); if (m.inside(x, y)) bAt[y * W + x] = m.buildings.length; }
      // кольцо вокруг: у ключевых зданий — резерв (4), у автодомов — мягкое (6), к ним можно пристроиться вплотную
      const ring = opts.soft ? 6 : 4;
      for (let y = ty - 1; y <= ty + tpl.h; y++) for (let x = tx - 1; x <= tx + tpl.w; x++) if (O(x, y) === 0 || (ring === 4 && O(x, y) === 6)) setO(x, y, ring);
      if (tpl.door) {
        const dx = tx + tpl.door[0], dy = ty + tpl.door[1];
        b.door = { tx: dx, ty: dy };
        const kind = interiorKind(id, tpl);
        if (kind) {
          b.interior = { id: 'in:' + (m.buildings.length - 1), kind, name: b.name, seed: (dx * 131 + dy * 17) | 0, tplId: id };
          m.warps.push({
            rect: { x: dx * T + 1, y: (dy + 1) * T - 2, w: T - 2, h: 4 }, dir: 'up', building: b,
            to: { map: b.interior.id, entry: true },
          });
        } else b.locked = true;
        // крыльцо
        if (m.inside(dx, dy + 1) && O(dx, dy + 1) !== 1) { if (grassy(dx, dy + 1)) m.set(dx, dy + 1, ID.PATH); setO(dx, dy + 1, 4); setK(dx, dy + 1); }
      }
      return b;
    }

    // Дорожка от крыльца вниз до дороги (для ключевых зданий)
    function walkwayDown(x, y, maxLen = 12) {
      const path = [];
      for (let i = 0; i < maxLen; i++) {
        const yy = y + i;
        if (!m.inside(x, yy)) return;
        if (isRoad(x, yy) && i > 0) break;
        if (O(x, yy) === 2 || O(x, yy) === 3) return;
        path.push(yy);
        if (i === maxLen - 1) return;
      }
      for (const yy of path) { if (grassy(x, yy)) m.set(x, yy, ID.PATH); if (O(x, yy) !== 1) setO(x, yy, 4); }
    }

    function place(id, tx, ty) {
      const tpl = G.BUILDINGS[id];
      if (!tpl) return;
      const cx = tx * T, cy = ty * T;
      // ориентиры без зданий (водопад, пристань, колодец…) — для карты и заданий
      if (tpl.cat === 'landmark' || tpl.cat === 'training') (m.spots || (m.spots = {}))[id] = { tplId: id, tplDef: tpl, tx, ty, tw: tpl.w, th: tpl.h, name: tpl.name, spot: true };
      switch (id) {
        case 'hokage_rock': {
          const cl = layout.districts.find((d) => d.type === 'cliff' && tx >= d.x && tx < d.x + d.w);
          const bottom = cl ? cl.y + cl.h : ty + tpl.h;
          const spr = G.buildgfx.make(id, tpl, 0);
          m.addBuilding({ tplId: id, tplDef: tpl, tx, ty: bottom - tpl.h, tw: tpl.w, th: tpl.h, spr, sortY: -1, name: nameOf(id, tpl, tx * 7 + bottom) });
          return;
        }
        case 'training_3': case 'training_ground': {
          for (let y = ty; y < ty + tpl.h; y++) for (let x = tx; x < tx + tpl.w; x++) {
            const corner = (x === tx || x === tx + tpl.w - 1) && (y === ty || y === ty + tpl.h - 1);
            if (!corner && O(x, y) !== 1) { m.set(x, y, ID.DIRT); setO(x, y, 4); }
          }
          if (id === 'training_3') {
            [[3, 3], [5, 2], [7, 3]].forEach(([dx, dy]) => m.addObject('post', cx + dx * T + 8, cy + dy * T + 15, { talk: ['Деревянный столб, исцарапанный кунаями. Сюда привязывают провинившихся учеников.'] }));
            m.addObject('stump', cx + 2 * T + 8, cy + 6 * T + 15); m.addObject('log', cx + 7 * T, cy + 6 * T + 12);
          } else {
            for (let i = 0; i < 3; i++) m.addObject('target', cx + (1 + i * 2) * T + 8, cy + 1 * T + 15, { talk: ['Мишень для метания. Сюрикенов пока нет — их можно будет купить в оружейной.'] });
            m.addObject('dummy', cx + 2 * T + 8, cy + 4 * T + 15); m.addObject('dummy', cx + 5 * T + 8, cy + 4 * T + 15);
            m.addObject('log', cx + 4 * T, cy + 6 * T + 10);
          }
          return;
        }
        case 'memorial':
          m.addObject('memorial', cx + 16, cy + 31, { talk: ['Мемориальный камень. На нём высечены имена шиноби, погибших за деревню.', 'Где-то здесь есть и имена твоих родителей...'] });
          for (let y = ty - 1; y <= ty + 2; y++) for (let x = tx - 1; x <= tx + 2; x++) if (O(x, y) === 0) setO(x, y, 4);
          return;
        case 'swing_tree':
          m.addObject('tree', cx + 8, cy + T + 15);
          m.addObject('swing', cx + 2 * T + 16, cy + T + 15, { talk: ['Старые качели у Академии. Наруто часто сидит здесь один.'] });
          for (let y = ty - 1; y <= ty + 2; y++) for (let x = tx - 1; x <= tx + 4; x++) if (O(x, y) !== 1 && O(x, y) !== 2) setO(x, y, 4);
          return;
        case 'pier':
          for (let y = ty; y < ty + tpl.h; y++) for (let x = tx; x < tx + tpl.w; x++) { m.set(x, y, ID.PLANKS); setO(x, y, 4); }
          return;
        case 'waterfall': {
          for (let y = ty; y < ty + tpl.h; y++) for (let x = tx; x < tx + tpl.w; x++) { m.set(x, y, ID.CLIFF); setO(x, y, 3); }
          const o = m.addObject('rock', cx, cy, { box: null, anim: 'waterfall', fw: tpl.w * T, fh: tpl.h * T });
          o.ox = 0; o.oy = 0; o.w = tpl.w * T; o.h = tpl.h * T; o.sortY = cy; o.img = null;
          return;
        }
        case 'well': m.addObject('well', cx + 8, cy + 15, { talk: ['Старый колодец. Вода холодная и чистая.'] }); setO(tx, ty, 5); return;
        case 'stall': m.addObject('stall', cx + 16, cy + 15); setO(tx, ty, 5); setO(tx + 1, ty, 5); return;
        case 'night_alley':
          for (let y = ty; y < ty + tpl.h; y++) for (let x = tx; x < tx + tpl.w; x++) { m.set(x, y, ID.DARKSTONE); setO(x, y, 4); }
          m.addObject('crate', cx + 6, cy + T + 14); m.addObject('barrel', cx + T + 10, cy + 3 * T + 14);
          m.addObject('lamp', cx + T + 8, cy + 15, { talk: ['Тёмный переулок. Говорят, по ночам здесь торгует странный человек в капюшоне.'] });
          return;
        case 'gate': {
          const b = addBuildingTiles(id, tpl, tx, ty, { seed: 0 });
          // проход между столбами открыт, створки внизу закрыты
          for (let y = ty; y < ty + tpl.h - 1; y++) for (let x = tx + 1; x < tx + tpl.w - 1; x++) { m.setBlock(x, y, 0); setO(x, y, 1); }
          b.talk = ['Главные ворота «А» и «УН» закрыты.', 'Ученикам Академии выходить из деревни нельзя.'];
          return;
        }
        default: addBuildingTiles(id, tpl, tx, ty);
      }
    }
    for (const b of layout.buildings) place(b.tpl, b.x, b.y);

    // ---------- 4. Плотная застройка (как в аниме: дома почти вплотную, узкие переулки) ----------
    // Дорожка от клетки (sx, sy) до ближайшей дороги поиском в ширину. foot — будущее пятно здания.
    // Нельзя идти по клеткам, спрятанным за крышей здания ниже (или будущего здания), и через декор.
    function findPath(sx, sy, maxLen, foot) {
      const inFoot = (x, y) => foot && x >= foot.x && x < foot.x + foot.w && y >= foot.y && y < foot.y + foot.h;
      const ok = (x, y) => {
        if (!m.inside(x, y) || inFoot(x, y)) return false;
        const o = O(x, y);
        if (o === 1) return true;
        if (o !== 0 && o !== 4 && o !== 6) return false;
        if (o === 4 && !KP(x, y) && m.get(x, y) === ID.DIRT) return false;      // площадки полигонов с мишенями
        if (O(x, y + 1) === 2 || inFoot(x, y + 1)) return false;                // за крышей не видно
        return true;
      };
      if (!ok(sx, sy)) return null;
      if (O(sx, sy) === 1) return [];
      const prev = new Map(), start = sy * W + sx;
      prev.set(start, -1);
      let front = [start];
      for (let dd = 0; dd < maxLen && front.length; dd++) {
        const next = [];
        for (const i of front) {
          const x = i % W, y = (i / W) | 0;
          for (const [ax, ay] of [[0, 1], [-1, 0], [1, 0], [0, -1]]) {
            const nx = x + ax, ny = y + ay, j = ny * W + nx;
            if (prev.has(j) || !ok(nx, ny)) continue;
            prev.set(j, i);
            if (O(nx, ny) === 1) { const path = []; let k = i; while (k !== -1) { path.push(k); k = prev.get(k); } return path; }
            next.push(j);
          }
        }
        front = next;
      }
      return null;
    }
    function markPath(path, dtype) {
      for (const i of path) {
        const x = i % W, y = (i / W) | 0;
        if (grassy(x, y)) m.set(x, y, dtype === 'residential' && path.length > 2 ? ID.STEPS : dtype === 'uchiha' ? ID.DARKSTONE : ID.PATH);
        else if (m.get(x, y) === ID.STONE && dtype === 'official') m.set(x, y, ID.PLAZA);
        setO(x, y, 4); setK(x, y);
      }
    }

    // 4a. Площадки перед ключевыми зданиями и дорожки от их дверей
    const keyB = m.buildings.filter((b) => b.door && b.tplDef.unique && b.tplId !== 'gate');
    for (const b of keyB) {
      const rows = b.tplDef.cat === 'official' ? 3 : 2;
      for (let y = b.ty + b.th; y < b.ty + b.th + rows; y++) for (let x = b.tx - 1; x <= b.tx + b.tw; x++) {
        const o = O(x, y);
        if (o !== 0 && o !== 4 && o !== 6) continue;
        if (m.get(x, y) === ID.STONE && b.tplDef.cat === 'official') m.set(x, y, ID.PLAZA);
        setO(x, y, 4); setK(x, y);
      }
    }
    for (const b of keyB) { const p = findPath(b.door.tx, b.door.ty + 1, 40, null); if (p) markPath(p, 'key'); }

    // 4b. Переулки: горизонтальные ряды через каждые STEP клеток от дороги сверху + поперечные проходы
    const lane = new Uint8Array(W * HH);
    const laneOk = (x, y) => { const o = O(x, y); return (o === 0 || o === 4 || o === 6) && m.get(x, y) !== ID.WATER; };
    const LANES = { residential: [7, 13], uchiha: [9, 0], clan: [0, 0] };
    for (const d of layout.districts) {
      const L = LANES[d.type]; if (!L || !L[0]) continue;
      for (let x = d.x; x < d.x + d.w; x++) {
        let last = null;
        for (let y = d.y - 4; y < d.y + d.h; y++) {
          if (O(x, y) === 1) { last = y; continue; }
          if (last == null || y < d.y) continue;
          const k = y - last;
          if (k < L[0] || k % L[0]) continue;
          let nb = 0; while (nb < 6 && y + nb + 1 < d.y + d.h && O(x, y + nb + 1) !== 1) nb++;
          if (nb >= 4 && laneOk(x, y)) lane[y * W + x] = 1;
        }
      }
      if (L[1]) for (let y = d.y; y < d.y + d.h; y++) {
        let last = null;
        for (let x = d.x - 4; x < d.x + d.w; x++) {
          if (O(x, y) === 1) { last = x; continue; }
          if (last == null || x < d.x) continue;
          const k = x - last;
          if (k < L[1] || k % L[1]) continue;
          let nr = 0; while (nr < 6 && x + nr + 1 < d.x + d.w && O(x + nr + 1, y) !== 1) nr++;
          if (nr >= 5 && laneOk(x, y)) lane[y * W + x] = 2;
        }
      }
    }
    // связные куски переулков, касающиеся дороги, становятся булыжной мостовой
    {
      const seen = new Uint8Array(W * HH);
      for (let i = 0; i < W * HH; i++) {
        if (!lane[i] || seen[i]) continue;
        const comp = [i], touch = { v: false }; seen[i] = 1;
        for (let qi = 0; qi < comp.length; qi++) {
          const x = comp[qi] % W, y = (comp[qi] / W) | 0;
          for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = x + ax, ny = y + ay; if (!m.inside(nx, ny)) continue;
            const j = ny * W + nx;
            if (O(nx, ny) === 1) touch.v = true;
            // горизонтальные клетки соединяются по горизонтали, поперечные — по вертикали, на пересечениях — все
            if (lane[j] && !seen[j] && (lane[j] === lane[comp[qi]] ? (lane[j] === 1 ? ay === 0 : ax === 0) : true)) { seen[j] = 1; comp.push(j); }
          }
        }
        if (!touch.v || comp.length < 4) continue;
        for (const k of comp) { const x = k % W, y = (k / W) | 0; m.set(x, y, ID.COBBLE); setO(x, y, 1); keep[k] = 0; }
      }
    }

    // садики с деревьями между домами (резерв до застройки)
    for (const d of layout.districts) {
      if (d.type !== 'residential' && d.type !== 'market') continue;
      const n = Math.floor(d.w * d.h * (d.type === 'market' ? 0.002 : 0.005));
      for (let k = 0, got = 0; k < n * 6 && got < n; k++) {
        const x = d.x + 1 + Math.floor(rnd() * (d.w - 2)), y = d.y + 1 + Math.floor(rnd() * (d.h - 2));
        let ok = true;
        for (let yy = y - 1; yy <= y; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (O(xx, yy) !== 0 || KP(xx, yy)) ok = false;
        if (!ok || O(x, y + 1) === 1) continue;
        const h = H(x, y, 66);
        m.addObject(d.type === 'market' ? 'planter' : h > 0.7 ? 'sakura' : h > 0.5 ? 'maple' : h > 0.4 ? 'ginkgo' : 'tree', x * T + 8, y * T + 15);
        for (let yy = y - 1; yy <= y; yy++) for (let xx = x - 1; xx <= x + 1; xx++) setO(xx, yy, 5);
        got++;
      }
    }

    // 4c. Застройка: перебор клеток по рядам, шаблон — по весам района, проверка дорожки до дороги
    function fitsDense(tpl, tx, ty, d, maxPath) {
      if (tx < d.x || ty < d.y || tx + tpl.w > d.x + d.w || ty + tpl.h > d.y + d.h) return null;
      for (let y = ty; y < ty + tpl.h; y++) for (let x = tx; x < tx + tpl.w; x++) {
        const o = O(x, y);
        if ((o !== 0 && o !== 6) || KP(x, y)) return null;
      }
      for (let x = tx; x < tx + tpl.w; x++) {
        const a = O(x, ty - 1);                                   // ряд над домом скроется под его крышей
        if (a === 1 || a === 2 || KP(x, ty - 1)) return null;
        if ((tpl.ov || 16) > 16 && KP(x, ty - 2)) return null;
        if (O(x, ty + tpl.h) === 2) return null;                   // крыша дома ниже закрыла бы фасад
      }
      for (let y = ty; y < ty + tpl.h; y++) for (const x of [tx - 1, tx + tpl.w]) {
        if (O(x, y) === 2) { const nb = m.buildings[bAt[y * W + x] - 1]; if (!nb || !nb.auto) return null; }
      }
      const fx = tx + tpl.door[0], fy = ty + tpl.h;
      if (O(fx, fy + 1) === 2 && O(fx, fy) !== 1) return null;
      return findPath(fx, fy, maxPath, { x: tx, y: ty, w: tpl.w, h: tpl.h });
    }
    const FILL = {
      residential: { t: { house_s: 3, house_m: 2, house_xs: 2, house_n: 2, house_w: 2, house_t: 3, apartment_s: 1, tower_r: 1.2, apartment: 0.6, shop_s: 0.3 }, skip: 0.05, max: 400 },
      uchiha: { t: { uchiha_house: 2, uchiha_small: 2 }, skip: 0.25, max: 60 },
      clan: { t: { house_s: 2, house_xs: 2, house_m: 1 }, skip: 0.55, max: 6 },
      market: { t: { shop_s: 3, shop_generic: 2, house_n: 2, house_t: 2, house_xs: 1, tower_r: 0.6 }, skip: 0.08, max: 60 },
      official: { t: { office: 3, tower_r: 2, apartment_s: 1.5, house_w: 1, house_t: 1 }, skip: 0.3, max: 30 },
    };
    const pickW = (t) => { // перемешанный по весам список шаблонов
      const arr = Object.entries(t).map(([id, w]) => [id, -Math.log(rnd() + 1e-9) / w]);
      return arr.sort((a, b) => a[1] - b[1]).map((a) => a[0]);
    };
    for (const pass of [1, 9]) {
      for (const d of layout.districts) {
        const rule = FILL[d.type]; if (!rule) continue;
        let placed = m.buildings.filter((b) => b.auto && b.district === d).length;
        for (let ty = d.y; ty < d.y + d.h; ty++) for (let tx = d.x; tx < d.x + d.w; tx++) {
          if (placed >= rule.max) break;
          if (O(tx, ty) !== 0 && O(tx, ty) !== 6) continue;
          if (rnd() < rule.skip) continue;
          for (const id of pickW(rule.t)) {
            const tpl = G.BUILDINGS[id];
            const path = fitsDense(tpl, tx, ty, d, pass);
            if (!path) continue;
            const b = addBuildingTiles(id, tpl, tx, ty, { soft: true });
            b.auto = true; b.district = d;
            markPath(path, d.type);
            placed++;
            break;
          }
        }
      }
    }

    // ---------- 5. Декор ----------
    const tryTree = (x, y, kind) => {
      for (let yy = y - 1; yy <= y; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (O(xx, yy) !== 0) return false;
      if (!grassy(x, y)) return false;
      m.addObject(kind, x * T + 8, y * T + 15);
      for (let yy = y - 1; yy <= y; yy++) for (let xx = x - 1; xx <= x + 1; xx++) setO(xx, yy, 5);
      return true;
    };
    const tryObj = (x, y, kind, extra, ok = (o) => o === 0) => {
      if (!ok(O(x, y)) || KP(x, y)) return false;
      m.addObject(kind, x * T + 8, y * T + 15, extra);
      setO(x, y, 5);
      return true;
    };

    // деревья вдоль стены деревни
    for (let y = 14; y < HH; y++) for (let x = 0; x < W; x++) {
      if (O(x, y) !== 0) continue;
      const nearWall = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => m.get(x + dx, y + dy) === ID.VWALL);
      if (nearWall && H(x, y, 21) > 0.35) tryTree(x, y, 'tree');
    }

    // мелочи у стен автодомов: бельё, дрова, бочки для воды, горшки, велосипеды
    const nearWallOk = (x, y) => {
      if (O(x, y) !== 6 || KP(x, y) || O(x, y + 1) === 2) return false;
      // не перекрываем проходы: по обе стороны (гориз. или верт.) не должно быть стены/дороги одновременно
      const solid = (xx, yy) => { const o = O(xx, yy); return o === 2 || o === 3 || o === 5; };
      if ((solid(x - 1, y) && solid(x + 1, y)) || (solid(x, y - 1) && solid(x, y + 1))) return false;
      let free = 0; for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const o = O(x + ax, y + ay); if (o === 0 || o === 6 || o === 1 || o === 4) free++; }
      return free >= 3;
    };
    const SMALL = { residential: ['pots', 'woodpile', 'raintank', 'laundry', 'bicycle', 'pots', 'mailbox', 'flowerbed', 'barrel'], market: ['crate', 'sacks', 'barrel', 'redlantern', 'banner', 'crate'],
      uchiha: ['stonelamp', 'woodpile', 'tallgrass', 'tallgrass'], official: ['pots', 'banner', 'raintank', 'bicycle'], clan: ['pots', 'woodpile', 'stonelamp'] };
    for (const d of layout.districts) {
      const list = SMALL[d.type]; if (!list) continue;
      for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) {
        if (H(x, y, 61) > (d.type === 'residential' ? 0.14 : 0.1) || !nearWallOk(x, y)) continue;
        const kind = list[Math.floor(H(x, y, 62) * list.length)];
        if (kind === 'laundry' && !(O(x + 1, y) === 6 && nearWallOk(x + 1, y))) continue;
        tryObj(x, y, kind, null, (o) => o === 6);
        if (kind === 'laundry') setO(x + 1, y, 5);
      }
    }

    for (const d of layout.districts) {
      const sample = (density, fn) => {
        const n = Math.floor(d.w * d.h * density);
        for (let i = 0; i < n * 3 && n > 0; i++) {
          const x = d.x + Math.floor(rnd() * d.w), y = d.y + Math.floor(rnd() * d.h);
          fn(x, y);
        }
      };
      switch (d.type) {
        case 'forest':
          for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) {
            if (noise(x, y, 31, 6) > 0.32 && H(x, y, 32) > 0.25) tryTree(x, y, H(x, y, 33) > 0.35 ? 'pine' : 'tree');
          }
          for (let i = 0; i < 5; i++) sample(0.002, (x, y) => tryObj(x, y, 'deer', { talk: ['Олень клана Нара. Смотрит на тебя спокойно и без страха.'] }));
          sample(0.004, (x, y) => tryObj(x, y, 'rock'));
          break;
        case 'park':
          sample(0.05, (x, y) => tryTree(x, y, H(x, y, 5) > 0.55 ? 'sakura' : 'tree'));
          sample(0.004, (x, y) => tryObj(x, y, 'tallgrass'));
          sample(0.002, (x, y) => tryTree(x, y, 'bamboo'));
          sample(0.006, (x, y) => tryObj(x, y, 'bench'));
          sample(0.01, (x, y) => tryObj(x, y, 'bush'));
          break;
        case 'residential':
          sample(0.03, (x, y) => { const h = H(x, y, 6); tryTree(x, y, h > 0.8 ? 'sakura' : h > 0.65 ? 'maple' : h > 0.58 ? 'ginkgo' : h > 0.52 ? 'watertower' : 'tree'); });
          sample(0.02, (x, y) => tryObj(x, y, H(x, y, 7) > 0.6 ? 'hedge' : 'bush'));
          sample(0.004, (x, y) => tryObj(x, y, 'shrine', { talk: ['Маленькое святилище. Кто-то оставил рисовый колобок и свежие цветы.'] }));
          sample(0.006, (x, y) => tryObj(x, y, 'tallgrass'));
          sample(0.006, (x, y) => tryObj(x, y, H(x, y, 3) > 0.5 ? 'flowerbox' : 'barrel'));
          sample(0.002, (x, y) => tryObj(x, y, 'well', { talk: ['Колодец во дворе. Рядом сушится бельё.'] }));
          break;
        case 'training':
          sample(0.03, (x, y) => tryTree(x, y, H(x, y, 8) > 0.75 ? 'maple' : 'tree'));
          sample(0.01, (x, y) => tryObj(x, y, 'tallgrass'));
          sample(0.006, (x, y) => tryObj(x, y, 'rock'));
          sample(0.004, (x, y) => tryObj(x, y, 'stump'));
          break;
        case 'uchiha':
          sample(0.012, (x, y) => tryTree(x, y, H(x, y, 9) > 0.6 ? 'bamboo' : 'tree'));
          sample(0.01, (x, y) => tryObj(x, y, 'tallgrass'));
          sample(0.004, (x, y) => tryObj(x, y, 'stonelamp'));
          break;
        case 'official':
          for (let y = d.y + 1; y < d.y + d.h - 1; y += 5) for (let x = d.x + 2; x < d.x + d.w - 1; x += 6) {
            if (H(x, y, 41) > 0.45) tryObj(x, y, H(x, y, 43) > 0.6 ? 'sakura' : 'planter');
            else if (H(x, y, 42) > 0.6) tryObj(x, y, 'stonelamp');
          }
          sample(0.004, (x, y) => tryObj(x, y, 'bench'));
          break;
        case 'market':
          sample(0.02, (x, y) => {
            if (O(x, y) !== 0 || O(x + 1, y) !== 0 || O(x, y - 1) === 2) return;
            m.addObject('stall', x * T + 16, y * T + 15); setO(x, y, 5); setO(x + 1, y, 5);
          });
          sample(0.01, (x, y) => tryObj(x, y, H(x, y, 4) > 0.5 ? 'barrel' : 'crate'));
          sample(0.005, (x, y) => tryObj(x, y, H(x, y, 5) > 0.5 ? 'redlantern' : 'banner'));
          break;
        case 'clan':
          // забор по верхнему краю квартала
          for (let x = d.x; x < d.x + d.w; x++) if (O(x, d.y) === 0) { m.addObject('clanwall', x * T + 8, d.y * T + 15); setO(x, d.y, 5); }
          sample(0.02, (x, y) => tryTree(x, y, H(x, y, 10) > 0.7 ? 'maple' : 'tree'));
          sample(0.008, (x, y) => tryObj(x, y, 'stonelamp'));
          sample(0.004, (x, y) => tryObj(x, y, 'pond', null, (o) => o === 0 && O(x - 1, y) === 0 && O(x + 1, y) === 0 && O(x, y - 1) === 0 && O(x - 1, y - 1) === 0 && O(x + 1, y - 1) === 0) && [[-1, 0], [1, 0], [0, -1], [-1, -1], [1, -1]].forEach(([a, b]) => setO(x + a, y + b, 5)));
          sample(0.006, (x, y) => tryObj(x, y, 'bamboofence'));
          break;
      }
    }

    // ---------- 5б. Россыпь мелкой природы: цветы (пятнами), кусты, камни, папоротники, грибы, камыш ----------
    {
      const FL = ['red', 'yellow', 'white', 'blue', 'pink', 'purple', 'orange'];
      const FP = { park: 0.1, residential: 0.05, clan: 0.05, uchiha: 0.018, official: 0.022, market: 0, forest: 0.012, training: 0.008 };
      const small = new Uint8Array(W * HH);
      const near = (x, y, f) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => f(m.get(x + a, y + b)));
      for (let y = 14; y < HH - 1; y++) for (let x = 1; x < W - 1; x++) {
        if (!grassy(x, y) || KP(x, y)) continue;
        const o = O(x, y); if (o !== 0 && o !== 6) continue;
        const d = m.districtAt(x, y), dt = d ? d.type : 'residential';
        const dark = m.get(x, y) === ID.DARKGRASS || dt === 'forest' || dt === 'uchiha';
        const r = H(x, y, 701), r2 = H(x, y, 702);
        const jx = Math.floor(H(x, y, 703) * 7) - 3, jy = Math.floor(H(x, y, 704) * 3);
        const put = (kind, blocks) => {
          if (blocks && o !== 0) return false;
          m.addObject(kind, x * T + 8 + jx, y * T + 13 + jy, blocks ? undefined : { box: null });
          small[y * W + x] = 1; if (blocks) setO(x, y, 5);
          return true;
        };
        // цветочные поляны: шум задаёт пятна и их цвет
        const n = noise(x, y, 91, 7), fam = FL[Math.floor(noise(x, y, 92, 11) * FL.length) % FL.length];
        const fp = (FP[dt] != null ? FP[dt] : 0.02) * (n > 0.62 ? 4.5 : 1);
        if (!small[y * W + x] && r < fp) { put('fl_' + (n > 0.62 ? fam : FL[Math.floor(r2 * FL.length)]), false); continue; }
        if (dt === 'market') continue;
        const q = H(x, y, 705);
        if (dark && q < 0.035) { put(q < 0.012 ? 'mushroom' : 'fern', false); continue; }
        if (q < 0.012 && o === 0) { put(['bush_pink', 'bush_white', 'bush_red', 'bush_yellow'][Math.floor(r2 * 4)], true); continue; }
        if (q < 0.03 && o === 0) { put(r2 > 0.5 ? 'bush3' : 'bush', true); continue; }
        if (q < 0.045) { put(r2 > 0.6 ? 'shrub' : r2 > 0.3 ? 'lavender' : 'sunflower', false); continue; }
        if (q < 0.058) { put('pebbles', false); continue; }
        if (q < 0.064 && o === 0) { put('rock3', true); continue; }
        if (q < 0.0655 && o === 0 && dt !== 'residential') { put('rock2', true); continue; }
        if (q < 0.072 && (dt === 'park' || dt === 'forest')) { put('leafpile', false); continue; }
        if (near(x, y, (t) => t === ID.WATER) && r < 0.35) { put('reeds', false); continue; }
      }
    }

    // фонари вдоль главных улиц
    for (const r of layout.roads) {
      if (r.type !== 'main') continue;
      const rr = roadRect(r);
      const horiz = r.y1 === r.y2;
      const len = horiz ? rr.w : rr.h;
      for (let i = 2; i < len; i += 7) {
        const a = horiz ? [rr.x + i, rr.y - 1] : [rr.x - 1, rr.y + i];
        const b = horiz ? [rr.x + i, rr.y + rr.h] : [rr.x + rr.w, rr.y + i];
        for (const [x, y] of [a, b]) if (!KP(x, y) && (O(x, y) === 0 || (O(x, y) === 4 && m.get(x, y) === ID.STONE && O(x, y - 1) !== 2 && O(x, y + 1) !== 2))) tryObj(x, y, 'lamp', null, () => true);
      }
    }

    // таблички-указатели
    const signs = [
      [77, 47, ['▲ Академия, резиденция Хокаге, Скала Хокаге', '< Квартал кланов   Квартал Учиха >', '▼ Жилые кварталы, полигоны, главные ворота']],
      [81, 61, ['Жилой квартал. Дом героя — к востоку отсюда.', 'Мимо квартиры Наруто ночью лучше не шуметь.']],
      [74, 119, ['Главные ворота Конохи. Посты стражи: Изумо и Котецу.']],
      [27, 43, ['Лес клана Нара. Без разрешения не входить. Не кормить оленей!']],
      [131, 61, ['Квартал Учиха. После трагедии здесь живёт только Саске.']],
    ];
    for (let [x, y, talk] of signs) {
      const bad = (xx, yy) => O(xx, yy) === 2 || O(xx, yy) === 3 || O(xx, yy) === 1 || O(xx, yy) === 5 || KP(xx, yy);
      if (bad(x, y)) { const alt = [[1, 0], [-1, 0], [0, 1], [0, -1], [2, 0], [-2, 0]].find(([a, b]) => !bad(x + a, y + b)); if (!alt) continue; x += alt[0]; y += alt[1]; }
      m.addObject('sign', x * T + 8, y * T + 15, { talk });
      setO(x, y, 5);
    }

    // недостижимые «карманы» (дворы за домами без прохода) делаем непроходимыми
    m.finalize();
    pockets(m);

    // ---------- 6. Точки появления ----------
    m.spawnPoints = [];
    for (const d of layout.districts) {
      if (!['residential', 'market', 'official', 'park', 'clan', 'training'].includes(d.type)) continue;
      const n = { market: 8, official: 6, residential: 7, park: 3, clan: 2, training: 2 }[d.type];
      let tries = 0, got = 0;
      while (got < n && tries++ < 200) {
        const x = d.x + Math.floor(rnd() * d.w), y = d.y + Math.floor(rnd() * d.h);
        if (m.solidTile(x, y) || O(x, y) === 5 || O(x, y) === 2) continue;
        m.spawnPoints.push({ x: x * T + 8, y: y * T + 12, district: d.type });
        got++;
      }
    }

    // ключевые точки (для NPC и телепорта)
    m.landmarks = {};
    for (const b of m.buildings) if (b.tplDef.unique) m.landmarks[b.tplId] = b;
    m.spots = m.spots || {};
    for (const b of m.buildings) delete m.spots[b.tplId];   // у кого есть здание — это не «точка»
    m.occ = occ; m.keep = keep;
    m.roads = layout.roads.map((r) => Object.assign({ rect: roadRect(r) }, r));
    m.finalize();
    return m;
  }

  // Заливка от главной улицы: всё проходимое, куда нельзя дойти, становится непроходимым,
  // чтобы NPC, травы, свитки и места прыжка с крыш не оказывались в замкнутых дворах.
  function pockets(m, sx = 78, sy = 50) {
    const T = G.CONFIG.TILE, W = m.w, HH = m.h;
    const free = new Uint8Array(W * HH), seen = new Uint8Array(W * HH);
    for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++) free[y * W + x] = m.blockedRect({ x: x * T + 3, y: y * T + 7, w: 10, h: 5 }) ? 0 : 1;
    const q = [sy * W + sx]; seen[q[0]] = 1;
    for (let qi = 0; qi < q.length; qi++) {
      const i = q[qi], x = i % W, y = (i / W) | 0;
      for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + ax, ny = y + ay; if (nx < 0 || ny < 0 || nx >= W || ny >= HH) continue;
        const j = ny * W + nx; if (seen[j] || !free[j]) continue;
        seen[j] = 1; q.push(j);
      }
    }
    let n = 0;
    for (let i = 0; i < W * HH; i++) if (free[i] && !seen[i]) { m.setBlock(i % W, (i / W) | 0, 1); n++; }
    m.reach = seen; m.pocketTiles = n;
    m._walk = null;
    return n;
  }

  return { konoha, roadRect, noise, pockets };
})();


// ===== world/interiors.js =====
// Интерьеры: отдельные маленькие карты. Строятся по «виду» (kind) и seed здания.
// Комната: сверху две строки стены, по бокам и снизу — рамка, внизу по центру — коврик-выход.
G.interiors = (() => {
  const T = G.CONFIG.TILE;
  const VILLAGER_LINES = [
    'Чай будешь? Шучу, у меня самой заварка кончилась.',
    'Мой сын тоже учится в Академии. Говорит, Ирука-сенсей строгий, но добрый.',
    'Опять Наруто разрисовал Скалу Хокаге... Весь квартал смеялся.',
    'Говорят, этой осенью будет фестиваль. Надеюсь, погода не подведёт.',
    'Ты ведь тот новенький, что вернулся в деревню? Добро пожаловать домой.',
    'Ичираку — лучший рамен в деревне. Только не говори об этом хозяину Якинику Q.',
    'В квартал Учиха я бы ночью не ходил. Тихо там... слишком тихо.',
    'Тренируйся, пока молодой! Я вот в твои годы...',
    'Стучаться надо! Ну ладно, проходи, раз пришёл.',
    'Кошку Тору не видел? Жена даймё опять её ищет.',
  ];

  function room(id, name, w, h, floorId, opts = {}) {
    const ID = G.tiles.ID;
    const m = new G.WorldMap(id, w, h, { name, bg: '#140f0c' });
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let t = floorId;
      if (y < 2) t = ID.IWALL;
      else if (x === 0 || x === w - 1 || y === h - 1) t = ID.VOID;
      m.set(x, y, t);
    }
    const ex = opts.exitX != null ? opts.exitX : Math.floor(w / 2);
    m.set(ex, h - 1, ID.MAT);
    m.exit = { tx: ex, ty: h - 1 };
    m.warps.push({ rect: { x: ex * T + 1, y: (h - 1) * T + 6, w: T - 2, h: 10 }, dir: 'down', to: { back: true } });
    m.spawn = { x: ex * T + 8, y: (h - 2) * T + 12, dir: 'up' };
    return m;
  }

  // Поставить объект: (tx, ty) — клетка, привязка по низу; dx — сдвиг в пикселях (для широких)
  const put = (m, kind, tx, ty, extra, dx = 8) => m.addObject(kind, tx * T + dx, ty * T + 15, extra);
  const onWall = (m, kind, tx, extra, dx = 8) => m.addObject(kind, tx * T + dx, T + 13, Object.assign({ box: null }, extra));
  const npc = (m, id, tx, ty, dir, talk, extra = {}) => m.npcs.push(Object.assign({ id, x: tx * T + 8, y: ty * T + 12, dir, talk, ai: 'idle' }, extra));
  const rug = (m, x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) m.set(x, y, G.tiles.ID.RUG); };

  // ---------- Виды интерьеров ----------
  const KINDS = {
    hero_home(info) {
      const ID = G.tiles.ID;
      const m = room(info.id, 'Дом героя', 10, 8, ID.TATAMI, { exitX: 5 });
      put(m, 'futon', 1, 4, { talk: 'home_bed' }, 9);
      put(m, 'chest', 3, 2, { talk: ['Сундук. Здесь будут храниться вещи, которые не влезают в подсумок.'] });
      put(m, 'desk', 5, 2, { talk: ['Стол для учёбы. Учебник «История Конохи» открыт на главе про Первого Хокаге.'] }, 13);
      onWall(m, 'calendar', 4, { talk: 'home_calendar' });
      onWall(m, 'window', 6);
      put(m, 'kitchen', 7, 2, { talk: 'home_kitchen' }, 16);
      put(m, 'flowerpot', 8, 5, { talk: ['Цветок в горшке. Его надо поливать — как у Наруто.'] });
      put(m, 'table', 4, 5, null, 16);
      onWall(m, 'emblem', 2, { talk: ['Знак Листа. Его оставили тебе родители.'] });
      return m;
    },

    naruto_flat(info) {
      const ID = G.tiles.ID;
      const m = room(info.id, 'Квартира Наруто', 9, 7, ID.FLOOR, { exitX: 4 });
      put(m, 'futon', 1, 4, { talk: ['Неубранная постель. На подушке — ночной колпак с мордочкой.'] }, 9);
      put(m, 'cups', 4, 3); put(m, 'cups', 2, 5); put(m, 'cups', 7, 5);
      onWall(m, 'poster', 3, { talk: ['Самодельный плакат: «Я стану Хокаге!!!» Буквы кривые, зато крупные.'] });
      onWall(m, 'window', 6);
      put(m, 'kitchen', 6, 2, { talk: ['На полке — пирамида из лапши быстрого приготовления. И молоко... с истёкшим сроком.'] }, 16);
      put(m, 'table', 6, 4, null, 0);
      return m;
    },

    house(info) {
      const ID = G.tiles.ID;
      const r = G.util.rng(info.seed);
      const w = r.int(9, 11), h = r.int(7, 9);
      const m = room(info.id, info.name || 'Дом', w, h, r.chance(0.5) ? ID.TATAMI : ID.FLOOR);
      put(m, 'futon', 1, 4, null, 9);
      put(m, 'kitchen', w - 3, 2, null, 16);
      put(m, 'table', Math.floor(w / 2), Math.floor(h / 2) + 1, null, 0);
      if (r.chance(0.7)) put(m, 'shelf', 3, 2);
      if (r.chance(0.6)) put(m, 'plant', w - 2, h - 2);

  // Дополнительный декор: настенные украшения, мебель вдоль стен, коврики и мелочи на полу
  function decorate(m, info) {
    const ID = G.tiles.ID, w = m.w, h = m.h, r = G.util.rng((info.seed || 1) * 7 + 13);
    const kind = info.kind || '';
    if (kind === 'abandoned' || kind === 'dojo' || kind === 'academy_hall') return;
    const cozy = !['academy_hall', 'hokage_hall', 'library', 'hospital'].includes(kind);
    const ex = m.exit ? m.exit.tx : Math.floor(w / 2);
    const used = new Set();
    // клетки, которые занимает рисунок объекта (с учётом смещения спрайта)
    const cells = (x, y, ox, oy, ow, oh) => {
      const out = [];
      const x0 = Math.floor((x + ox + 1) / T), x1 = Math.floor((x + ox + ow - 2) / T);
      const y0 = Math.max(2, Math.floor((y + oy + 1) / T)), y1 = Math.floor((y - 1) / T);
      for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) out.push([xx, yy]);
      return out;
    };
    const mark = (o) => { for (const [x, y] of cells(o.x, o.y, o.ox || 0, o.oy || 0, o.w || T, o.h || T)) used.add(x + ',' + y); if (o.box) for (let yy = Math.floor(o.box.y / T); yy <= Math.floor((o.box.y + o.box.h - 1) / T); yy++) for (let xx = Math.floor(o.box.x / T); xx <= Math.floor((o.box.x + o.box.w - 1) / T); xx++) used.add(xx + ',' + yy); };
    for (const o of m.objects) if (o.y !== T + 13) mark(o);
    for (const n of m.npcs) { const tx = Math.floor(n.x / T), ty = Math.floor(n.y / T); for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) used.add((tx + a) + ',' + (ty + b)); }
    const floor = (x, y) => x >= 1 && x <= w - 2 && y >= 2 && y <= h - 2 && m.get(x, y) !== ID.VOID && m.get(x, y) !== ID.IWALL && m.get(x, y) !== ID.MAT && m.get(x, y) !== ID.WATER;
    const lane = (x, y) => y >= h - 3 && Math.abs(x - ex) <= 1;
    const free = (x, y) => floor(x, y) && !used.has(x + ',' + y) && !lane(x, y);
    const take = (x, y) => used.add(x + ',' + y);
    // поместится ли объект kind в клетку (x, y): все клетки рисунка — свободный пол
    const fits = (k, x, y, dx = 8) => { const s = G.tiles.object(k); return cells(x * T + dx, y * T + 15, s.ox, s.oy, s.w, s.h).every(([cx, cy]) => free(cx, cy)); };
    const place = (k, x, y, extra) => { const o = put(m, k, x, y, extra); mark(o); return o; };
    // мебель вдоль стен (до настенных украшений); высокая мебель занимает и стену
    const wallBusy = m.objects.filter((o) => o.y === T + 13 || (o.y + (o.oy || 0)) < 2 * T).map((o) => Math.floor(o.x / T));
    const solids = cozy ? ['tansu', 'wardrobe', 'hibachi', 'vase', 'bonsai', 'bookpile', 'lowtable'] : ['vase', 'bonsai', 'bookpile'];
    const spots = [];
    for (let x = 1; x <= w - 2; x++) spots.push([x, 2]);
    for (let y = 3; y <= h - 4; y++) { spots.push([1, y]); spots.push([w - 2, y]); }
    for (let i = spots.length - 1; i > 0; i--) { const j = r.int(0, i); [spots[i], spots[j]] = [spots[j], spots[i]]; }
    let ns = 0;
    for (const [x, y] of spots) {
      if (ns >= (cozy ? 3 : 2)) break;
      const k = solids[r.int(0, solids.length - 1)];
      if (!fits(k, x, y)) continue;
      // соседние клетки тоже свободны — между предметами остаётся проход
      let clear = true;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) if ((a || b) && used.has((x + a) + ',' + (y + b))) clear = false;
      if (!clear) continue;
      if (y === 2 && wallBusy.some((bx) => Math.abs(bx - x) < 2)) continue;
      place(k, x, y); for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) take(x + a, y + b); ns++;
      if (y === 2) wallBusy.push(x);
    }
    // настенные украшения — только на свободных участках стены
    const wallItems = ['painting', 'mirror', 'wallshelf', 'chochin'];
    for (let i = 0, n = 0; i < 14 && n < (cozy ? 2 : 1); i++) {
      const x = r.int(1, w - 2);
      if (wallBusy.some((b) => Math.abs(b - x) < 2)) continue;
      onWall(m, r.pick(wallItems), x); wallBusy.push(x); n++;
    }
    // коврики и мелочи на полу (проходимые)
    const soft = ['cushion', 'cushion_b', 'basket', 'cat', 'shoes', 'rug_red', 'rug_blue', 'rug_round'];
    let nf = 0;
    for (let i = 0; i < 40 && nf < (cozy ? 4 : 2); i++) {
      const x = r.int(1, w - 2), y = r.int(3, h - 2);
      const k = soft[r.int(0, soft.length - 1)];
      if (k === 'cat' && (!cozy || r() > 0.25 || m.objects.some((o) => o.kind === 'cat'))) continue;
      if (!fits(k, x, y)) continue;
      place(k, x, y, { box: null }); nf++;
    }
  }

  function build(info) {
    const fn = KINDS[info.kind] || KINDS.house;
    const m = fn(info);
    m.info = info;
    try { decorate(m, info); } catch (e) { console.warn('decorate', e); }
    m.finalize();
    return m;
  }

  return { build, KINDS, VILLAGER_LINES };
})();

// Мир: кэш карт (Коноха + интерьеры), персонажи и их движение.
G.actors = {
  make(id, x, y, dir = 'down') {
    return { id, x, y, dir, moving: false, anim: 0, ai: 'none', aiT: 1 + Math.random() * 2, vx: 0, vy: 0, stepT: 0, home: { x, y } };
  },
  feet(a, x = a.x, y = a.y) { return { x: x - 5, y: y - 5, w: 10, h: 5 }; },

  blocked(map, a, nx, ny, others) {
    const b = this.feet(a, nx, ny);
    if (map.blockedRect(b)) return true;
    if (others) for (const o of others) {
      if (o === a || o.roof || o.jump || Math.abs(o.x - nx) > 12 || Math.abs(o.y - ny) > 7) continue;
      if (G.util.rectsOverlap(b, this.feet(o))) return true;
    }
    return false;
  },

  // Шаг на 1 пиксель по осям, со «скольжением» вокруг углов
  step(map, a, dx, dy, others) {
    let moved = false;
    const sgn = G.util.sign;
    if (this.blocked(map, a, a.x, a.y, null)) { a.x += dx; a.y += dy; return true; } // застрял — выпускаем
    if (dx) {
      if (!this.blocked(map, a, a.x + dx, a.y, others)) { a.x += dx; moved = true; }
      else if (!dy) for (const n of [1, -1, 2, -2, 3, -3, 4, -4]) {
        if (!this.blocked(map, a, a.x, a.y + n, others) && !this.blocked(map, a, a.x + dx, a.y + n, others)) { a.y += sgn(n); moved = true; break; }
      }
    }
    if (dy) {
      if (!this.blocked(map, a, a.x, a.y + dy, others)) { a.y += dy; moved = true; }
      else if (!dx) for (const n of [1, -1, 2, -2, 3, -3, 4, -4]) {
        if (!this.blocked(map, a, a.x + n, a.y, others) && !this.blocked(map, a, a.x + n, a.y + dy, others)) { a.x += sgn(n); moved = true; break; }
      }
    }
    return moved;
  },

  // Плавное движение с накоплением дробной части
  move(map, a, vx, vy, others) {
    a.vx += vx; a.vy += vy;
    const sx = Math.trunc(a.vx), sy = Math.trunc(a.vy);
    a.vx -= sx; a.vy -= sy;
    let any = false;
    const n = Math.max(Math.abs(sx), Math.abs(sy));
    for (let i = 0; i < n; i++) {
      if (this.step(map, a, i < Math.abs(sx) ? Math.sign(sx) : 0, i < Math.abs(sy) ? Math.sign(sy) : 0, others)) any = true;
    }
    return any || n === 0;
  },

  DIRV: { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] },
  OPP: { up: 'down', down: 'up', left: 'right', right: 'left' },
};

G.world = {
  maps: {},
  SEED: 7,

  konoha() {
    if (!this.maps.konoha) {
      const t0 = performance.now();
      const m = G.mapgen.konoha(G.KONOHA_DRAFT, this.SEED);
      this.populateKonoha(m);
      m.finalize();
      G.mapgen.pockets(m);
      this.maps.konoha = m;
      this.genMs = Math.round(performance.now() - t0);
    }
    return this.maps.konoha;
  },

  get(id) {
    if (id === 'konoha') return this.konoha();
    if (this.maps[id]) return this.maps[id];
    const k = this.konoha();
    const n = Number(String(id).split(':')[1]);
    const b = k.buildings[n];
    if (!b || !b.interior) return k;
    const m = G.interiors.build(b.interior);
    m.building = b;
    // проход от точки появления до коврика всегда свободен
    const ex = m.warps[0] && m.warps[0].rect;
    if (ex) {
      const lane = { x: m.spawn.x - 9, y: m.spawn.y - 12, w: 18, h: ex.y + ex.h - (m.spawn.y - 12) };
      const before = m.objects.length;
      m.objects = m.objects.filter((o) => !(o.box && G.util.rectsOverlap(o.box, lane)));
      if (m.objects.length !== before) m.finalize();
    }
    m.npcs = m.npcs.map((s) => this.makeNpc(s));
    this.maps[id] = m;
    return m;
  },

  // Позиция перед дверью здания (снаружи)
  outsideOf(b) {
    const T = G.CONFIG.TILE;
    return { map: 'konoha', x: b.door.tx * T + 8, y: (b.door.ty + 1) * T + 11, dir: 'down' };
  },

  heroHome() { return this.konoha().landmarks.hero_home; },
  startPos() {
    const b = this.heroHome();
    const m = this.get(b.interior.id);
    return { map: m.id, x: 3 * 16 + 8, y: 4 * 16 + 4, dir: 'down' };
  },

  makeNpc(s) {
    const a = G.actors.make(s.id, s.x, s.y, s.dir || 'down');
    Object.assign(a, { ai: s.ai || 'idle', talk: s.talk, reach: s.reach, wanderR: s.wanderR || 32, mark: s.mark, name: s.name, cond: s.cond, shop: s.shop, shopTitle: s.shopTitle,
      sched: s.sched, keep: s.keep, dryOnly: s.dryOnly });
    return a;
  },

  populateKonoha(m) {
    const T = G.CONFIG.TILE;
    const L = (tpl) => G.KONOHA_DRAFT.buildings.find((b) => b.tpl === tpl);
    const at = (tx, ty) => ({ x: tx * T + 8, y: ty * T + 12 });
    const list = [];
    const sw = L('swing_tree'), fl = L('flowers'), pier = L('pier'), hy = L('clan_hyuga'), ac = L('academy');
    const H = 60, day1 = () => G.state.vars.day === 1;
    // Расписание (этап 4): sched — окна [от, до, дни], keep — «держать» ради сюжета.
    // В будни до обеда одноклассники в Академии (interiors.js), после — в своих местах.
    if (sw) list.push({ id: 'naruto', ...at(sw.x + 2, sw.y + 3), dir: 'down', talk: 'naruto_konoha', mark: 'naruto',
      cond: () => !G.state.flags.naruto_invited || G.state.flags.ramen_done,
      keep: () => day1() && !G.state.flags.naruto_invited,
      sched: [[12 * H, 18 * H, 'wd'], [9 * H, 18 * H, 'we']] });
    if (fl) list.push({ id: 'sakura', ...at(fl.x + 3, fl.y + 5), dir: 'down', talk: 'sakura_konoha', mark: 'sakura', ai: 'wander', wanderR: 20,
      sched: [[13 * H, 19 * H, 'wd'], [10 * H, 18 * H, 'we']], dryOnly: true });
    if (pier) list.push({ id: 'sasuke', ...at(pier.x + 1, pier.y + 3), dir: 'down', talk: 'sasuke_konoha', mark: 'sasuke',
      sched: [[13 * H, 20 * H, 'wd'], [6 * H, 12 * H, 'we'], [15 * H, 20 * H, 'we']] });
    if (hy) list.push({ id: 'hinata', ...at(hy.x + 7, hy.y + 9), dir: 'left', talk: 'hinata_konoha', mark: 'hinata',
      sched: [[14 * H, 19 * H, 'wd'], [9 * H, 18 * H, 'we']] });
    // Шикамару после уроков смотрит на облака на лужайке за Академией
    if (ac) {
      const spot = this.freeTile(m, ac.x + 12, ac.y + 2);
      if (spot) list.push({ id: 'shikamaru', ...at(spot[0], spot[1]), dir: 'up', talk: 'shikamaru_clouds',
        sched: [[13 * H, 18 * H, 'wd'], [10 * H, 18 * H, 'we']], dryOnly: true });
    }
    // Ночной патруль чунинов на перекрёстке главных улиц (комендантский час для учеников — с 23:00)
    const cross = this.freeTile(m, 78, 45);
    if (cross) list.push({ id: 'villager_m', ...at(cross[0], cross[1]), dir: 'down', name: 'Чунин-патрульный', talk: 'patrol_warn',
      ai: 'wander', wanderR: 40, sched: [[22 * H, 30 * H]] });
    // массовка
    const rnd = G.util.rng(99);
    for (const sp of m.spawnPoints) {
      const id = rnd.chance(0.5) ? 'villager_m' : 'villager_f';
      const line = G.interiors.VILLAGER_LINES[Math.floor(rnd() * G.interiors.VILLAGER_LINES.length)];
      // ночью улицы пустеют (§2.5): большинство жителей гуляет с 6 до 22, часть прячется от дождя
      const night = rnd.chance(0.15), dry = rnd.chance(0.5);
      list.push({ id, x: sp.x, y: sp.y, dir: rnd.pick(['up', 'down', 'left', 'right']), ai: 'wander', wanderR: 56, talk: [{ who: id, name: id === 'villager_m' ? 'Житель' : 'Жительница', text: line }],
        sched: night ? null : [[6 * 60 + (sp.x % 7) * 10, 21 * 60 + (sp.y % 7) * 10]], dryOnly: dry && !night });
    }
    m.npcs = list.map((s) => this.makeNpc(s));
    // секрет: камень у водопада
    const wf = m.spots.waterfall;
    if (wf) { m.secretRock = m.addObject('rock', (wf.tx - 1) * T + 8, (wf.ty + wf.th) * T + 2, { talk: 'secret_waterfall' }); m.finalize(); }
  },

  // Ближайшая свободная клетка улицы (для расстановки NPC)
  // strict: клетка не в узком проходе (свободно ≥3 соседей) и достижима от главной улицы
  freeTile(m, tx, ty, obstacle) {
    const T = G.CONFIG.TILE;
    const free = (x, y) => !m.blockedRect({ x: x * T + 2, y: y * T + 4, w: 12, h: 10 }) && !(m.reach && !m.reach[y * m.w + x]);
    for (const strict of [true, false]) for (let r = 0; r <= 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = tx + dx, y = ty + dy;
      if (!free(x, y)) continue;
      if (strict && [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([a, b]) => free(x + a, y + b)).length < 3) continue;
      if (strict && m.keep && m.keep[y * m.w + x] && m.occ[y * m.w + x] !== 1) continue;   // не на крыльце и не на узкой дорожке
      if (obstacle && m.occ && (m.occ[y * m.w + x] === 1 || (m.keep && m.keep[y * m.w + x]))) continue;   // предметы — не на дорогах и дорожках
      return [x, y];
    }
    return null;
  },

  // Анимированные объекты (водопад)
  drawAnim(ctx, o, time) {
    if (o.anim === 'waterfall') {
      const x = o.x, y = o.y, w = o.fw, h = o.fh;
      ctx.fillStyle = '#5aa0e0'; ctx.fillRect(x + 6, y, w - 12, h);
      ctx.fillStyle = '#9ad0f8';
      for (let i = 0; i < 8; i++) {
        const sx = x + 8 + ((i * 7) % (w - 16));
        const sy = (time * 60 + i * 13) % h;
        ctx.fillRect(sx, y + sy, 1, 6);
      }
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 6; i++) ctx.fillRect(x + 4 + ((i * 11 + Math.floor(time * 8)) % (w - 8)), y + h - 3 + (i % 2), 3, 2);
    }
  },
};

(() => {
  const H = 60;
  const basePopulate = G.world.populateKonoha.bind(G.world);
  G.world.populateKonoha = function (m) {
    basePopulate(m);
    const T = G.CONFIG.TILE;
    const at = (p) => ({ x: p[0] * T + 8, y: p[1] * T + 12 });
    const add = (tx, ty, def) => { const p = this.freeTile(m, tx, ty); if (p) m.npcs.push(this.makeNpc(Object.assign({}, def, at(p)))); };
    const day = () => G.state.vars.day;
    // одноклассники и знакомые
    add(46, 55, { id: 'choji', dir: 'down', talk: 'choji_talk', sched: [[14 * H, 20 * H, 'wd'], [11 * H, 20 * H, 'we']] });
