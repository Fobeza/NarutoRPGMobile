// ===== scenes/world.js =====
// Сцена мира: ходьба по Конохе и интерьерам, двери, разговоры, слои, камера.
// pos: { map, x, y, dir }
G.scenes.register('world', (pos) => {
  const T = G.CONFIG.TILE;
  const HUD_H = 28, STRIP_H = 22;
  const CANON = ['naruto', 'sakura', 'sasuke', 'hinata'];
  const FADE_BEHIND = { tree: 1, pine: 1, planter: 1, lamp: 1 };

  const S = {
    name: 'world',
    map: null,
    player: null,
    cam: { x: 0, y: 0 },
    time: 0,
    toast: null,
    banner: null,
    place: '',
    others: [],
    visCount: 0,

    enter() {
      this.player = G.actors.make('hero', 0, 0);
      this.setMap(pos || G.world.startPos());
      this.pendingTalk = pos && pos.intro;
      // старое сохранение: зачислен, но вступительный тест не пройден
      if (!this.pendingTalk && G.state.started && G.state.flags.enrolled && !G.hero.ready()) this.pendingTalk = 'iruka_retest';
      this.notes = [];
      this._onQuest = G.events.on('quest', (type, id, extra) => this.questNote(type, id, extra));
    },
    exit() { G.events.off('quest', this._onQuest); },

    // Уведомления о заданиях: «📜 Новое задание», «✔ Шаг выполнен», «★ Задание выполнено»
    questNote(type, id, extra) {
      const d = G.QUESTS[id], cat = G.QUEST_CATS[d.cat];
      const n = {
        new: { title: (d.cat === 'secret' ? '❓ Секрет найден' : cat.icon + ' Новое задание'), text: d.title, col: cat.color },
        step: { title: '✔ Шаг выполнен', text: extra, col: '#6ab04a' },
        done: { title: '★ Задание выполнено', text: d.title + (d.reward && d.reward.text ? ' · ' + d.reward.text : ''), col: G.PAL.yellow },
        fail: { title: 'x Задание провалено', text: d.title, col: '#c04a3a' },
      }[type];
      if (!n) return;
      n.t = 2.6;
      this.notes.push(n);
      while (this.notes.length > 2) this.notes.shift();
      this.goalFlash = 2.5;
      if (type === 'fail') G.audio.sfx.error(); else G.audio.sfx.confirm();
    },
    // Подсказка (онбординг): показывается один раз за игру
    tip(id, title, text) {
      if (G.state.flags['tip_' + id]) return;
      G.state.flags['tip_' + id] = 1;
      this.notes.push({ title, text, col: '#7ad0ff', t: 4.5, tip: true });
      while (this.notes.length > 2) this.notes.shift();
    },
    resume() { this.refreshNpcs(); },

    // NPC появляются по условиям и расписанию (G.life.visible)
    refreshNpcs() {
      const m = this.map;
      if (G.schedule) G.schedule.sync(this);
      this.npcs = m.npcs.filter((n) => G.life.visible(n));
      this.others = [this.player, ...this.npcs];
    },
    // Мягкое обновление по часам: те, кто сейчас на экране, не исчезают и не возникают из воздуха
    softRefresh() {
      if (G.schedule) G.schedule.sync(this);
      const m = this.map, cx = this.cam.x, cy = this.cam.y, W = G.screen.W / (this.z || 1), VH = this.viewH() / (this.z || 1);
      const onScreen = (n) => n.x > cx - 16 && n.x < cx + W + 16 && n.y > cy - 8 && n.y < cy + VH + 40;
      const cur = new Set(this.npcs);
      this.npcs = m.npcs.filter((n) => {
        const vis = G.life.visible(n);
        if (vis === cur.has(n)) return vis;
        return onScreen(n) ? cur.has(n) : vis;
      });
      this.others = [this.player, ...this.npcs];
    },

    // ---------- Смена карты ----------
    setMap(p) {
      let m = G.world.get(p.map);
      const pl = this.player;
      if (p.entry) { pl.x = m.spawn.x; pl.y = m.spawn.y; pl.dir = m.spawn.dir; }
      else { pl.x = p.x; pl.y = p.y; pl.dir = p.dir || 'down'; }
      if (m.id !== p.map && !p.entry) { // неизвестный id (старый сейв) → домой
        const sp = G.world.startPos(); m = G.world.get(sp.map); pl.x = sp.x; pl.y = sp.y;
      }
      pl.vx = pl.vy = 0; pl.moving = false;
      pl.jump = null; pl.roof = !!(p.roof && m.outdoor && G.roofs && G.roofs.at(m, pl.x, pl.y));
      this.map = m;
      this.refreshNpcs();
      this.lastDistrict = null;
      this.updatePlace(true);
      this.updateCamera();
      this.savePos();
      this.trail = null;
      G.quests.onEnterMap(m);
      if (m.outdoor) G.nav.reveal(pl.x, pl.y);
      if (G.state.started) G.storage.save(G.state); // автосейв при входе/выходе из зданий
    },

    goTo(p) {
      G.audio.sfx.confirm();
      G.scenes.fadeOut(() => this.setMap(p), 5);
    },

    enterBuilding(b) {
      if (!b.interior) { this.showToast('Заперто.'); G.audio.sfx.error(); return; }
      this.goTo({ map: b.interior.id, entry: true });
    },

    exitBuilding() {
      const b = this.map.building;
      if (!b) return;
      this.goTo(G.world.outsideOf(b));
    },

    savePos() {
      const p = this.player;
      G.state.pos = { map: this.map.id, x: Math.round(p.jump ? p.jump.x1 : p.x), y: Math.round(p.jump ? p.jump.y1 : p.y), dir: p.dir };
      if (p.roof || (p.jump && p.jump.toRoof)) G.state.pos.roof = 1;
    },

    updatePlace(force) {
      const m = this.map, p = this.player;
      let place = m.name;
      if (m.outdoor) {
        const d = m.districtAt(Math.floor(p.x / T), Math.floor(p.y / T));
        const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
        const r = m.roads && m.roads.find((r) => tx >= r.rect.x && ty >= r.rect.y && tx < r.rect.x + r.rect.w && ty < r.rect.y + r.rect.h);
        place = d ? d.label : r ? G.ROADS[r.type].name : 'Коноха';
      }
      if (place !== this.place || force) {
        this.place = place;
        this.banner = { text: place, t: 2.4 };
      }
    },

    // ---------- Обновление ----------
    update(dt) {
      this.time += dt;
      const I = G.input, p = this.player, m = this.map;
      if (this.pendingTalk && !G.scenes.busy) { const t = this.pendingTalk; this.pendingTalk = null; this.talk(t); return; }
      if (this.cine) { G.cine.update(this, dt); for (const n of this.npcs) if (!n._cine && n.moving) { n.moving = false; n.anim = 0; } this.updateCamera(); return; }
      if (G.game.pending && !G.scenes.busy) {
        const a = G.game.pending; G.game.pending = null;
        if (a === 'sleep') this.doSleep();
        else if (a === 'home') this.goHome();
        else if (typeof a === 'object' && G.flow[a.type]) G.flow[a.type](a, this);
        else if (a === 'charcreate') G.scenes.push(G.scenes.make('charcreate', () => this.talk('iruka_after_test')));
        return;
      }
      if (G.story && G.story.poll(this)) return;
      if (this.goalFlash) this.goalFlash = Math.max(0, this.goalFlash - dt);

      if (I.pressed('menu')) { G.audio.sfx.select(); G.scenes.push(G.scenes.make('menu')); return; }
      if (I.pressed('map')) { G.audio.sfx.select(); G.scenes.push(G.scenes.make('mapview', this)); return; }
      if (I.pressed('goal')) this.showTrail();
      if (this.trail) { this.trail.t += dt; if (this.trail.t > this.trail.dur) this.trail = null; }

      if (G.debug.on && I.tapNow && I.tapNow.y > HUD_H && I.tapNow.y < G.screen.H - STRIP_H) {
        const z = this.z || 1, tx = I.tapNow.x / z + this.cam.x, ty = (I.tapNow.y - HUD_H) / z + this.cam.y;
        if (!m.blockedRect(G.actors.feet(p, tx, ty))) { p.x = tx; p.y = ty; }
      }

      // движение игрока (во время прыжка по крышам — без управления)
      if (p.jump) G.roofs.updateJump(this, dt);
      const ax = p.jump ? { x: 0, y: 0 } : I.axis();
      const v = G.state.vars;
      const tired = v.energy < 10 || v.food <= 0;
      if (I.held('b') && tired && (ax.x || ax.y) && !G.state.daily.noRun) { G.state.daily.noRun = 1; this.showToast(v.food <= 0 ? 'Голодный — не до бега' : 'Нет сил бежать'); }
      const run = I.held('b') && !tired;
      const speed = (run ? G.CONFIG.RUN_SPEED * G.hero.runMul() : G.CONFIG.WALK_SPEED * G.hero.walkMul()) * dt;
      p.moving = !!(ax.x || ax.y);
      if (p.moving) {
        if (ax.x && ax.y) {
          const h = ax.x > 0 ? 'right' : 'left', v = ax.y > 0 ? 'down' : 'up';
          if (p.dir !== h && p.dir !== v) p.dir = Math.abs(ax.x) >= Math.abs(ax.y) ? h : v;
        } else p.dir = ax.x > 0 ? 'right' : ax.x < 0 ? 'left' : ax.y > 0 ? 'down' : 'up';
        if (!(G.roofs && G.roofs.move(this, p, ax, speed))) G.actors.move(m, p, ax.x * speed, ax.y * speed, this.others);
        p.anim += dt * (run ? 12 : 8);
        p.stepT -= dt;
        if (p.stepT <= 0) { G.audio.sfx.step(); p.stepT = run ? 0.18 : 0.28; }
      } else { p.anim = 0; p.vx = p.vy = 0; }

      // двери и выходы
      if (!G.scenes.busy && !p.roof && !p.jump) {
        const f = G.actors.feet(p);
        for (const w of m.warps) {
          if (!G.util.rectsOverlap(f, w.rect)) continue;
          const pushing = (w.dir === 'up' && ax.y < 0) || (w.dir === 'down' && ax.y > 0) || (I.pressed('a') && p.dir === w.dir);
          if (!pushing) continue;
          if (w.to.back) this.exitBuilding(); else this.enterBuilding(w.building);
          return;
        }
      }

      // NPC: обновляем только тех, кто рядом
      for (const n of this.npcs) {
        if (!m.outdoor || (Math.abs(n.x - p.x) < 260 && Math.abs(n.y - p.y) < 260)) this.updateNpc(n, dt);
      }

      if (I.pressed('a')) this.interact();

      // часы идут (этап 4): 1 игровая минута = 1 секунда
      if (G.state.started && !G.scenes.busy && G.scenes.top() === this) {
        const before = v.min;
        if (G.life.tick(dt, run && p.moving)) { this.onTime(before, v.min); if (G.scenes.top() !== this || G.scenes.busy) return; }
      }

      if (G.life2) G.life2.poll(this, dt);
      this.updateCamera();
      this.updatePlace(false);
      this.savePos();
      if (m.outdoor) G.nav.reveal(p.x, p.y);
      // своя метка достигнута
      const mk = G.state.marker;
      if (mk && m.outdoor && Math.hypot(mk.x * T + 8 - p.x, mk.y * T + 8 - p.y) < 24) {
        G.state.marker = null; this.showToast('Метка достигнута: ' + (mk.label || 'место')); G.audio.sfx.confirm();
      }
      if (this.toast) { this.toast.t -= dt; if (this.toast.t <= 0) this.toast = null; }
      if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    },


    // --- навигация NPC по клеткам: никаких шагов в стены ---
    npcWalk(tx, ty) {
      const T = G.CONFIG.TILE, m = this.map;
      const c = m._wk || (m._wk = new Map()), k = tx * 4096 + ty;
      let v = c.get(k);
      if (v === undefined) {
        v = tx >= 1 && ty >= 1 && tx < m.w - 1 && ty < m.h - 1 && !m.blockedRect({ x: tx * T + 2, y: ty * T + 7, w: 12, h: 7 });
        if (v && m.outdoor) { const id = m.get(tx, ty); v = id !== G.tiles.ID.WATER && id !== G.tiles.ID.DEEP; }
        c.set(k, v);
      }
      return v;
    },
    snapNpc(n) {
      const T = G.CONFIG.TILE, x0 = Math.floor(n.x / T), y0 = Math.floor(n.y / T);
      if (this.npcWalk(x0, y0)) return;
      for (let r = 1; r <= 4; r++) for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) {
        if (Math.max(Math.abs(a), Math.abs(b)) !== r) continue;
        if (this.npcWalk(x0 + a, y0 + b)) { n.x = (x0 + a) * T + 8; n.y = (y0 + b) * T + 12; n.home = { x: n.x, y: n.y }; return; }
      }
    },
    planPath(n) {
      const T = G.CONFIG.TILE, sx = Math.floor(n.x / T), sy = Math.floor(n.y / T);
      const R = Math.max(2, Math.min(12, Math.round(n.wanderR / T) + 1)), hx = n.home.x, hy = n.home.y;
      const prev = new Map([[sx * 4096 + sy, null]]), dist = new Map([[sx * 4096 + sy, 0]]), q = [[sx, sy]], cand = [];
      for (let i = 0; i < q.length; i++) {
        const [x, y] = q[i], d = dist.get(x * 4096 + y);
        if (d >= 2 && Math.hypot(x * T + 8 - hx, y * T + 12 - hy) <= n.wanderR + 4) cand.push([x, y]);
        if (d >= R) continue;
        for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + a, ny = y + b, k = nx * 4096 + ny;
          if (dist.has(k) || !this.npcWalk(nx, ny)) continue;
          dist.set(k, d + 1); prev.set(k, [x, y]); q.push([nx, ny]);
        }
      }
      if (!cand.length) return null;
      let t = cand[Math.floor(Math.random() * cand.length)];
      const path = [];
      while (t && !(t[0] === sx && t[1] === sy)) { path.unshift(t); t = prev.get(t[0] * 4096 + t[1]); }
      return path;
    },

    updateNpc(n, dt) {
      n.aiT -= dt;
      if (G.life2) G.life2.npcTick(this, n, dt);
      if (n.ai === 'wander') {
        if (!n._snap) { n._snap = 1; this.snapNpc(n); }
        if (!n.path || !n.path.length) {
          n.moving = false; n.anim = 0;
          if (n.aiT <= 0) {
            n.path = this.planPath(n);
            n.aiT = n.path && n.path.length ? 0 : 1 + Math.random() * 2.5;
            if (!n.path || !n.path.length) { n.path = null; if (Math.random() < 0.5) n.dir = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)]; }
            n.stuck = 0;
          }
        } else {
          const T = G.CONFIG.TILE, [tx, ty] = n.path[0];
          const px = tx * T + 8, py = ty * T + 12, dx = px - n.x, dy = py - n.y;
          if (Math.abs(dx) < 1.2 && Math.abs(dy) < 1.2) { n.path.shift(); if (!n.path.length) { n.aiT = 1 + Math.random() * 3; n.moving = false; } }
          else {
            const sp = (n.speed || 30) * dt, ax = Math.abs(dx) > 1.2;
            n.dir = ax ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
            const step = Math.min(sp, ax ? Math.abs(dx) : Math.abs(dy));
            const b = n.x + n.y * 10000;
            const v = G.actors.DIRV[n.dir];
            G.actors.move(this.map, n, v[0] * step, v[1] * step, this.others);
            n.moving = true; n.anim += dt * 6;
            if (n.x + n.y * 10000 === b) { n.stuck = (n.stuck || 0) + dt; if (n.stuck > 0.8) { n.path = null; n.moving = false; n.aiT = 0.5 + Math.random(); } } else n.stuck = 0;
          }
        }
      } else if (n.ai === 'idle' && n.aiT <= 0) {
        n.aiT = 2 + Math.random() * 4;
        if (Math.random() < 0.35) n.dir = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)];
      }
    },

    // ---------- Взаимодействие (A) ----------
    // probeAction() ничего не делает, а только ищет, что случится по A: { run, label, show } или null.
    // show — «заметное» действие (разговор, дверь, рыбалка…): для него на сенсорном экране всплывает кнопка.
    // Табличка с названием здания тоже действие, но кнопку ради неё не показываем.
    probeAction() {
      const p = this.player, m = this.map;
      if (p.jump) return null;
      if (G.roofs && p.roof) return { show: true, label: 'Спрыгнуть', run: () => G.roofs.interact(this) };
      const v = G.actors.DIRV[p.dir];
      const fx = p.x + v[0] * 12, fy = p.y - 3 + v[1] * 12;

      // NPC
      let best = null, bd = 99;
      for (const n of this.npcs) {
        const d = Math.hypot(n.x - fx, n.y - 3 - fy);
        const reach = n.reach || 15;
        if (d < reach && d < bd) { bd = d; best = n; }
      }
      if (best) {
        const shop = !G.quests.scriptFor(best.id) && best.shop;
        return { show: true, label: shop ? 'Лавка' : 'Говорить', run: () => {
          if (!best.reach) best.dir = G.actors.OPP[p.dir];
          best.moving = false; best.anim = 0;
          G.audio.sfx.select();
          const qs = G.quests.scriptFor(best.id);
          if (qs) this.talk(qs);
          else if (best.shop) this.openShop(best);
          else if (G.FRIENDS[best.id] && G.state.flags.day2_intro && !best.name) G.friends.menu(best, this);
          else this.talk(best.talk);
        } };
      }
      // объекты с описанием
      const near = m.query({ x: fx - 10, y: fy - 10, w: 20, h: 20 });
      let bo = null, bdist = 99;
      for (const o of near) {
        if (!o.talk || o.isBuilding) continue;
        const r = o.box || { x: o.x - 8, y: o.y - 14, w: 16, h: 14 };
        const ex = { x: r.x - 6, y: r.y - 10, w: r.w + 12, h: r.h + 16 };
        if (fx >= ex.x && fx <= ex.x + ex.w && fy >= ex.y && fy <= ex.y + ex.h) {
          const d = Math.hypot(o.x - fx, o.y - 6 - fy);
          if (d < bdist) { bdist = d; bo = o; }
        }
      }
      if (bo) return { show: true, label: 'Осмотреть', run: () => { G.audio.sfx.select(); this.talk(bo.talk); } };
      // здания
      for (const o of near) {
        if (!o.isBuilding) continue;
        const r = { x: o.tx * T, y: o.ty * T, w: o.tw * T, h: o.th * T };
        if (fx < r.x || fx > r.x + r.w || fy < r.y || fy > r.y + r.h + 2) continue;
        if (o.talk) return { show: true, label: 'Осмотреть', run: () => this.talk(o.talk) };
        if (o.door && o.door.tx === Math.floor(fx / T) && p.dir === 'up') return { show: true, label: 'Войти', run: () => this.enterBuilding(o) };
        if (G.roofs && G.roofs.canClimb(this, o)) return { show: true, label: 'Залезть', run: () => G.roofs.climb(this, o) };
        return { show: false, run: () => { this.showToast(o.locked ? o.name + ' — заперто' : o.name); G.audio.sfx.blip(); } };
      }
      // вода: рыбалка
      for (const k of [1, 1.8]) {
        const wx = p.x + v[0] * 12 * k, wy = p.y - 3 + v[1] * 12 * k;
        if (G.outdoor && G.outdoor.isWater(m, wx, wy)) return { show: true, label: 'Рыбалка', run: () => { G.audio.sfx.select(); G.outdoor.fish(this, G.outdoor.spotKind(m, wx, wy)); } };
      }
      return null;
    },
    interact() {
      const act = this.probeAction();
      if (act) act.run();
    },

    // что показывать на сенсорном экране (engine/touch.js)
    touch() {
      if (this.cine || this.player.jump) return { sys: true };
      const act = this.probeAction();
      return { joy: true, sys: true, action: act && act.show ? { label: act.label } : null };
    },

    talk(t) {
      if (!t) return;
      const onEnd = () => this.refreshNpcs();
      if (typeof t === 'string') G.dialog.start(t, { bottom: STRIP_H + 2, onEnd });
      else G.dialog.say(t, { bottom: STRIP_H + 2, onEnd });
    },

    // ---------- Лавки ----------
    openShop(n) {
      const shop = G.SHOPS[n.shop];
      const g = G.game, min = g.v.min;
      const keeper = { who: n.id, name: n.name || G.chars.nameOf(n.id) };
      if (min < shop.hours[0] || min >= shop.hours[1]) {
        const txt = min >= shop.hours[1] ? `Закрыто! Приходи завтра к ${g.clock(shop.hours[0])}.` : `Ещё закрыто. Открываемся в ${g.clock(shop.hours[0])}.`;
        this.talk([Object.assign({ text: txt }, keeper)]);
        return;
      }
      const buy = () => G.scenes.push(G.scenes.make('shop', n.shop, {
        title: n.shopTitle || keeper.name,
        onClose: (bought) => this.afterShop(n.shop, bought),
      }));
      if (shop.buys && shop.buys.some((id) => G.game.count(id) > 0)) {
        G.scenes.push(G.scenes.make('pick', { title: keeper.name, text: shop.greet, options: [{ label: 'Купить' }, { label: 'Продать', desc: 'Улов и травы — за половину цены.' }, { label: 'Уйти' }] }, (i) => {
          if (i === 0) buy(); else if (i === 1) G.outdoor.sellMenu(n, this);
        }));
      } else buy();
    },
    afterShop(shopId, bought) {
      const f = G.state.flags;
      if (shopId === 'ichiraku' && G.quests.active('day1') && f.naruto_invited && !f.ramen_done) {
        const ate = bought.some((b) => G.ITEMS[b.id].ramen);
        this.talk(ate ? 'ramen_day1' : 'naruto_noramen');
      }
    },

    // ---------- Время: события по часам ----------
    onTime(prev, now) {
      const v = G.state.vars, m = this.map, d = G.state.daily;
      const crossed = (t) => prev < t && now >= t;
      const every = (k) => Math.floor(prev / k) !== Math.floor(now / k);
      if (every(10)) this.softRefresh();
      if (every(120) && G.state.started) G.storage.save(G.state);          // автосейв раз в 2 часа
      // подсказки онбординга
      if (m.outdoor) this.tip('clock', '⏰ Время идёт', 'Минута в игре — секунда. В меню и диалогах часы стоят');
      if (m.outdoor && G.life.raining()) this.tip('rain', '☂ Дождь', 'Многие сидят по домам, настроение чуть падает');
      if (crossed(19 * 60)) this.tip('evening', '🌙 Вечер', 'Лавки закрываются в 19–23 часа. Смотри часы на карте');
      // лавка закрывается
      const shop = m.building && G.SHOPS[m.building.tplId];
      if (shop && crossed(shop.hours[1] - 15)) this.showToast('Лавка закроется через 15 минут');
      if (shop && crossed(shop.hours[1])) this.showToast('Лавка закрылась');
      // нужды
      if (v.food < 25 && !d.hungry) { d.hungry = 1; this.showToast('Живот урчит... Пора поесть'); this.tip('food', '🍜 Сытость', 'Еда — в Ичираку, данго-лавке или дома (рис бесплатно)'); }
      if (v.food <= 0 && !d.starving) { d.starving = 1; this.notes.push({ title: 'x Голод!', text: 'Энергия тает вдвое быстрее', col: '#c04a3a', t: 3 }); }
      if (v.energy < 20 && !d.tired) { d.tired = 1; this.showToast('Ты устал... Пора отдохнуть'); }
      if (v.energy <= 0) return this.faint('tired');
      // ночь
      if (crossed(22 * 60)) this.tip('night', '🌙 Поздно', 'С 23:00 ученикам нельзя на улицу — патруль отправит домой');
      if (crossed(23 * 60) && m.outdoor) { this.notes.push({ title: '🌙 Комендантский час', text: 'Ученикам пора по домам!', col: '#9ab0ff', t: 3 }); G.audio.sfx.error(); }
      if (now >= 26 * 60) return this.faint('late');
      if (m.outdoor && now >= 23 * 60 + 30 && every(10) && Math.random() < 0.3) this.talk('patrol_curfew');
    },

    // Обморок: от усталости днём — больница, поздно ночью — сон где стоишь
    faint(kind) {
      const v = G.state.vars;
      if ((kind === 'tired' || kind === 'beaten') && v.min < 21 * 60) {
        G.scenes.fadeOut(() => {
          const hb = G.world.konoha().buildings.find((b) => b.tplId === 'hospital');
          if (hb && hb.interior) this.setMap({ map: hb.interior.id, entry: true });
          G.game.advance(180);
          v.energy = 35; G.game.mood(-10);
          G.game.note('Обморок от усталости — очнулся в больнице');
          this.pendingTalk = 'faint_hospital';
        }, 1.2);
      } else {
        G.game.note(kind === 'late' ? 'Уснул, не дойдя до кровати' : 'Свалился без сил');
        this.doSleep({ faint: true });
      }
    },
    // Патруль/сценарий отправляет домой
    goHome() {
      G.scenes.fadeOut(() => {
        const hm = G.world.get(G.world.heroHome().interior.id);
        this.setMap({ map: hm.id, x: 3 * 16 + 8, y: 5 * 16 + 4, dir: 'up' });
        G.game.advance(20);
      }, 2);
    },

    // ---------- Сон и новый день ----------
    doSleep(opts = {}) {
      G.scenes.fadeOut(() => {
        G.quests.onSleep(G.state.vars.day + 1);
        const sum = G.game.sleep(opts);
        const home = G.world.heroHome();
        const hm = G.world.get(home.interior.id);
        this.setMap({ map: hm.id, x: 3 * 16 + 8, y: 4 * 16 + 4, dir: 'down' });
        G.storage.save(G.state, { backup: true });   // утренняя резервная копия
        G.scenes.push(G.scenes.make('daysum', sum, () => {
          G.scenes.fadeOut(() => {
            G.scenes.pop();
            if (G.quests.done('day1') && !G.state.flags.day2_intro) { G.state.flags.day2_intro = 1; this.pendingTalk = 'day2_morning'; }
          }, 3);
        }));
      }, 2);
    },

    showToast(text) { this.toast = { text, t: 2.2 }; },
    viewH() { return G.screen.H - HUD_H - STRIP_H; },
    // Масштаб: в помещениях комната крупнее (вписывается в экран), на улице — 1
    zoom() {
      const m = this.map;
      if (!m || m.outdoor !== false) return 1;
      const W = G.screen.W, VH = this.viewH();
      const z = Math.min(W / (m.w * T + 8), VH / (m.h * T + 40));
      return Math.max(1, Math.min(3, Math.floor(z * 4) / 4));
    },

    updateCamera() {
      const z = this.z = this.zoom();
      const W = G.screen.W / z, VH = this.viewH() / z, m = this.map, p = this.player;
      const mw = m.w * T, mh = m.h * T;
      let fx = p.x, fy = p.y;
      const ct = G.cine && G.cine.camTarget();
      if (ct) {
        const k = this.camPos ? 0.12 : 1; this.camPos = this.camPos || { x: p.x, y: p.y };
        this.camPos.x += (ct.x - this.camPos.x) * k; this.camPos.y += (ct.y - this.camPos.y) * k; fx = this.camPos.x; fy = this.camPos.y;
      } else if (this.camPos && G.cine && G.cine.active) {
        this.camPos.x += (p.x - this.camPos.x) * 0.12; this.camPos.y += (p.y - this.camPos.y) * 0.12; fx = this.camPos.x; fy = this.camPos.y;
      } else this.camPos = null;
      this.cam.x = mw <= W ? Math.round((mw - W) / 2) : G.util.clamp(Math.round(fx - W / 2), 0, mw - W);
      this.cam.y = mh <= VH ? Math.round((mh - VH) / 2) : G.util.clamp(Math.round(fy - 10 - VH / 2), 0, mh - VH);
    },

    // ---------- Отрисовка ----------
    draw(ctx) {
      const z = this.z || 1, SW = G.screen.W, SVH = this.viewH();
      const W = SW / z, VH = SVH / z, m = this.map, p = this.player;
      const cx = this.cam.x, cy = this.cam.y;

      ctx.fillStyle = m.bg; ctx.fillRect(0, HUD_H, SW, SVH);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, HUD_H, SW, SVH); ctx.clip();
      if (z !== 1) { ctx.translate(0, HUD_H); ctx.scale(z, z); ctx.translate(-cx, -cy); }
      else ctx.translate(-cx, HUD_H - cy);

      m.drawGround(ctx, cx, cy, W, VH, this.time);

      const vis = m.query({ x: cx, y: cy, w: W, h: VH });
      this.visCount = vis.length;
      G.fx.shadows(ctx, vis, m, G.state.vars.min);
      const list = [];
      for (const o of vis) {
        if (o.layer === 'floor') { ctx.drawImage(o.img, o.x + o.ox, o.y + o.oy); continue; }
        list.push(o);
      }
      for (const a of this.others) {
        if (a.x < cx - 16 || a.x > cx + W + 16 || a.y < cy - 4 || a.y > cy + VH + 24) continue;
        list.push(a);
      }
      list.sort((a, b) => (a.sortY != null ? a.sortY : a.y) - (b.sortY != null ? b.sortY : b.y));

      const pr = { x: p.x - 7, y: p.y - 19, w: 14, h: 19 };
      for (const it of list) {
        if (it === p && (p.roof || p.jump)) continue;   // на крыше героя рисуем поверх всего
        if (it.id && it.dir) { this.drawActor(ctx, it); continue; }
        if (it.anim) { G.world.drawAnim(ctx, it, this.time); continue; }
        let alpha = 1;
        if ((it.isBuilding || FADE_BEHIND[it.kind]) && it.sortY > p.y && it.sortY >= 0 && !p.roof && !p.jump) {
          const pad = it.isBuilding ? 10 : 2; // у зданий сверху прозрачный запас под трубы/эмблемы
          if (G.util.rectsOverlap(pr, { x: it.x + it.ox + 2, y: it.y + it.oy + pad, w: it.w - 4, h: it.h - pad })) alpha = 0.45;
        }
        if (alpha < 1) ctx.globalAlpha = alpha;
        ctx.drawImage(it.img, it.x + it.ox, it.y + it.oy);
        if (alpha < 1) ctx.globalAlpha = 1;
      }

      if (p.roof || p.jump) G.roofs.drawPlayer(ctx, this);

      // значки над NPC: ! — новое задание, ? — можно сдать, 💬 — новое знакомство
      const bob = Math.round(Math.sin(this.time * 5) * 1.5);
      for (const n of this.npcs) {
        if (n.x < cx - 8 || n.x > cx + W + 8 || n.y < cy || n.y > cy + VH + 30) continue;
        let ic = G.quests.iconFor(n.id);
        if (!ic && n.mark && !G.state.flags['met_' + n.mark]) ic = '💬';
        if (!ic) continue;
        const col = ic === '!' ? G.PAL.yellow : ic === '?' ? '#7ad0ff' : '#ffffff';
        G.font.draw(ctx, ic, n.x, n.y - 30 + bob, { color: col, outline: G.PAL.ink, align: 'center' });
      }
      if (G.life2) G.life2.drawEmotes(ctx, this, cx, cy, W, VH);
      this.drawTargetMark(ctx, cx, cy, W, VH, bob);
      this.drawTrail(ctx);

      this.drawLight(ctx, vis, cx, cy, W, VH);
      G.fx.particles(ctx, cx, cy, W, VH, m, G.state.vars.min, this.time);
      if (this.map.outdoor && G.life.raining()) this.drawRain(ctx, cx, cy, W, VH);

      if (G.debug.on) {
        ctx.strokeStyle = 'rgba(255,0,0,.7)'; ctx.lineWidth = 1;
        for (const o of vis) if (o.box) ctx.strokeRect(o.box.x + 0.5, o.box.y + 0.5, o.box.w - 1, o.box.h - 1);
        ctx.strokeStyle = 'rgba(0,255,255,.8)';
        for (const w of m.warps) ctx.strokeRect(w.rect.x + 0.5, w.rect.y + 0.5, w.rect.w - 1, w.rect.h - 1);
        for (const a of this.others) { const b = G.actors.feet(a); ctx.strokeStyle = 'rgba(255,255,0,.8)'; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1); }
      }
      ctx.restore();
      {
      const W = SW, VH = SVH;
      G.fx.vignette(ctx, W, VH, HUD_H);

      this.drawMinimap(ctx, W);
      this.drawHud(ctx);
      this.drawStrip(ctx);
      this.drawNotes(ctx, W);

      if (this.banner) {
        const a = Math.min(1, this.banner.t * 2, (2.4 - this.banner.t) * 4);
        ctx.globalAlpha = Math.max(0, a);
        G.ui.title(ctx, this.banner.text, W / 2, HUD_H + 6, 0);   // красная лента с названием места
        ctx.globalAlpha = 1;
      }
      if (this.toast) {
        const w = Math.min(W - 8, G.font.measure(this.toast.text) + 18), h = 19;
        const x = Math.round((W - w) / 2), y = G.screen.H - STRIP_H - h - 6;
        G.ui.panel(ctx, x, y, w, h, 'night');
        G.font.draw(ctx, this.toast.text, W / 2, y + 5, { align: 'center', color: '#f4d46a', maxW: w - 12 });
      }
      if (G.cine) G.cine.drawBars(ctx, HUD_H, VH, W);
      this.drawArrow(ctx, W, VH);   // стрелка цели — поверх табличек и уведомлений
      }
    },

    hintsOn() { return G.storage.settings.hints !== false; },

    // ---------- Направление к цели ----------
    navHop() {
      const tgt = G.nav.current();
      if (!tgt) return null;
      const h = G.nav.hop(this.map, tgt);
      return h ? { tgt, h } : null;
    },

    // ▼ над целью (или над дверью/выходом), если она на экране
    drawTargetMark(ctx, cx, cy, W, VH, bob) {
      if (!this.hintsOn()) return;
      const r = this.navHop();
      if (!r) return;
      const { tgt, h } = r;
      let x = h.x, y = h.y;
      if (h.final && tgt.npc) y = tgt.npc.y - 38;
      else if (h.exit) y -= 14;
      else y -= 26;
      if (x < cx || x > cx + W || y < cy - 6 || y > cy + VH) return;
      G.font.draw(ctx, '▼', x, y + bob * 2, { color: tgt.ok ? '#ff5a3a' : '#9a9aa8', outline: G.PAL.ink, align: 'center' });
    },

    // Стрелка у края экрана с расстоянием
    drawArrow(ctx, W, VH) {
      if (!this.hintsOn()) return;
      const r = this.navHop();
      if (!r) return;
      const { tgt, h } = r;
      const z = this.z || 1, sx = (h.x - this.cam.x) * z, sy = (h.y - this.cam.y) * z + HUD_H - 10;
      if (sx > 6 && sx < W - 6 && sy > HUD_H + 6 && sy < HUD_H + VH - 6) return;
      const ccx = W / 2, ccy = HUD_H + VH / 2;
      const dx = sx - ccx, dy = sy - ccy;
      const k = Math.min((W / 2 - 12) / Math.abs(dx || 1e-6), (VH / 2 - 12) / Math.abs(dy || 1e-6));
      const ax = ccx + dx * k, ay = ccy + dy * k, ang = Math.atan2(dy, dx);
      const pulse = 1 + Math.sin(this.time * 6) * 0.12;
      ctx.save();
      ctx.translate(Math.round(ax), Math.round(ay)); ctx.rotate(ang); ctx.scale(pulse, pulse);
      ctx.fillStyle = G.PAL.ink;
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -7); ctx.lineTo(-3, 0); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = tgt.ok ? '#ff6a3a' : '#9a9aa8';
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -5); ctx.lineTo(-2, 0); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill();
      ctx.restore();
      // значок и расстояние — ближе к центру
      const m = G.nav.meters(this.map, this.player.x, this.player.y, tgt);
      const label = (h.exit ? 'выход' : h.door ? '' : '') + '≈' + m + ' м';
      const lx = ax - Math.cos(ang) * 22, ly = ay - Math.sin(ang) * 16;
      const icon = h.exit ? '' : tgt.icon + ' ';
      const txt = icon + label, tw = G.font.small.measure(txt) + 10;
      const bx = G.util.clamp(Math.round(lx - tw / 2), 2, W - tw - 2), by = G.util.clamp(Math.round(ly - 5), HUD_H + 2, HUD_H + VH - 17);
      G.ui.panel(ctx, bx, by, tw, 15, 'night');
      G.font.small.draw(ctx, txt, bx + 5, by + 4, { color: '#f4d46a' });
    },

    // Кнопка ЦЕЛЬ: светящийся след (A*) до цели на этой карте
    showTrail() {
      const r = this.navHop();
      if (!r) { this.showToast('Нет цели: выбери задание или метку'); G.audio.sfx.error(); return; }
      const p = this.player;
      const t0 = performance.now();
      const path = G.nav.path(this.map, p.x, p.y, r.h.x, r.h.y);
      this.trailMs = Math.round(performance.now() - t0);
      if (!path || path.length < 2) { this.showToast(path ? 'Цель рядом!' : 'Чутьё молчит: пути не видно'); G.audio.sfx.blip(); return; }
      this.trail = { pts: path, t: 0, dur: 4 + path.length * 0.03 };
      G.audio.sfx.puff();
      if (!G.state.flags.trail_hint) { G.state.flags.trail_hint = 1; this.showToast('Чутьё ниндзя: след ведёт к цели'); }
    },
    drawTrail(ctx) {
      const tr = this.trail;
      if (!tr) return;
      const fade = Math.min(1, (tr.dur - tr.t) / 0.8);
      const head = tr.t * 22;
      ctx.globalCompositeOperation = 'lighter';
      tr.pts.forEach(([tx, ty], i) => {
        if (i === 0) return;
        const ph = head - i;
        if (ph < 0) return;
        const glow = ph < 6 ? 1 - ph / 6 : 0;
        const a = (0.35 + glow * 0.65) * fade;
        const x = tx * T + 8, y = ty * T + 10;
        ctx.fillStyle = `rgba(120,220,255,${(a * 0.35).toFixed(3)})`; ctx.fillRect(x - 3, y - 3, 6, 6);
        ctx.fillStyle = `rgba(200,250,255,${a.toFixed(3)})`; ctx.fillRect(x - 1, y - 1, 2, 2);
      });
      ctx.globalCompositeOperation = 'source-over';
    },

    // ---------- Мини-карта ----------
    drawMinimap(ctx, W) {
      if (G.storage.settings.minimap === false) return;
      const S = 48, x0 = W - S - 3, y0 = HUD_H + 3;
      const m = this.map, p = this.player;
      G.ui.panel(ctx, x0 - 3, y0 - 3, S + 6, S + 6, 'plank');
      ctx.fillStyle = '#14121c'; ctx.fillRect(x0, y0, S, S);
      ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, S, S); ctx.clip();
      let sc, ox, oy;
      if (m.outdoor) {
        sc = 1;
        const ptx = p.x / T, pty = p.y / T;
        ox = x0 + S / 2 - ptx; oy = y0 + S / 2 - pty;
        ctx.drawImage(m.overview(), Math.round(ox), Math.round(oy));
        // двери лавок
        ctx.fillStyle = '#ffd84a';
        for (const b of m.buildings) if (b.door && G.SHOPS[b.tplId]) ctx.fillRect(Math.round(ox + b.door.tx), Math.round(oy + b.door.ty), 1, 1);
      } else {
        sc = Math.max(2, Math.floor(Math.min((S - 4) / m.w, (S - 4) / m.h)));
        ox = x0 + Math.floor((S - m.w * sc) / 2); oy = y0 + Math.floor((S - m.h * sc) / 2);
        const ID = G.tiles.ID;
        for (let ty = 0; ty < m.h; ty++) for (let tx = 0; tx < m.w; tx++) {
          const t = m.get(tx, ty);
          ctx.fillStyle = t === ID.VOID ? '#14121c' : t === ID.IWALL ? '#5a4a3a' : t === ID.MAT ? '#6ab04a' : '#c8a878';
          ctx.fillRect(ox + tx * sc, oy + ty * sc, sc, sc);
        }
        ctx.fillStyle = '#7a5a3a';
        for (const o of m.objects) if (o.box) ctx.fillRect(Math.round(ox + o.box.x / T * sc), Math.round(oy + o.box.y / T * sc), Math.max(1, Math.round(o.box.w / T * sc)), Math.max(1, Math.round(o.box.h / T * sc)));
      }
      const P2 = (wx, wy) => [Math.round(ox + wx / T * sc), Math.round(oy + wy / T * sc)];
      // NPC со значками
      for (const n of this.npcs) {
        const ic = G.quests.iconFor(n.id);
        if (!ic) continue;
        const [nx, ny] = P2(n.x, n.y);
        ctx.fillStyle = ic === '!' ? '#ffd84a' : '#7ad0ff'; ctx.fillRect(nx - 1, ny - 1, 3, 3);
      }
      // цель
      const r = this.navHop();
      if (r && Math.floor(this.time * 3) % 2 === 0) {
        const [hx, hy] = P2(r.h.x, r.h.y);
        const cxp = G.util.clamp(hx, x0 + 1, x0 + S - 2), cyp = G.util.clamp(hy, y0 + 1, y0 + S - 2);
        ctx.fillStyle = '#ff3a2a'; ctx.fillRect(cxp - 1, cyp - 1, 3, 3);
      }
      // игрок — стрелка по направлению взгляда
      const [px, py] = P2(p.x, p.y);
      const v = G.actors.DIRV[p.dir];
      ctx.fillStyle = '#ffffff'; ctx.fillRect(px - 1, py - 1, 3, 3);
      ctx.fillStyle = '#e8621a'; ctx.fillRect(px + v[0] * 2, py + v[1] * 2, 1, 1); ctx.fillRect(px, py, 1, 1);
      ctx.restore();
    },

    // Уведомления о заданиях
    drawNotes(ctx, W) {
      // таймер идёт по реальному времени, даже когда сверху диалог или лавка
      const now = performance.now(), dt = Math.min(0.1, (now - (this._noteT || now)) / 1000);
      this._noteT = now;
      if (this.notes.length) { this.notes[0].t -= dt; if (this.notes[0].t <= 0) this.notes.shift(); }
      const n = this.notes[0];
      if (!n) return;
      const a = Math.min(1, n.t * 3, (2.6 - n.t) * 5);
      ctx.globalAlpha = Math.max(0, a);
      const F = G.font.small, tw = Math.min(W - 8, Math.max(G.font.measure(n.title), F.measure(n.text)) + 26);
      const x = Math.round((W - tw) / 2), y = HUD_H + 28;
      G.ui.panel(ctx, x, y, tw, 36, 'frame');
      G.font.draw(ctx, n.title, W / 2, y + 8, { align: 'center', color: G.ui.C.redDark });
      let txt = n.text;
      while (F.measure(txt) > tw - 20 && txt.length > 4) txt = txt.slice(0, -2) + '…';
      F.draw(ctx, txt, W / 2, y + 22, { align: 'center', color: G.ui.C.ink });
      ctx.globalAlpha = 1;
    },

    // Освещение по времени суток + свет фонарей ночью
    // Дождь: серый тон и косые струи (в координатах экрана)
    drawRain(ctx, cx, cy, W, VH) {
      ctx.fillStyle = 'rgba(40,50,80,0.16)'; ctx.fillRect(cx, cy, W, VH);
      ctx.fillStyle = 'rgba(190,210,255,0.55)';
      const t = this.time;
      for (let i = 0; i < 70; i++) {
        const sp = 160 + (i % 5) * 25;
        const x = cx + ((i * 53 + t * sp * 0.35) % (W + 20)) - 10;
        const y = cy + ((i * 97 + t * sp) % (VH + 20)) - 10;
        ctx.fillRect(Math.round(x), Math.round(y), 1, 4);
        ctx.fillRect(Math.round(x) - 1, Math.round(y) + 4, 1, 2);
      }
      // брызги
      ctx.fillStyle = 'rgba(200,220,255,0.35)';
      for (let i = 0; i < 14; i++) {
        const ph = (t * 3 + i * 0.37) % 1;
        if (ph > 0.3) continue;
        const x = cx + (i * 71 + Math.floor(t * 3 + i * 0.37) * 29) % W, y = cy + (i * 43 + Math.floor(t * 3 + i * 0.37) * 61) % VH;
        ctx.fillRect(Math.round(x) - 1, Math.round(y), 3, 1);
      }
    },

    drawLight(ctx, vis, cx, cy, W, VH) {
      const L = G.game.light();
      if (!L) return;
      const m = this.map;
      const a = m.outdoor ? L[3] : L[3] * 0.35;
      ctx.fillStyle = `rgba(${L[0] | 0},${L[1] | 0},${L[2] | 0},${a.toFixed(3)})`;
      ctx.fillRect(cx, cy, W, VH);
      G.fx.windows(ctx, vis, m, (a - 0.12) / 0.3, this.time);
      if (!m.outdoor || a < 0.2) return;
      ctx.globalCompositeOperation = 'lighter';
      const k = Math.min(1, (a - 0.2) / 0.25);
      for (const o of vis) {
        const ly = o.kind === 'lamp' ? o.y - 24 : o.kind === 'stonelamp' ? o.y - 13 : null;
        if (ly == null) continue;
        const gr = ctx.createRadialGradient(o.x, ly, 1, o.x, ly, 26);
        gr.addColorStop(0, `rgba(255,190,90,${0.5 * k})`);
        gr.addColorStop(1, 'rgba(255,150,60,0)');
        ctx.fillStyle = gr;
        ctx.fillRect(o.x - 26, ly - 26, 52, 52);
      }
      ctx.globalCompositeOperation = 'source-over';
    },

    drawActor(ctx, a) {
      G.shade.shadow(ctx, a.x + 1, a.y - 1, 6, 2, 0.34);   // V9: мягкая тень под ногами
      const frame = a.moving ? G.chars.WALK[Math.floor(a.anim) % 4] : 0;
      G.chars.draw(ctx, a.id, a.dir, frame, a.x, a.y);
    },

    drawHud(ctx) {
      const W = G.screen.W, U = G.ui, F = G.font.small, C = U.C;
      U.panel(ctx, 0, 0, W, HUD_H, 'night');
      const g = G.game, v = g.v;
      F.draw(ctx, `${g.dayName()}, день ${v.day}`, 6, 5, { color: '#d8c8a0' });
      // часы: мигающее двоеточие, пока время идёт; значок погоды (ночью — луна)
      const wt = G.life.WEATHER[G.life.weather()];
      const night = g.isNight();
      const running = G.scenes.top() === this && !G.scenes.busy;
      let clk = g.clock();
      if (running && Math.floor(G.life.acc * 2) % 2 === 1) clk = clk.replace(':', ' ');
      const cw = F.measure('00:00'), cx = Math.round(W / 2 - cw / 2) + 5;
      if (night && wt.icon === '☀') U.icon(ctx, 'moon', cx - 14, 4, '#c8d0ff');
      else F.draw(ctx, wt.icon, cx - 12, 5, { color: wt.col });
      F.draw(ctx, clk, cx, 5, { color: v.min >= 23 * 60 ? '#ff8a6a' : night ? '#9ab0ff' : '#f8eed0' });
      const mt = v.money + ' рё';
      F.draw(ctx, mt, W - 6, 5, { align: 'right', color: '#f4d46a' });
      // здоровье, чакра, сытость, энергия: значок + бамбуковая шкала
      const bars = [['heart', C.hp, v.hp / 100], ['drop', C.chakra, v.chakra / 100], ['bowl', C.food, v.food / 100], ['bolt', C.energy, v.energy / 100]];
      const cell = (W - 8) / 4;
      bars.forEach(([ic, col, val], i) => {
        const x = Math.round(4 + i * cell), low = i >= 2 && val < 0.2 && Math.floor(this.time * 3) % 2 === 0;
        U.icon(ctx, ic, x, 15, low ? '#ff6a4a' : col);
        U.gauge(ctx, x + 13, 18, Math.round(cell) - 17, 6, val, low ? '#e04a4a' : col);
      });
    },

    drawStrip(ctx) {
      const W = G.screen.W, U = G.ui, F = G.font.small, C = U.C;
      const y = G.screen.H - STRIP_H;
      U.panel(ctx, 0, y, W, STRIP_H, 'plank');
      const mk = G.state.marker;
      const qid = !mk && G.quests.tracked(), st = qid && G.quests.curStep(qid);
      const maxW = W - 72;
      if (st || mk) {
        const flash = this.goalFlash && Math.floor(this.goalFlash * 6) % 2 === 0;
        const ok = !st || G.quests.timeOk(st);
        const icon = st ? G.QUEST_CATS[G.QUESTS[qid].cat].icon : '📍';
        F.draw(ctx, icon, 6, y + 7, { color: st ? G.QUEST_CATS[G.QUESTS[qid].cat].color : '#ff9a4a' });
        let txt = st ? st.text : 'Метка: ' + (mk.label || 'место');
        const suffix = ok ? '' : ' ⏰ с ' + G.game.clock(st.time[0]);
        while (F.measure(txt + suffix) > maxW - 14 && txt.length > 4) txt = txt.slice(0, -2) + '…';
        F.draw(ctx, txt + suffix, 18, y + 7, { color: !ok ? '#9a8a76' : flash ? '#ffd23a' : '#f8eed0', shadow: '#160c06' });
      } else {
        U.icon(ctx, 'leaf', 5, y + 6, '#ff9a4a');
        F.draw(ctx, this.place, 18, y + 7, { color: '#f8eed0', shadow: '#160c06', maxW });
      }
    },

    debugInfo() {
      const p = this.player, m = this.map;
      return [
        `${m.id}  ${Math.round(p.x)},${Math.round(p.y)}  тайл ${Math.floor(p.x / T)},${Math.floor(p.y / T)}`,
        `объектов ${m.objects.length}  видно ${this.visCount}  NPC ${m.npcs.length}`,
        `чанков ${m.chunks.size}  генерация ${G.world.genMs || 0} мс`,
        `след A*: ${this.trailMs || 0} мс  цель: ${(G.nav.current() || {}).label || '—'}`,
        'Тап по карте — телепорт',
      ];
    },
  };
  return S;
});


// ===== scenes/mapview.js =====
// Большая карта Конохи (кнопка КАРТА), план §2.6.
// Масштаб ×1 / ×2 (кнопка ЦЕЛЬ), курсор крестовиной, фильтры (МЕНЮ или тап), карточка места (A),
// «Проложить путь» и «Метка», туман неисследованных участков, задания и друзья.
G.scenes.register('mapview', (world) => {
  const T = G.CONFIG.TILE;
  const K = G.world.konoha();
  const FILTERS = ['Все', 'Задания', 'Лавки', 'Тренировки', 'Друзья'];
  const TOP = 28, BOT = 46;

  // ---------- места ----------
  const placeOf = (b) => {
    const p = G.nav.buildingPoint(b);
    return { x: p.x / T, y: p.y / T - 0.5 };
  };
  const places = [];
  for (const b of K.buildings) {
    const d = b.tplDef;
    if (!d) continue;
    const shop = G.SHOPS[b.tplId];
    let kind = null;
    if (shop) kind = d.cat === 'food' ? 'food' : 'shop';
    else if (d.cat === 'training') kind = 'training';
    else if (d.unique || d.cat === 'official' || d.cat === 'clan' || d.cat === 'landmark') kind = 'place';
    if (!kind) continue;
    places.push(Object.assign(placeOf(b), { b, kind, name: b.name, shop, known: !!d.unique }));
  }
  for (const sp of Object.values(K.spots)) {
    places.push(Object.assign(placeOf(sp), { b: sp, kind: sp.tplDef.cat === 'training' ? 'training' : 'place', name: sp.name, known: !!sp.tplDef.unique }));
  }
  const isOpen = (shop) => { const m = G.state.vars.min % 1440; return m >= shop.hours[0] && m < shop.hours[1]; };

  // ---------- позиции заданий / друзей ----------
  function questMarks() {
    const out = [];
    const tracked = G.quests.tracked();
    for (const id of G.quests.activeList()) {
      const st = G.quests.curStep(id);
      if (!st) continue;
      const r = G.nav.resolve(st.target, st);
      if (!r) continue;
      let x = r.x / T, y = r.y / T;
      if (r.map !== 'konoha') {
        const b = K.buildings[Number(String(r.map).split(':')[1])];
        if (!b) continue;
        ({ x, y } = placeOf(b));
      }
      out.push({ x, y, id, tracked: id === tracked, icon: G.QUEST_CATS[G.QUESTS[id].cat].icon, col: G.QUEST_CATS[G.QUESTS[id].cat].color, label: st.text });
    }
    for (const [id, d] of Object.entries(G.QUESTS)) {
      if (!d.offer || G.quests.state(id) || !d.offer.when()) continue;
      let pos = null;
      if (d.offer.in) { const b = K.buildings.find((b) => b.tplId === d.offer.in); if (b) pos = placeOf(b); }
      else { const f = G.nav.findNpc(d.offer.npc); if (f) pos = f.b ? placeOf(f.b) : { x: f.n.x / T, y: f.n.y / T }; }
      if (pos) out.push({ x: pos.x, y: pos.y, offer: true, icon: '!', col: G.PAL.yellow, label: d.title });
    }
    return out;
  }
  function friendMarks() {
    const out = [];
    for (const id of Object.keys(G.chars.DEFS)) {
      if ((G.state.vars['friend_' + id] || 0) < 2) continue;
      const f = G.nav.findNpc(id);
      if (!f) continue;
      const pos = f.b ? placeOf(f.b) : { x: f.n.x / T, y: f.n.y / T };
      out.push({ x: pos.x, y: pos.y, icon: '🍃', col: '#6ab04a', label: G.chars.nameOf(id), npc: id });
    }
    return out;
  }

  // ---------- где герой ----------
  function heroPos() {
    const m = world.map, p = world.player;
    if (m.outdoor) return { x: p.x / T, y: p.y / T, inside: null };
    const pp = placeOf(m.building);
    return { x: pp.x, y: pp.y, inside: m.name };
  }

  const S = {
    name: 'mapview',
    t: 0,
    zoom: 1,
    filter: 0,
    card: null,       // { place, opts, sel }
    toast: null, toastT: 0,
    qm: questMarks(),
    fm: friendMarks(),

    enter() {
      const h = heroPos();
      this.cx = h.x; this.cy = h.y;
      this.vx = 0; this.vy = 0;
      if (K.w * 2 <= G.screen.W && K.h * 2 <= this.vh()) this.zoom = 2;   // на широком экране вся карта влезает вдвое крупнее
      this.fitView(true);
    },
    vh() { return G.screen.H - TOP - BOT; },
    fitView(center) {
      const z = this.zoom, VW = G.screen.W / z, VH = this.vh() / z;
      if (K.w <= VW) this.vx = -(VW - K.w) / 2;
      else if (center) this.vx = G.util.clamp(this.cx - VW / 2, 0, K.w - VW);
      else {
        const mx = 16 / z;
        if (this.cx < this.vx + mx) this.vx = this.cx - mx;
        if (this.cx > this.vx + VW - mx) this.vx = this.cx - VW + mx;
        this.vx = G.util.clamp(this.vx, 0, K.w - VW);
      }
      if (K.h <= VH) this.vy = -(VH - K.h) / 2;
      else if (center) this.vy = G.util.clamp(this.cy - VH / 2, 0, K.h - VH);
      else {
        const my = 16 / z;
        if (this.cy < this.vy + my) this.vy = this.cy - my;
        if (this.cy > this.vy + VH - my) this.vy = this.cy - VH + my;
        this.vy = G.util.clamp(this.vy, 0, K.h - VH);
      }
    },
    toScreen(x, y) { return [Math.round((x - this.vx) * this.zoom), Math.round(TOP + (y - this.vy) * this.zoom)]; },
    fogged(x, y) {
      const B = G.nav.FOG_B;
      return !G.nav.explored(Math.floor(x / B), Math.floor(y / B));
    },
    visiblePlaces() {
      const f = FILTERS[this.filter];
      return places.filter((p) => {
        if (!p.known && this.fogged(p.x, p.y)) return false;
        if (f === 'Все') return true;
        if (f === 'Лавки') return p.kind === 'shop' || p.kind === 'food';
        if (f === 'Тренировки') return p.kind === 'training';
        return false;
      });
    },
    hover() {
      const r = 3.2 / this.zoom + 0.8;
      let best = null, bd = r;
      for (const p of places) {
        if (!p.known && this.fogged(p.x, p.y)) continue;
        const d = Math.hypot(p.x - this.cx, p.y - this.cy);
        if (d < bd) { bd = d; best = p; }
      }
      return best;
    },
    say(t) { this.toast = t; this.toastT = 1.6; },

    setMarker(x, y, label) {
      const g = G.nav.walkGrid(K);
      const w = G.nav.nearestWalkable(K, g, Math.floor(x), Math.floor(y));
      if (!w) { G.audio.sfx.error(); this.say('Туда не пройти'); return false; }
      G.state.marker = { x: w[0], y: w[1], label };
      G.audio.sfx.confirm();
      return true;
    },

    openCard(p) {
      const opts = [];
      opts.push({ label: 'Проложить путь', act: () => { if (this.setMarker(p.x, p.y + 0.5, p.name)) { G.scenes.pop(); world.showTrail(); } } });
      const mk = G.state.marker;
      const here = mk && mk.label === p.name;
      opts.push(here ? { label: 'Снять метку', act: () => { G.state.marker = null; this.card = null; this.say('Метка снята'); G.audio.sfx.cancel(); } }
        : { label: 'Метка', act: () => { if (this.setMarker(p.x, p.y + 0.5, p.name)) { this.card = null; this.say('📍 Метка: ' + p.name); } } });
      // кто сейчас там
      let who = [];
      if (p.b.interior) {
        const m = G.world.get(p.b.interior.id);
        who = m.npcs.filter((n) => G.life.visible(n)).map((n) => n.name || G.chars.nameOf(n.id));
      } else {
        who = K.npcs.filter((n) => G.life.visible(n) && Math.hypot(n.x / T - p.x, n.y / T - p.y) < 6).map((n) => n.name || G.chars.nameOf(n.id));
      }
      this.card = { p, opts, sel: 0, who: [...new Set(who)] };
      G.audio.sfx.select();
    },

    update(dt) {
      this.t += dt;
      const I = G.input;
      if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) this.toast = null; }
      const W = G.screen.W, H = G.screen.H;

      if (this.card) {
        const c = this.card;
        if (I.pressed('b') || I.pressed('map')) { this.card = null; G.audio.sfx.cancel(); return; }
        if (I.pressed('up') || I.pressed('down')) { c.sel = 1 - c.sel; G.audio.sfx.select(); }
        if (I.pressed('a')) { c.opts[c.sel].act(); return; }
        if (I.tapNow) {
          const r = this.cardRect();
          const t = I.tapNow;
          if (t.y >= r.y && t.y < r.y + r.h && t.x >= r.x && t.x < r.x + r.w) {
            const i = Math.floor((t.y - r.btnY) / 22);
            if (i >= 0 && i < c.opts.length) { c.sel = i; c.opts[i].act(); }
          } else { this.card = null; G.audio.sfx.cancel(); }
        }
        return;
      }

      if (I.pressed('map') || I.pressed('b')) { G.audio.sfx.cancel(); G.scenes.pop(); return; }
      if (I.pressed('menu')) { this.filter = (this.filter + 1) % FILTERS.length; G.audio.sfx.select(); return; }
      if (I.pressed('goal')) { this.zoom = this.zoom === 1 ? 2 : 1; this.fitView(true); G.audio.sfx.select(); return; }

      // курсор
      const ax = (I.held('right') ? 1 : 0) - (I.held('left') ? 1 : 0);
      const ay = (I.held('down') ? 1 : 0) - (I.held('up') ? 1 : 0);
      if (ax || ay) {
        this.hold = (this.hold || 0) + dt;
        const sp = (this.hold > 0.6 ? 60 : 24) / this.zoom;
        this.cx = G.util.clamp(this.cx + ax * sp * dt, 0, K.w - 1);
        this.cy = G.util.clamp(this.cy + ay * sp * dt, 0, K.h - 1);
        this.fitView(false);
      } else this.hold = 0;

      if (I.tapNow) {
        const t = I.tapNow;
        if (t.y >= H - BOT && t.y < H - BOT + 26) {         // фильтры
          const i = Math.floor(t.x / (W / FILTERS.length));
          if (i >= 0 && i < FILTERS.length) { this.filter = i; G.audio.sfx.select(); }
          return;
        }
        if (t.y < TOP) { this.zoom = this.zoom === 1 ? 2 : 1; this.fitView(true); return; }
        const nx = t.x / this.zoom + this.vx, ny = (t.y - TOP) / this.zoom + this.vy;
        const before = this.hover();
        const same = Math.hypot(nx - this.cx, ny - this.cy) < 3 / this.zoom + 1;
        this.cx = G.util.clamp(nx, 0, K.w - 1); this.cy = G.util.clamp(ny, 0, K.h - 1);
        const h = this.hover();
        if (same && h && h === before) this.openCard(h);
        else G.audio.sfx.blip();
        return;
      }

      if (I.pressed('a')) {
        const h = this.hover();
        if (h) { this.openCard(h); return; }
        const mk = G.state.marker;
        if (mk && Math.hypot(mk.x + 0.5 - this.cx, mk.y + 0.5 - this.cy) < 3) { G.state.marker = null; this.say('Метка снята'); G.audio.sfx.cancel(); return; }
        if (this.fogged(this.cx, this.cy)) { G.audio.sfx.error(); this.say('Ты там ещё не был'); return; }
        if (this.setMarker(this.cx, this.cy, 'Метка')) this.say('📍 Метка поставлена');
      }
    },

    cardRect() {
      const W = G.screen.W, H = G.screen.H;
      const c = this.card, lines = 3 + (c.who.length ? 1 : 0);
      const h = 22 + lines * 13 + c.opts.length * 22 + 6;
      const y = H - BOT - h - 4;
      return { x: 6, y, w: W - 12, h, btnY: y + 14 + lines * 13 + 4 };
    },

    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, P = G.PAL, F = G.font, z = this.zoom;
      G.ui.backdrop(ctx);
      const VH = this.vh();
      ctx.save(); ctx.beginPath(); ctx.rect(0, TOP, W, VH); ctx.clip();
      // подложка
      const img = K.overview();
      ctx.imageSmoothingEnabled = false;
      const [ox, oy] = this.toScreen(0, 0);
      ctx.fillStyle = P.ink; ctx.fillRect(ox - 1, oy - 1, K.w * z + 2, K.h * z + 2);
      ctx.drawImage(img, ox, oy, K.w * z, K.h * z);
      // туман
      const B = G.nav.FOG_B, fs = G.nav.fogSize();
      ctx.fillStyle = 'rgba(20,18,28,0.82)';
      for (let by = 0; by < fs.bh; by++) for (let bx = 0; bx < fs.bw; bx++) {
        if (G.nav.explored(bx, by)) continue;
        const [sx, sy] = this.toScreen(bx * B, by * B);
        ctx.fillRect(sx, sy, B * z, B * z);
      }
      // места
      const bob = Math.round(Math.sin(this.t * 5) * 1.2);
      const icon = (txt, x, y, col) => { const [sx, sy] = this.toScreen(x, y); F.small.draw(ctx, txt, sx, sy - 4, { color: col, outline: P.ink, align: 'center' }); };
      for (const p of this.visiblePlaces()) {
        if (p.kind === 'food') icon('🍜', p.x, p.y, isOpen(p.shop) ? '#ffb070' : '#7a7a86');
        else if (p.kind === 'shop') icon('●', p.x, p.y, isOpen(p.shop) ? '#ffd84a' : '#7a7a86');
        else if (p.kind === 'training') icon('★', p.x, p.y, '#ff8a6a');
        else if (z === 2) { const [sx, sy] = this.toScreen(p.x, p.y); ctx.fillStyle = P.ink; ctx.fillRect(sx - 1, sy - 1, 3, 3); ctx.fillStyle = '#ffffff'; ctx.fillRect(sx, sy, 1, 1); }
      }
      const f = FILTERS[this.filter];
      // друзья
      if (f === 'Все' || f === 'Друзья') for (const m of this.fm) icon(m.icon, m.x, m.y, m.col);
      // секрет с «Карты тайников»
      if (G.game.count('map_secrets') && !G.quests.done('waterfall_scroll') && (f === 'Все' || f === 'Задания')) {
        const wf = K.spots.waterfall;
        if (wf) icon('❓', wf.tx - 1, wf.ty + wf.th, '#c090ff');
      }
      // задания
      if (f === 'Все' || f === 'Задания') {
        for (const m of this.qm) if (!m.tracked) icon(m.offer ? '!' : m.icon, m.x, m.y, m.col);
        for (const m of this.qm) if (m.tracked && !G.state.marker) { const [sx, sy] = this.toScreen(m.x, m.y); F.small.draw(ctx, '▼', sx, sy - 11 + bob * 2, { color: '#ff4a3a', outline: P.ink, align: 'center' }); }
      }
      // метка
      const mk = G.state.marker;
      if (mk) { const [sx, sy] = this.toScreen(mk.x + 0.5, mk.y + 0.5); F.small.draw(ctx, '📍', sx, sy - 7 + bob, { color: '#ff4a3a', outline: P.ink, align: 'center' }); }
      // герой ◉
      const h = heroPos();
      {
        const [sx, sy] = this.toScreen(h.x, h.y);
        const on = Math.floor(this.t * 3) % 2 === 0;
        ctx.fillStyle = P.ink; ctx.fillRect(sx - 3, sy - 2, 7, 5); ctx.fillRect(sx - 2, sy - 3, 5, 7);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(sx - 2, sy - 1, 5, 3); ctx.fillRect(sx - 1, sy - 2, 3, 5);
        ctx.fillStyle = on ? '#e8621a' : '#ffffff'; ctx.fillRect(sx - 1, sy - 1, 3, 3);
      }
      // курсор
      {
        const [sx, sy] = this.toScreen(this.cx, this.cy);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx - 6, sy, 4, 1); ctx.fillRect(sx + 3, sy, 4, 1); ctx.fillRect(sx, sy - 6, 1, 4); ctx.fillRect(sx, sy + 3, 1, 4);
      }
      ctx.restore();

      // заголовок: деревянная планка с красной лентой
      const U = G.ui, C = U.C;
      U.panel(ctx, 0, 0, W, TOP, 'plank');
      U.title(ctx, 'КАРТА КОНОХИ', W / 2, 6, 0);
      F.small.draw(ctx, (z === 1 ? '×1' : '×2') + ' · ' + G.game.clock(), W - 6, 9, { align: 'right', color: '#f4e4bc', shadow: C.woodEdge });

      // строка-подсказка о месте под курсором
      const hv = this.hover();
      let info;
      if (hv) {
        info = hv.name;
        if (hv.shop) info += isOpen(hv.shop) ? ` · до ${G.game.clock(hv.shop.hours[1])}` : ` · закрыто (с ${G.game.clock(hv.shop.hours[0])})`;
      } else if (h.inside) info = 'Ты внутри: ' + h.inside;
      else info = this.fogged(this.cx, this.cy) ? 'Неизведанные места' : 'Коснись места — карточка';
      U.panel(ctx, 0, TOP + VH - 17, W, 17, 'night');
      F.small.draw(ctx, info, W / 2, TOP + VH - 14, { align: 'center', color: hv ? '#f4d46a' : '#c8b48a', maxW: W - 8 });

      // фильтры: вкладки на деревянной планке
      const fy = H - BOT;
      U.panel(ctx, 0, fy, W, BOT, 'plank');
      const fw = (W - 8) / FILTERS.length;
      FILTERS.forEach((name, i) => {
        const sel = i === this.filter, x = Math.round(4 + i * fw);
        U.button(ctx, x, fy + 6, Math.round(fw) - 3, 22, '', sel ? 'sel' : 'normal');
        let n = name; while (F.small.measure(n) > fw - 8) n = n.slice(0, -2) + '.';
        F.small.draw(ctx, n, x + (Math.round(fw) - 3) / 2, fy + 12, { align: 'center', color: sel ? '#f8eed0' : '#e4d4a8', shadow: C.woodEdge });
      });
      F.small.draw(ctx, 'Коснись шапки — масштаб', W / 2, fy + 32, { align: 'center', color: '#c8b48a', maxW: W - 8, shadow: C.woodEdge });

      // карточка места
      if (this.card) this.drawCard(ctx);
      if (this.toast) {
        const w = F.measure(this.toast) + 22;
        U.panel(ctx, Math.round((W - w) / 2), TOP + 6, w, 20, 'night');
        F.draw(ctx, this.toast, W / 2, TOP + 11, { align: 'center', color: '#f4d46a' });
      }
    },

    drawCard(ctx) {
      const c = this.card, p = c.p, r = this.cardRect(), F = G.font, U = G.ui, C = U.C;
      U.panel(ctx, r.x, r.y, r.w, r.h, 'frame');
      let y = r.y + 12;
      F.draw(ctx, p.name, r.x + 12, y, { color: C.redDark, maxW: r.w - 80 }); y += 15;
      const cat = { food: 'Еда', shop: 'Лавка', training: 'Тренировки', place: p.b.tplDef.cat === 'clan' ? 'Клан' : 'Место' }[p.kind];
      F.small.draw(ctx, cat, r.x + r.w - 12, r.y + 14, { align: 'right', color: C.inkDim });
      if (p.shop) {
        const o = isOpen(p.shop);
        F.small.draw(ctx, `${G.game.clock(p.shop.hours[0])}–${G.game.clock(p.shop.hours[1])} · ${o ? 'открыто' : 'закрыто'}`, r.x + 12, y, { color: o ? C.ok : C.err });
      } else F.small.draw(ctx, p.b.interior ? 'Можно зайти' : 'Под открытым небом', r.x + 12, y, { color: C.inkDim });
      y += 13;
      const dist = Math.round(Math.hypot(p.x - heroPos().x, p.y - heroPos().y) * 2);
      F.small.draw(ctx, `≈${dist} м от тебя`, r.x + 12, y, { color: C.inkDim }); y += 13;
      if (c.who.length) F.small.draw(ctx, 'Сейчас там: ' + c.who.join(', '), r.x + 12, y, { color: '#3a62a0', maxW: r.w - 24 });
      c.opts.forEach((o, i) => {
        const by = r.btnY + i * 22, sel = i === c.sel;
        U.button(ctx, r.x + 10, by, r.w - 20, 20, o.label, sel ? 'sel' : 'normal');
      });
    },
  };
  return S;
});


// ===== scenes/shop.js =====
// Окно лавки (план §5.4): портрет и приветствие, список товаров, описание, количество, деньги.
// G.scenes.make('shop', shopId, { title, onClose(bought) })
G.scenes.register('shop', (shopId, opts = {}) => {
  const shop = G.SHOPS[shopId];
  // навык «Обаяние» — скидка 10%
  const items = shop.stock.map((id) => Object.assign({ id }, G.ITEMS[id], { price: Math.max(1, Math.round(G.ITEMS[id].price * G.hero.priceMul())) }));
  const keeperName = shop.keeper.name || G.chars.nameOf(shop.keeper.who);
  const title = opts.title || keeperName;
  const bought = [];
  let idx = 0, qty = 1, msg = null, msgT = 0, msgErr = false, qmode = false;
  const P = () => G.PAL;

  const locked = (it) => it.week && G.game.week() < it.week;
  const maxQty = (it) => {
    if (it.cat === 'food' || it.cat === 'service') return 1;
    let n = Math.floor(G.state.vars.money / it.price);
    if (it.pouch) n = Math.min(n, G.game.pouchMax() - G.game.pouchUsed());
    return G.util.clamp(n, 1, 20);
  };

  function say(text, err) { msg = text; msgT = 1.8; msgErr = !!err; }

  function buy() {
    const it = items[idx];
    const g = G.game;
    if (locked(it)) { G.audio.sfx.error(); say(`Продаётся с ${it.week}-й недели.`, true); return; }
    const total = it.price * qty;
    if (!g.canPay(total)) { G.audio.sfx.error(); say('Не хватает рё!', true); return; }
    if (it.pouch && g.pouchUsed() + qty > g.pouchMax()) { G.audio.sfx.error(); say('Подсумок полон!', true); return; }
    if (it.cat === 'food' && it.effect.food && G.state.vars.food >= 95) { G.audio.sfx.error(); say('Ты уже сыт. Больше не влезет.', true); return; }
    g.pay(total);
    if (it.cat === 'food' || it.cat === 'service') {
      const e = it.effect || {};
      if (e.food) g.eat(e.food);
      if (e.energy) g.rest(e.energy);
      if (e.mood) g.mood(e.mood);
      if (e.minutes) g.advance(e.minutes);
      G.audio.sfx.confirm();
      say(it.cat === 'food' ? `Ты съел: ${it.name}. Вкуснотища!` : `${it.name} — готово. Силы вернулись!`);
    } else {
      g.give(it.id, qty);
      G.audio.sfx.confirm();
      say(`Куплено: ${it.name}${qty > 1 ? ' ×' + qty : ''}`);
    }
    bought.push({ id: it.id, qty });
    qty = 1;
  }

  function close() {
    G.audio.sfx.cancel();
    G.scenes.pop();
    opts.onClose && opts.onClose(bought);
  }

  const S = {
    name: 'shop',
    transparent: true,

    layout() {
      const W = G.screen.W, H = G.screen.H;
      const hdr = { x: 4, y: 4, w: W - 8, h: 58 };
      const foot = { x: 4, y: H - 30, w: W - 8, h: 26 };
      const info = { x: 4, y: foot.y - 74, w: W - 8, h: 70 };
      const cols = Math.max(2, Math.floor((W - 22) / 62)), cardW = Math.floor((W - 8 - 12) / cols), cardH = 56;
      const listY = hdr.y + hdr.h + 4;
      const rows = Math.max(1, Math.floor((info.y - 4 - listY - 12) / cardH));
      const list = { x: 4, y: listY, w: W - 8, h: rows * cardH + 12, rows, cols, cardW, cardH, per: rows * cols };
      const bw = Math.round((foot.w - 6) / 2);
      const buyB = { x: foot.x, y: foot.y, w: bw, h: foot.h }, exitB = { x: foot.x + bw + 6, y: foot.y, w: bw, h: foot.h };
      const minus = { x: info.x + 12, y: info.y + info.h - 28, w: 22, h: 20 }, plus = { x: info.x + 72, y: info.y + info.h - 28, w: 22, h: 20 };
      return { hdr, list, info, foot, buyB, exitB, minus, plus };
    },

    update(dt) {
      const I = G.input;
      if (msgT > 0) { msgT -= dt; if (msgT <= 0) msg = null; }
      const L = this.layout();
      const n = items.length, g = L.list;
      const mq = maxQty(items[idx]);
      if (qmode) {
        if (I.repeat('left', dt) && qty > 1) { qty--; G.audio.sfx.blip(); }
        if (I.repeat('right', dt) && qty < mq) { qty++; G.audio.sfx.blip(); }
      } else {
        if (I.repeat('up', dt)) { idx = (idx - g.cols + n) % n; qty = 1; G.audio.sfx.select(); }
        if (I.repeat('down', dt)) { idx = (idx + g.cols) % n; qty = 1; G.audio.sfx.select(); }
        if (I.repeat('left', dt)) { idx = (idx + n - 1) % n; qty = 1; G.audio.sfx.select(); }
        if (I.repeat('right', dt)) { idx = (idx + 1) % n; qty = 1; G.audio.sfx.select(); }
      }
      const inR = (t, r) => t.x >= r.x && t.x < r.x + r.w && t.y >= r.y && t.y < r.y + r.h;

      if (I.tapNow) {
        const t = I.tapNow;
        // карточка в сетке
        if (t.y > g.y + 6 && t.y < g.y + g.h - 6 && t.x > g.x && t.x < g.x + g.w) {
          const page = Math.floor(idx / g.per) * g.per;
          const k = Math.floor((t.y - g.y - 6) / g.cardH) * g.cols + Math.floor((t.x - g.x - 6) / g.cardW);
          const i = page + k;
          if (i >= 0 && i < n && (i !== idx || qmode)) { idx = i; qty = 1; qmode = false; G.audio.sfx.select(); }
          return;
        }
        if (items[idx].cat !== 'food' && items[idx].cat !== 'service') {
          if (inR(t, L.minus) && qty > 1) { qty--; G.audio.sfx.blip(); return; }
          if (inR(t, L.plus) && qty < mq) { qty++; G.audio.sfx.blip(); return; }
        }
        if (inR(t, L.buyB)) { buy(); return; }
        if (inR(t, L.exitB)) { close(); return; }
        return;
      }
      if (I.pressed('a')) { if (qmode) { buy(); qmode = false; } else { qmode = true; G.audio.sfx.select(); } }
      else if (I.pressed('b') || I.pressed('menu')) { if (qmode) qmode = false; else close(); }
    },

    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, F = G.font, U = G.ui, C = U.C;
      const L = this.layout();
      U.backdrop(ctx);

      // шапка: портрет в деревянной рамке, имя и приветствие
      const h = L.hdr;
      U.panel(ctx, h.x, h.y, h.w, h.h, 'frame');
      const who = shop.keeper.who;
      let tx = h.x + 12;
      if (G.chars.DEFS[who]) {
        U.panel(ctx, h.x + 8, h.y + 8, 42, 42, 'plank');
        ctx.fillStyle = '#120a05'; ctx.fillRect(h.x + 10, h.y + 10, 38, 38);
        ctx.drawImage(G.chars.portrait(who), h.x + 13, h.y + 13);
        tx = h.x + 58;
      }
      F.draw(ctx, title, tx, h.y + 10, { color: C.redDark, maxW: h.w - (tx - h.x) - 8 });
      F.small.wrap('«' + shop.greet + '»', h.w - (tx - h.x) - 10).slice(0, 3).forEach((ln, i) => F.small.draw(ctx, ln, tx, h.y + 25 + i * 11, { color: C.ink }));

      // список — сетка карточек с иконками
      const l = L.list;
      U.panel(ctx, l.x, l.y, l.w, l.h, 'well');
      const page = Math.floor(idx / l.per) * l.per;
      for (let k = 0; k < l.per; k++) {
        const i = page + k;
        if (i >= items.length) break;
        const it = items[i], lk = locked(it);
        const cx = l.x + 6 + (k % l.cols) * l.cardW, cy = l.y + 6 + Math.floor(k / l.cols) * l.cardH;
        U.card(ctx, cx, cy, l.cardW - 3, l.cardH - 3, i === idx);
        G.icons.draw(ctx, it.id, cx + Math.floor((l.cardW - 3 - 48) / 2), cy + 1, 48, 48);
        if (lk) { ctx.globalAlpha = .5; ctx.fillStyle = '#2a1e14'; ctx.fillRect(cx + 2, cy + 2, l.cardW - 7, l.cardH - 7); ctx.globalAlpha = 1; }
        F.small.draw(ctx, lk ? '—' : it.price + 'р', cx + l.cardW - 7, cy + l.cardH - 17,
          { align: 'right', color: lk ? '#9c8662' : !G.game.canPay(it.price) ? '#ff9a7a' : '#f4d46a', outline: C.woodEdge });
      }
      const pages = Math.ceil(items.length / l.per);
      if (pages > 1) F.small.draw(ctx, `${Math.floor(idx / l.per) + 1}/${pages}`, l.x + l.w - 10, l.y + l.h - 14, { align: 'right', color: C.red });

      // описание, количество, деньги
      const inf = L.info, it = items[idx];
      U.panel(ctx, inf.x, inf.y, inf.w, inf.h, 'frame');
      const textLines = F.small.wrap(msg || it.desc || '', inf.w - 24).slice(0, 2);
      textLines.forEach((ln, i) => F.small.draw(ctx, ln, inf.x + 12, inf.y + 10 + i * 12, { color: msg ? (msgErr ? C.err : C.ok) : C.ink }));
      const qy = inf.y + inf.h - 24;
      if (it.cat === 'food' || it.cat === 'service') {
        const v = G.state.vars;
        F.small.draw(ctx, it.cat === 'food' ? `Сытость: ${Math.round(v.food)}/100` : `Энергия: ${Math.round(v.energy)}/100`, inf.x + 12, qy + 4, { color: C.inkDim });
        F.draw(ctx, it.price + ' рё', inf.x + inf.w - 12, qy + 3, { align: 'right', color: '#8a5a10' });
      } else {
        U.button(ctx, L.minus.x, L.minus.y, L.minus.w, L.minus.h, '−', qty > 1 ? (qmode ? 'sel' : 'normal') : 'dis');
        F.draw(ctx, String(qty), (L.minus.x + L.plus.x + L.plus.w) / 2 + 0.5, L.minus.y + 6, { align: 'center', color: C.ink });
        U.button(ctx, L.plus.x, L.plus.y, L.plus.w, L.plus.h, '+', qty < maxQty(it) ? (qmode ? 'sel' : 'normal') : 'dis');
        F.draw(ctx, '= ' + it.price * qty + ' рё', L.plus.x + L.plus.w + 12, L.minus.y + 6, { color: '#8a5a10' });
        const side = it.pouch ? `подсумок ${G.game.pouchUsed()}/${G.game.pouchMax()}` : `есть ${G.game.count(it.id)}`;
        F.small.draw(ctx, side, inf.x + inf.w - 12, inf.y + 12 + (textLines.length > 1 ? 12 : 0) + 14, { align: 'right', color: C.inkDim });
      }

      // кнопки внизу + деньги
      U.button(ctx, L.buyB.x, L.buyB.y, L.buyB.w, L.buyB.h, it.cat === 'food' || it.cat === 'service' ? 'Взять' : 'Купить', qmode ? 'on' : 'sel');
      U.button(ctx, L.exitB.x, L.exitB.y, L.exitB.w, L.exitB.h, 'Выйти', 'normal');
      F.draw(ctx, G.state.vars.money + ' рё', h.x + h.w - 12, h.y + 10, { align: 'right', color: '#8a5a10' });
    },
  };
  return S;
});


// ===== scenes/bag.js =====
// Сумка (из меню): цель, деньги, нужды, подсумок и прочие вещи. Стиль «Свитки и дерево» (G.ui).
G.scenes.register('bag', () => {
  let idx = 0;
  const list = () => Object.entries(G.state.inv)
    .filter(([id, n]) => n > 0 && G.ITEMS[id])
    .map(([id, n]) => Object.assign({ id, n }, G.ITEMS[id]))
    .sort((a, b) => (a.pouch ? 0 : 1) - (b.pouch ? 0 : 1) || a.name.localeCompare(b.name));
  const INFO_H = 52, DESC_H = 64, CARD_W = 62, CARD_H = 56;

  return {
    name: 'bag',
    cols() { return Math.max(2, Math.floor((G.screen.W - 22) / CARD_W)); },
    gridTop() { return 16 + INFO_H + 8; },
    rows() { return Math.max(1, Math.floor((G.screen.H - this.gridTop() - DESC_H - 18) / CARD_H)); },
    grid() {
      const cols = this.cols(), rows = this.rows(), W = G.screen.W;
      const w = W - 8, cw = Math.floor((w - 12) / cols);
      return { x: 4, y: this.gridTop(), w, h: rows * CARD_H + 12, cols, rows, cardW: cw, cardH: CARD_H, per: rows * cols };
    },
    update(dt) {
      const I = G.input, L = list();
      if (I.pressed('b') || I.pressed('menu')) { G.audio.sfx.cancel(); G.scenes.pop(); return; }
      if (!L.length) return;
      const cols = this.cols();
      if (I.repeat('up', dt)) { idx = (idx - cols + L.length) % L.length; G.audio.sfx.select(); }
      if (I.repeat('down', dt)) { idx = (idx + cols) % L.length; G.audio.sfx.select(); }
      if (I.repeat('left', dt)) { idx = (idx + L.length - 1) % L.length; G.audio.sfx.select(); }
      if (I.repeat('right', dt)) { idx = (idx + 1) % L.length; G.audio.sfx.select(); }
      idx = Math.min(idx, L.length - 1);
      if (I.tapNow) {
        const g = this.grid(), t = I.tapNow, per = g.per;
        if (t.x > g.x && t.x < g.x + g.w && t.y > g.y && t.y < g.y + g.h) {
          const k = Math.floor((t.y - g.y - 6) / g.cardH) * g.cols + Math.floor((t.x - g.x - 6) / g.cardW);
          const i = Math.floor(idx / per) * per + k;
          if (i >= 0 && i < L.length) { idx = i; G.audio.sfx.select(); }
        }
      }
    },
    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, F = G.font, U = G.ui, C = U.C, v = G.state.vars, g = G.game;
      U.backdrop(ctx);
      U.title(ctx, 'СУМКА', W / 2, 3, 70);

      // цель и состояние
      U.panel(ctx, 4, 20, W - 8, INFO_H, 'frame');
      F.small.draw(ctx, `${g.dayNameFull()}, день ${v.day} · ${g.clock()}`, 12, 27, { color: C.inkDim });
      F.small.draw(ctx, `${v.money} рё`, W - 12, 27, { align: 'right', color: '#8a5a10' });
      F.small.wrap('Цель: ' + (g.goalText() || '—'), W - 24).slice(0, 1).forEach((ln, i) => F.small.draw(ctx, ln, 12, 40 + i * 12, { color: C.redDark, maxW: W - 24 }));
      [['Сытость', v.food, C.food], ['Энергия', v.energy, C.energy]].forEach(([nm, val, col], i) => {
        const x = 12 + i * ((W - 24) / 2);
        F.small.draw(ctx, nm, x, 53, { color: C.inkDim });
        U.gauge(ctx, x + 54, 55, Math.round((W - 24) / 2) - 62, 6, val / 100, col);
      });

      // вещи — сетка карточек с иконками
      const L = list(), gr = this.grid();
      U.panel(ctx, gr.x, gr.y, gr.w, gr.h, 'well');
      F.small.draw(ctx, `${g.pouchUsed()}/${g.pouchMax()}`, gr.x + gr.w - 8, gr.y + gr.h - 14, { align: 'right', color: C.inkDim });
      if (!L.length) F.draw(ctx, 'Пусто. Загляни в лавки!', gr.x + 10, gr.y + 10, { color: C.inkDim });
      idx = Math.min(idx, Math.max(0, L.length - 1));
      const page = Math.floor(idx / gr.per) * gr.per;
      for (let k = 0; k < gr.per; k++) {
        const i = page + k;
        if (i >= L.length) break;
        const it = L[i];
        const cx = gr.x + 6 + (k % gr.cols) * gr.cardW, cy = gr.y + 6 + Math.floor(k / gr.cols) * gr.cardH;
        U.card(ctx, cx, cy, gr.cardW - 3, gr.cardH - 3, i === idx);
        G.icons.draw(ctx, it.id, cx + Math.floor((gr.cardW - 3 - 48) / 2), cy + 1, 48, 48);
        F.small.draw(ctx, '×' + it.n, cx + gr.cardW - 7, cy + gr.cardH - 17, { align: 'right', color: '#f8eed0', outline: C.woodEdge });
      }
      if (page > 0) F.small.draw(ctx, '▲', gr.x + gr.w - 12, gr.y + 5, { color: C.red });
      if (page + gr.per < L.length) F.small.draw(ctx, '▼', gr.x + gr.w - 12, gr.y + gr.h - 14, { color: C.red });
      // описание: имя вещи + текст
      const dy = H - DESC_H - 4;
      U.panel(ctx, 4, dy, W - 8, DESC_H, 'frame');
      if (L[idx]) {
        F.draw(ctx, L[idx].name, 14, dy + 9, { color: C.redDark });
        F.small.wrap(L[idx].desc || '', W - 28).slice(0, 3).forEach((ln, i) => F.small.draw(ctx, ln, 14, dy + 26 + i * 12, { color: C.ink }));
      }
    },
  };
});


// ===== scenes/daysum.js =====
// Экран «Итоги дня» после сна. summary — результат G.game.sleep().
G.scenes.register('daysum', (summary, onDone) => {
  let t = 0;
  const friends = [['naruto', 'Наруто'], ['sakura', 'Сакура'], ['sasuke', 'Саске'], ['hinata', 'Хината'], ['iruka', 'Ирука'], ['shikamaru', 'Шикамару']];
  return {
    name: 'daysum',
    update(dt) {
      t += dt;
      const I = G.input;
      if (t > 0.6 && (I.pressed('a') || I.pressed('b') || I.tapNow)) { G.audio.sfx.confirm(); onDone && onDone(); }
    },
    draw(ctx) {
      const W = G.screen.W, H = G.screen.H, F = G.font, S = G.font.small, U = G.ui, C = U.C;
      ctx.fillStyle = '#0e0c16'; ctx.fillRect(0, 0, W, H);
      // звёзды и месяц
      for (let i = 0; i < 40; i++) {
        const x = (i * 53) % W, y = (i * 37) % Math.round(H * 0.45);
        ctx.fillStyle = (Math.sin(t * 2 + i) > 0.6) ? '#ffffff' : '#7a7aa0';
        ctx.fillRect(x, y, 1, 1);
      }
      ctx.fillStyle = '#f4e8b0'; ctx.beginPath(); ctx.arc(W - 30, 30, 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#0e0c16'; ctx.beginPath(); ctx.arc(W - 26, 27, 8, 0, 7); ctx.fill();

      // строки итогов: цвета подобраны под чернила на пергаменте
      const rows = [];
      for (const l of summary.log) rows.push(['✔ ' + l, C.ink]);
      const met = friends.filter(([id]) => G.state.flags['met_' + id]).map(([, n]) => n);
      if (met.length) rows.push(['Знакомые: ' + met.join(', '), C.inkDim]);
      const best = Object.keys(G.FRIENDS).filter((id) => G.friends.pts(id) > 0).sort((a, b) => G.friends.pts(b) - G.friends.pts(a))[0];
      if (best) rows.push([`Лучший друг: ${G.chars.nameOf(best)} ` + ('♥'.repeat(G.friends.level(best)) || '·'), C.red]);
      if (summary.day < 54) rows.push([`До выпускного экзамена: ${54 - summary.day} дн.`, '#3a62a0']);
      if (summary.mood != null) rows.push(['Настроение: ' + G.game.moodName(summary.mood).toLowerCase(), '#7a3a98']);
      rows.push([`Потрачено: ${summary.spent} рё · осталось ${summary.money} рё`, '#8a5a10']);
      if (summary.bed != null) {
        const late = summary.bed > 23 * 60;
        rows.push([summary.faint ? `Уснул без сил в ${G.game.clock(summary.bed)}` : `Отбой в ${G.game.clock(summary.bed)}${late ? ' — поздно' : ''}`, summary.faint || late ? C.err : '#3a62a0']);
        const wt = G.life.WEATHER[summary.weather];
        rows.push([`Подъём ${G.game.clock(summary.wake)} · энергия ${summary.wakeEnergy} · ${wt.icon} ${wt.name.toLowerCase()}`, C.ok]);
      }
      const tw = W - 52;
      const h = 30 + rows.reduce((n, [txt]) => n + S.wrap(txt, tw).length * 12 + 2, 0);
      const y0 = Math.max(46, Math.min(96, H - h - 56));
      U.title(ctx, 'ИТОГИ ДНЯ', W / 2, y0 - 36, 110);
      F.small.draw(ctx, `День ${summary.day} · ${summary.dayName}`, W / 2, y0 - 16, { align: 'center', color: '#d8c8a0' });
      U.panel(ctx, 8, y0, W - 16, h, 'scroll');
      let y = y0 + 15;
      for (const [txt, col] of rows) { for (const ln of S.wrap(txt, tw)) { S.draw(ctx, ln, 26, y, { color: col }); y += 12; } y += 2; }
      S.draw(ctx, 'Игра сохранена', W / 2, y0 + h + 8, { align: 'center', color: '#8ac85a' });
      if (t > 0.6 && Math.floor(t * 2) % 2 === 0) S.draw(ctx, 'Коснись экрана', W / 2, H - 24, { align: 'center', color: '#d8c8a0' });
    },
  };
});

    { label: 'Статы +2', act: () => { const s = G.state.hero.stats; for (const k in s) s[k] = Math.min(G.STAT_CAP, s[k] + 2); say('Статы +2'); } },
    { label: 'Дружба всем +5', act: () => { for (const id of Object.keys(G.FRIENDS)) G.friends.add(id, 5); say('Дружба +5'); } },
