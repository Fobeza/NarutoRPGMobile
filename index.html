  team() {
    const sum = (ids) => ids.reduce((a, i) => a + this.pts(i), 0);
    const grp = { 7: ['naruto', 'sasuke', 'sakura'], 8: ['hinata', 'kiba', 'shino'], 10: ['shikamaru', 'choji', 'ino'] };
    // при равной сумме побеждает команда, где есть самый близкий друг; потом — порядок 7, 8, 10
    const best = (ids) => Math.max(...ids.map((i) => this.pts(i)));
    return Object.keys(grp).map(Number).sort((a, b) => (sum(grp[b]) - sum(grp[a])) || (best(grp[b]) - best(grp[a])))[0];
  },
  // меню общения: «Поговорить», «Подарить», «Тренироваться вместе», «Спарринг»
  menu(npc, world) {
    const id = npc.id, f = G.FRIENDS[id], d = G.state.daily || (G.state.daily = {}), name = G.chars.nameOf(id);
    const lvl = this.level(id);
    const gifts = Object.keys(G.state.inv).filter((k) => G.ITEMS[k] && !G.ITEMS[k].quest && !G.friends.KEY_ITEMS.includes(k) && G.state.inv[k] > 0 && ['gift', 'misc', 'tool', 'med', 'book', 'food'].includes(G.ITEMS[k].cat));
    const t = G.TRAININGS[f.train];
    const opts = [
      { label: 'Поговорить', act: 'talk' },
      { label: 'Подарить', sub: gifts.length ? '' : 'нечего', off: d['gift_' + id] ? 'Сегодня уже дарил' : !gifts.length ? 'Нечего дарить — загляни в лавки' : null, act: 'gift' },
      { label: 'Тренировка вместе', sub: '', off: !t ? 'Не тренируется' : d['trw_' + id] ? 'Сегодня уже тренировались' : G.state.vars.energy < 15 ? 'Ты устал' : lvl < 1 && id !== 'iruka' ? 'Пока не доверяет (дружба 1)' : null, act: 'train', desc: 'Прогресс +50% и дружба.' },
    ];
    if (f.spar) opts.push({ label: 'Спарринг', off: d['spar_' + id] ? 'Сегодня уже был' : G.state.vars.energy < 15 ? 'Ты устал' : null, act: 'spar', desc: 'Бой до 30% HP. Победа — уважение и опыт.' });
    opts.push({ label: 'Пока', act: 'bye' });
    G.scenes.push(G.scenes.make('pick', { title: name + '  ' + '♥'.repeat(lvl) + '·'.repeat(5 - lvl), options: opts }, (i) => {
      const a = i >= 0 ? opts[i].act : 'bye';
      if (a === 'talk') {
        const pool = G.FRIEND_LINES[id] ? G.FRIEND_LINES[id][lvl >= 4 ? 2 : lvl >= 2 ? 1 : 0] : ['...'];
        const line = pool[Math.floor(Math.random() * pool.length)];
        if (!d['talk_' + id]) { d['talk_' + id] = 1; this.add(id, 1, 'talk'); }
        if (npc.talk && typeof npc.talk === 'string' && !d['story_' + id] && G.script.library[npc.talk]) { d['story_' + id] = 1; world.talk(npc.talk); return; }
        world.talk([{ who: id, text: G.util.fmt(line, { name: G.state.hero.name }) }]);
      } else if (a === 'gift') {
        const gopts = gifts.map((k) => ({ label: G.ITEMS[k].name, sub: 'x' + G.state.inv[k], k }));
        G.scenes.push(G.scenes.make('pick', { title: 'Подарок для: ' + name, options: gopts }, (j) => {
          if (j < 0) return;
          const r = this.gift(id, gopts[j].k);
          const txt = { love: 'Это же... именно то, что я хотел(а)! Спасибо огромное!', like: 'О, здорово! Спасибо!', ok: 'Спасибо, приятно.', hate: 'Э-э... ну... спасибо, наверное.' }[r.react];
          world.talk([{ who: id, text: txt }, { text: `${r.bday ? 'День рождения — подарок ценится вдвойне! ' : ''}Дружба ${r.n > 0 ? '+' + r.n : r.n}.` }]);
        }));
      } else if (a === 'train') { d['trw_' + id] = 1; G.train.start(f.train, world, { partner: id }); }
      else if (a === 'spar') {
        d['spar_' + id] = 1;
        G.flow.battle({ enemy: f.spar, mode: 'spar', terrain: 'field', onEnd: (res) => {
          this.add(id, 2, 'spar'); G.game.advance(40); G.state.vars.energy = Math.max(0, G.state.vars.energy - 12);
          if (res.win) { G.state.vars['spwin_' + id] = (G.state.vars['spwin_' + id] || 0) + 1; G.state.vars.rep = (G.state.vars.rep || 0) + 1; }
          if (id === 'sasuke' && res.win) G.state.vars.rival = (G.state.vars.rival || 0) + 1;
          const l = G.ENEMIES[f.spar].lines; world.talk([{ who: id, text: G.util.fmt(res.win ? l.lose : l.win, { name: G.state.hero.name }) }]);
        } }, world);
      }
    }));
  },
};


// ===== systems/story.js =====
// Этапы 7 и 9: Академия (уроки и оценки), сюжет 8 недель, турнир, экзамен, финал, случайные события,
// доска поручений, календарь, секретные свитки, готовка и цветок дома.
const _H = 60;
const _dlg = (id, then) => { const w = G.scenes.stack.find((s) => s.name === 'world'); G.dialog.start(id, { bottom: 22, onEnd: () => { w && w.refreshNpcs(); then && then(); } }); };
const _say = (lines, then) => { const w = G.scenes.stack.find((s) => s.name === 'world'); G.dialog.say(lines.map((l) => typeof l === 'string' ? { text: l } : l), { bottom: 22, onEnd: () => { w && w.refreshNpcs(); then && then(); } }); };
const _world = () => G.scenes.stack.find((s) => s.name === 'world');
const _fmt = (t) => G.util.fmt(t, { name: G.state.hero.name });

// ───────────────────────── Календарь ─────────────────────────
G.calendar = {
  BDAY: { 9: 'kiba', 16: 'shino', 22: 'shikamaru', 23: 'sasuke', 27: 'hinata', 30: 'sakura', 34: 'iruka', 37: 'choji', 44: 'ino', 48: 'lee', 12: 'naruto' },
  EVENTS: {
    2: 'Первый урок', 3: 'Киба ищет соперника', 4: 'Наруто зовёт на крыши', 8: 'Урок: Каварими', 10: 'Наруто что-то задумал', 15: 'Урок: Хенге',
    17: 'Урок гендзюцу', 18: 'Кто-то в зелёном...', 21: 'Фестиваль (вечер)', 26: 'ТУРНИР АКАДЕМИИ', 29: 'Урок: хождение по дереву',
    38: 'Полевой выход', 43: 'Урок: Буншин', 47: 'Колокольчики', 54: 'ВЫПУСКНОЙ ЭКЗАМЕН',
  },
  birthday(day = G.state.vars.day) { return this.BDAY[day] || null; },
  upcoming(n = 8) {
    const d0 = G.state.vars.day, out = [];
    for (let d = d0; d <= 56 && out.length < n; d++) {
      if (this.EVENTS[d]) out.push({ d, text: this.EVENTS[d] });
      if (this.BDAY[d]) out.push({ d, text: 'ДР: ' + G.chars.nameOf(this.BDAY[d]) + ' ♥×2' });
      if (G.academy.isSchoolDay(d) && !this.EVENTS[d] && d === d0) out.push({ d, text: 'Уроки 8:00–13:00' });
    }
    return out.slice(0, n);
  },
};

// ───────────────────────── Академия ─────────────────────────
G.academy = {
  SUBJ: { hist: 'История', throw: 'Метание', nin: 'Ниндзюцу', tai: 'Тайдзюцу', prac: 'Практика' },
  isSchoolDay(d = G.state.vars.day) { return d >= 2 && d < 54 && (d - 1) % 7 < 5 && d !== 26 && d !== 38; },
  inClass() { const w = _world(); return w && w.map && w.map.name === 'Академия: класс'; },
  lessonNow() { const v = G.state.vars; return this.isSchoolDay() && v.min >= 7 * _H + 30 && v.min < 9 * _H + 30 && !G.state.daily.lesson; },
  grade(s) { const v = G.state.vars, n = v['gn_' + s] || 0; return n ? Math.round(v['gs_' + s] / n) : 0; },
  avg() { const ks = Object.keys(this.SUBJ).filter((k) => G.state.vars['gn_' + k]); return ks.length ? Math.round(ks.reduce((a, k) => a + this.grade(k), 0) / ks.length) : 0; },
  mark(p) { return p >= 85 ? 'отлично' : p >= 65 ? 'хорошо' : p >= 45 ? 'удовл.' : 'плохо'; },
  addGrade(s, p) { const v = G.state.vars; v['gs_' + s] = (v['gs_' + s] || 0) + p; v['gn_' + s] = (v['gn_' + s] || 0) + 1; },
  attendance() { const v = G.state.vars, a = v.att || 0, m = v.miss || 0; return a + m ? Math.round(a / (a + m) * 100) : 100; },
  // план урока по дню
  plan(d) {
    const wd = (d - 1) % 7, week = Math.floor((d - 1) / 7) + 1;
    const special = {
      2: { s: 'prac', intro: 'les_first', battle: 'dummy' },
      8: { s: 'nin', intro: 'les_kawarimi', battle: 'dummy2', learn: 'kawarimi' },
      15: { s: 'nin', intro: 'les_henge', mg: 'seals', learn: 'henge' },
      17: { s: 'nin', intro: 'les_genjutsu', mg: 'meditate', learn: 'fear' },
      29: { s: 'prac', intro: 'les_tree', mg: 'tree', learnFlag: 'tech_tree' },
      43: { s: 'nin', intro: 'les_bunshin', mg: 'seals', learn: 'bunshin' },
    }[d];
    if (special) return special;
    const mates = ['kiba', 'choji', 'ino', 'shikamaru', 'hinata', 'naruto', 'sasuke'];
    return [
      { s: 'hist', intro: 'les_hist', mg: 'quiz' },
      { s: 'throw', intro: 'les_throw', mg: 'throw' },
      { s: 'nin', intro: 'les_nin', mg: 'seals' },
      { s: 'tai', intro: 'les_tai', battle: week === 1 ? 'dummy2' : mates[(week - 2) % mates.length] },
      { s: 'prac', intro: 'les_prac', mg: week >= 5 && G.state.flags.tech_tree ? 'tree' : week % 2 ? 'meditate' : 'log' },
    ][wd];
  },
  start(world) {
    const v = G.state.vars, d = v.day, p = this.plan(d);
    G.state.daily.lesson = 1; G.state.daily.lessonRun = 1;   // lessonRun снимается, когда оценка записана (см. G.story.recover)
    const late = v.min > 8 * _H + 10;
    let qz = null;
    const go = () => {
      const done = (score) => {
        delete G.state.daily.lessonRun;
        let pts = Math.round(score * 100); if (qz != null) pts = Math.round(pts * 0.6 + qz * 100 * 0.4); if (late) pts = Math.max(0, pts - 10);
        this.addGrade(p.s, pts); v.att = (v.att || 0) + 1;
        const xpMap = { hist: { know: 6 }, throw: { tai: 4, spd: 3 }, nin: { nin: 5, ctrl: 2 }, tai: { tai: 6, end: 2 }, prac: { chakra: 4, ctrl: 3 } }[p.s];
        for (const [k, n] of Object.entries(xpMap)) G.train.addXp(k, n * (0.5 + score));
        if (p.learn && !G.state.flags['tech_' + p.learn]) { G.state.flags['tech_' + p.learn] = 1; G.game.note('Изучена техника: ' + G.TECHS[p.learn].name); }
        if (p.learnFlag) G.state.flags[p.learnFlag] = 1;
        if (pts >= 80) G.friends.add('iruka', 1);
        G.game.advanceTo('13:00'); v.energy = Math.max(0, v.energy - 10); v.food = Math.max(0, v.food - 10);
        G.game.note(`Урок «${this.SUBJ[p.s]}»: ${this.mark(pts)}`);
        const learned = p.learn ? ` Ты выучил технику «${G.TECHS[p.learn].name}»!` : p.learnFlag ? ' Теперь можно тренировать хождение по дереву!' : '';
        _say([{ who: 'iruka', text: `${pts >= 85 ? 'Превосходно' : pts >= 65 ? 'Хорошо' : pts >= 45 ? 'Неплохо, но можешь лучше' : 'Нужно больше стараться'}, {name}! Оценка: ${this.mark(pts)} (${pts}).${learned}` }, { text: 'Уроки окончены. Время — 13:00.' }]
          .map((l) => Object.assign(l, { text: _fmt(l.text) })), () => world.softRefresh && world.softRefresh());
      };
      if (p.battle) {
        G.flow.battle({ enemy: p.battle, mode: 'spar', terrain: 'yard', onEnd: (res) => done(res.win ? Math.max(0.5, Math.min(1, 0.7 + 0.3 * (1 - res.turns / 20))) : 0.35) }, world);
      } else {
        G.scenes.push(G.scenes.make('train', p.mg, { title: 'Урок: ' + this.SUBJ[p.s], n: 4 }, done));
      }
    };
    if (late) G.friends.add('iruka', -0.5);
    const lecture = () => G.lessons.run(p, d, world, (ratio, test) => { qz = ratio; go(); });
    _dlg(G.script.library[p.intro] ? p.intro : 'les_generic', lecture);
  },
  // проверка прогула (раз в день в 9:30)
  checkSkip() {
    const v = G.state.vars, d = G.state.daily;
    if (this.isSchoolDay() && v.min >= 9 * _H + 30 && v.min < 13 * _H && !d.lesson && !d.missed) {
      d.missed = 1; v.miss = (v.miss || 0) + 1; G.friends.add('iruka', -1);
      const w = _world(); w && w.showToast && w.showToast('Ты прогулял урок! Ирука недоволен.');
      G.game.note('Прогул урока');
      const p = this.plan(v.day);
      if (p.learn || p.learnFlag) {   // технику объяснят после уроков: очередь, чтобы пропуски не затирали друг друга
        const q = G.state.makeupQ || (G.state.makeupQ = []);
        if (!q.includes(v.day)) q.push(v.day);
        if (w && w.showToast) setTimeout(() => w.showToast('Техника: зайди в класс после 13:00'), 2400);
      }
    }
  },
};

// ───────────────────────── Сюжетные события ─────────────────────────
// where: 'out' — на улице, 'any', 'class' — в классе; from/to — время; script — диалог, run — функция
G.STORY = [
  { id: 'kiba', day: 3, from: 13 * _H, to: 21 * _H, where: 'out', script: 'st_kiba' },
  { id: 'roofs', day: 4, from: 14 * _H, to: 20 * _H, where: 'out', script: 'st_roofs', must: true },
  { id: 'prank', day: 10, from: 17 * _H, to: 22 * _H, where: 'out', script: 'st_prank' },
  { id: 'lee', day: 18, from: 15 * _H, to: 21 * _H, where: 'out', script: 'st_lee' },
  { id: 'festival', day: 21, from: 18 * _H, to: 23 * _H, where: 'out', script: 'st_festival' },
  { id: 'tourney', day: 26, from: 7 * _H, to: 20 * _H, where: 'any', script: 'st_tourney', must: true, place: 'academy' },
  { id: 'mizuki1', day: 31, from: 20 * _H, to: 23 * _H, where: 'out', script: 'st_mizuki1' },
  { id: 'mizuki2', day: 33, from: 13 * _H, to: 19 * _H, where: 'out', script: 'st_mizuki2' },
  { id: 'field', day: 38, from: 7 * _H, to: 20 * _H, where: 'any', script: 'st_field', place: 'academy' },
  { id: 'bells', day: 47, from: 13 * _H, to: 21 * _H, where: 'any', script: 'st_bells', place: 'academy' },
  { id: 'exam', day: 54, from: 7 * _H, to: 20 * _H, where: 'any', script: 'st_exam', must: true, place: 'academy' },
  { id: 'night', day: 54, from: 20 * _H, to: 30 * _H, where: 'any', script: 'st_night', after: 'exam', must: true, place: 'forest' },
];
G.story = {
  // Событие помечается «было» (st_<id>) в момент начала. Если вкладку Safari выгрузили посреди боя или экзамена,
  // в сохранении остаётся флаг без результата, и без этой починки игру нельзя пройти. Вызывается из G.game.fix().
  recover(st) {
    const f = st.flags || {}, v = st.vars || {}, d = st.daily || {};
    const fixes = [];
    const undo = (flag, why) => { if (f[flag]) { delete f[flag]; fixes.push(why); } };
    if (f.st_night && !f.mizuki_beaten) undo('st_night', 'ночь Мизуки');
    if (f.st_exam && v.exam == null) undo('st_exam', 'экзамен');
    if (f.st_tourney && v.tourney == null) undo('st_tourney', 'турнир');
    if (f.st_field && !f.field_done && v.day <= 38) undo('st_field', 'полевой выход');
    if (f.st_bells && !f.bells_done && v.day <= 47) undo('st_bells', 'колокольчики');
    // экзамен оценён, но диалог с результатом не дошёл до «выпускник»
    if (v.exam != null && v.exam_pass && !f.graduated) { f.graduated = 1; if (v.exam >= 80) f.best = 1; fixes.push('результат экзамена'); }
    if (d.lessonRun) { delete d.lesson; delete d.lessonRun; fixes.push('урок'); }
    if (fixes.length) console.info('Восстановлено после прерывания:', fixes.join(', '));
    return fixes;
  },
  // вызывается из мира каждый кадр, когда он свободен
  poll(world) {
    const st = G.state, v = st.vars, f = st.flags;
    if (!st.started || !f.day2_intro || G.scenes.top() !== world || G.scenes.busy) return false;
    while (st.frQueue && st.frQueue.length && !G.script.library[st.frQueue[0]]) st.frQueue.shift();
    if (st.frQueue && st.frQueue.length) { _dlg(st.frQueue.shift()); return true; }
    const m = world.map;
    // урок
    if (G.academy.lessonNow() && G.academy.inClass()) { G.academy.start(world); return true; }
    if (v.makeup) { (st.makeupQ = st.makeupQ || []).push(v.makeup); v.makeup = 0; }   // старые сохранения
    if (st.makeupQ && st.makeupQ.length && v.min >= 13 * _H && v.min < 18 * _H && m && m.outdoor === false && G.academy.inClass()) {
      const d = st.makeupQ.shift(), p = G.academy.plan(d);
      if (p.learn && !f['tech_' + p.learn]) { f['tech_' + p.learn] = 1; G.game.note('Изучена техника: ' + G.TECHS[p.learn].name); _say([{ who: 'iruka', text: _fmt(`{name}, ты пропустил урок. Ладно, объясню после уроков: техника «${G.TECHS[p.learn].name}».`) }, { text: 'Ты выучил технику, но Ирука вздыхает.' }]); return true; }
      if (p.learnFlag && !f[p.learnFlag]) { f[p.learnFlag] = 1; _say([{ who: 'iruka', text: _fmt('{name}, ты пропустил урок. Ладно, объясню после уроков хождение по дереву.') }, { text: 'Теперь можно тренировать хождение по дереву, но Ирука вздыхает.' }]); return true; }
    }
    // события находят героя сами
    for (const e of G.STORY) {
      if (f['st_' + e.id] || v.day < e.day || (v.day > e.day && !e.must)) continue;
      if (e.after && !f['st_' + e.after]) continue;
      const late = v.day > e.day;   // обязательное событие пропущено (проспал) — случится при первой возможности
      if (!late && (v.min < e.from || v.min >= e.to)) continue;
      if (late && v.min < (e.from >= 20 * _H ? e.from : 7 * _H)) continue;
      if (e.where === 'out' && !(m && m.outdoor)) continue;
      f['st_' + e.id] = 1;
      if (e.place) {   // перенос на место события
        const K = G.world.konoha(), T = G.CONFIG.TILE;
        if (e.place === 'forest') { if (m.id !== 'konoha' || Math.hypot(world.player.x - 10 * T, world.player.y - 116 * T) > 200) world.setMap({ map: 'konoha', x: 10 * T + 8, y: 117 * T + 8, dir: 'up' }); }
        else { const b = K.landmarks[e.place]; if (b && b.interior && m.id !== b.interior.id) world.setMap({ map: b.interior.id, entry: true }); }
      }
      if (G.cine && G.cine.defs[e.script]) G.cine.play(e.script, world, () => world.refreshNpcs && world.refreshNpcs()); else _dlg(e.script);
      return true;
    }
    // пропущенный обязательный сюжет (если проспал): турнир/экзамен — переносится на следующее утро
    return false;
  },
  // ── турнир академии: 3 боя на вылет ──
  tournament() {
    const v = G.state.vars;
    // третий элемент — id друга для бонуса (у турнирного Кибы боевой id другой: kiba_t)
    const rounds = [['choji', 'Первый круг: Чоджи Акимичи!', 'choji'], ['kiba_t', 'Полуфинал: Киба Инузука!', 'kiba'], ['sasuke', 'ФИНАЛ: Саске Учиха!', 'sasuke']];
    let r = 0;
    const next = () => {
      if (r >= rounds.length) { v.tourney = 4; return end(); }
      const [en, title, fid] = rounds[r];
      _say([{ who: 'iruka', text: title }], () => {
        G.flow.battle({ enemy: en, mode: 'ringout', terrain: 'ring', story: r === 2, storyLine: 'Я не проиграю! Не здесь!', onEnd: (res) => {
          G.state.vars.hp = 100;
          if (res.win) { r++; G.friends.add(fid, 1); next(); } else { v.tourney = r + 1; end(); }
        } }, _world());
      });
    };
    const end = () => {
      const place = v.tourney;
      const prize = { 4: [300, 'Чемпион Академии', 5], 3: [150, 'Финалист', 3], 2: [80, 'Полуфиналист', 0], 1: [30, 'Участник турнира', 0] }[place];
      G.game.earn(prize[0]); v.pouch_plus = (v.pouch_plus || 0) + prize[2]; v.title_t = place;
      if (place === 4) { v.rival = (v.rival || 0) + 2; v.rep = (v.rep || 0) + 5; }
      G.game.advanceTo('16:00');
      _dlg(place === 4 ? 'st_tourney_win' : 'st_tourney_lose', () => {

  function ask(out, q, right, wrong, lab) {
    const opts = shuffle([[right, 1], ...wrong.map((w) => [w, 0])]);

      shuffle(TEST.slice()).slice(0, 5).forEach((t, i) => { ask(out, `Вопрос ${i + 1}. ${t[0]}`, t[1], t[2], 't' + i + id); out.push('set var.lqn += 1'); });

    const topic = list[(week + (day % 5)) % list.length], test = (day - 1) % 7 === 4;
    const L = lectureText(sub, topic, test);
    G.script.parse(L.src);
    // герой садится на своё место
    const room = world.map, seat = room && room.seats && room.seats.hero;

    G.dialog.start(L.id, { bottom: 22, onEnd: () => {
      const v = V(), n = v.lqn || 0, ratio = n ? (v.lq || 0) / n : null;
      next(ratio, test);

})();


// ===== systems/cine.js =====
// Катсцены: актёры сами идут по деревне, камера следует за ними, герой замирает, сверху и снизу — чёрные полосы.
// Определение: G.cine.defs[id] = (world) => [шаги]; позиции — в клетках относительно героя.
//   { spawn:'k', id:'naruto', at:[dx,dy], dir }   { walk:'k', to:[dx,dy], speed, par:true }   { say:'script_id' }
//   { wait: сек }   { emote:'k', ch:'!' }   { face:'k', dir }   { cam:'k'|'player' }   { hero:'dir' }   { flag:'name' }
G.cine = (() => {
  const T = 16;
  const defs = {};
  let C = null;

  const walkable = (w, tx, ty) => w.npcWalk(tx, ty);
  function nearWalk(w, tx, ty) {
    if (walkable(w, tx, ty)) return [tx, ty];
    for (let r = 1; r <= 8; r++) for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) if (Math.max(Math.abs(a), Math.abs(b)) === r && walkable(w, tx + a, ty + b)) return [tx + a, ty + b];
    return [tx, ty];
  }
  function bfs(w, sx, sy, tx, ty) {
    const key = (x, y) => x * 4096 + y, prev = new Map([[key(sx, sy), null]]), q = [[sx, sy]];
    for (let i = 0; i < q.length && i < 5000; i++) {
      const [x, y] = q[i];
      if (x === tx && y === ty) break;
      for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + a, ny = y + b, k = key(nx, ny);
        if (prev.has(k) || !walkable(w, nx, ny) || Math.abs(nx - sx) > 40 || Math.abs(ny - sy) > 40) continue;
        prev.set(k, [x, y]); q.push([nx, ny]);
      }
    }
    if (!prev.has(key(tx, ty))) return null;
    const path = []; let t = [tx, ty];
    while (t && !(t[0] === sx && t[1] === sy)) { path.unshift(t); t = prev.get(key(t[0], t[1])); }
    return path;
  }
  function play(id, world, onEnd) {
    const def = defs[id]; if (!def || C) return false;
    const steps = def(world);
    C = { id, world, steps, i: -1, t: 0, actors: {}, wait: null, bars: 0, running: [], onEnd, cam: null, camPos: null };
    world.cine = C;
    return true;
  }
  const hero = () => C.world.player;
  function tilePos(dx, dy) {
    const p = hero(), w = C.world;
    return nearWalk(w, Math.floor(p.x / T) + dx, Math.floor(p.y / T) + dy);
  }
  function next() {
    C.i++;
    if (C.i >= C.steps.length) return finish();
    const s = C.steps[C.i], w = C.world;
    if (s.spawn) {
      const [tx, ty] = tilePos(s.at[0], s.at[1]);
      const a = G.world.makeNpc({ id: s.id, name: s.name, x: tx * T + 8, y: ty * T + 12, dir: s.dir || 'down', ai: 'none' });
      a._cine = 1; C.actors[s.spawn] = a; w.npcs.push(a); w.others.push(a);
      return next();
    }
    if (s.walk) {
      const a = C.actors[s.walk], tx0 = Math.floor(a.x / T), ty0 = Math.floor(a.y / T);
      const [tx, ty] = tilePos(s.to[0], s.to[1]);
      const path = bfs(w, tx0, ty0, tx, ty) || [[tx, ty]];
      const job = { a, path, speed: s.speed || 40 };
      if (s.par) { C.running.push(job); return next(); }
      C.running.push(job); C.wait = { walk: job }; return;
    }
    if (s.say) { C.wait = { say: true }; G.dialog.start(s.say, { bottom: 22, onEnd: () => { C.wait = null; } }); return; }
    if (s.wait) { C.wait = { t: s.wait }; return; }
    if (s.emote) { const a = C.actors[s.emote]; a._em = { t: 1.6, cd: 99, ch: s.ch || '!' }; return next(); }
    if (s.face) { C.actors[s.face].dir = s.dir; return next(); }
    if (s.hero) { hero().dir = s.hero; return next(); }
    if (s.cam) { C.cam = s.cam === 'player' ? null : C.actors[s.cam]; return next(); }
    if (s.flag) { G.state.flags[s.flag] = 1; return next(); }
    if (s.sfx) { const f = G.audio.sfx[s.sfx]; f && f(); return next(); }
    return next();
  }
  function finish() {
    const w = C.world;
    w.npcs = w.npcs.filter((n) => !n._cine); w.others = w.others.filter((n) => !n._cine);
    w.cine = null; const cb = C.onEnd; C = null;
    w.updateCamera(); w.camPos = null;
    cb && cb();
  }
  function update(world, dt) {
    if (!C) return;
    C.bars = Math.min(1, C.bars + dt * 3);
    // движение актёров
    for (const j of C.running) {
      const a = j.a;
      if (!j.path.length) { a.moving = false; a.anim = 0; j.done = true; continue; }
      const [tx, ty] = j.path[0], px = tx * T + 8, py = ty * T + 12, dx = px - a.x, dy = py - a.y;
      if (Math.abs(dx) < 1.2 && Math.abs(dy) < 1.2) { j.path.shift(); continue; }
      const ax = Math.abs(dx) > 1.2, st = Math.min(j.speed * dt, ax ? Math.abs(dx) : Math.abs(dy));
      if (ax) { a.x += Math.sign(dx) * st; a.dir = dx > 0 ? 'right' : 'left'; } else { a.y += Math.sign(dy) * st; a.dir = dy > 0 ? 'down' : 'up'; }
      a.moving = true; a.anim += dt * (j.speed > 50 ? 10 : 6);
    }
    C.running = C.running.filter((j) => !j.done);
    for (const a of Object.values(C.actors)) if (a._em && a._em.t > 0) a._em.t -= dt;
    const w = C.wait;
    if (!w) return next();
    if (w.t != null) { w.t -= dt; if (w.t <= 0) { C.wait = null; next(); } }
    else if (w.walk) { if (w.walk.done) { C.wait = null; next(); } }
    else if (w.say && !C.wait) next();
  }
  // положение камеры (мягко едет за целью)
  function camTarget() {
    if (!C || !C.cam) return null;
    return { x: C.cam.x, y: C.cam.y };
  }
  function drawBars(ctx, HUD_H, VH, W) {
    if (!C) return;
    const bh = Math.round(C.bars * 16);
    ctx.fillStyle = '#000'; ctx.fillRect(0, HUD_H, W, bh); ctx.fillRect(0, HUD_H + VH - bh, W, bh);
  }
  return { defs, play, update, camTarget, drawBars, get active() { return !!C; } };
})();

G.outdoor = {
  // кусты трав (клетки карты; freeTile найдёт ближайшее свободное место)
  HERBS: [[28, 27], [46, 40], [19, 47], [9, 66], [8, 90], [22, 104], [30, 118], [118, 116], [131, 114], [60, 121], [92, 119], [96, 24], [88, 28], [150, 64], [140, 90], [56, 30]],
  LOTUS: [[145, 97], [136, 101], [154, 101]],
  REGROW: 3,      // дней до нового урожая
  FISH_DAY: 6,    // забросов в день
  SELL: 0.5,      // доля цены при продаже

  addHerbs(m) {
    const T = G.CONFIG.TILE;
    const put = (list, rare, base) => list.forEach(([tx, ty], k) => {
      const p = G.world.freeTile(m, tx, ty, true); if (!p) return;
      const i = base + k;
      const o = m.addObject(rare ? 'herb_blue' : 'herb', p[0] * T + 8, p[1] * T + 13, { talk: 'herb_' + i });
      o.herb = i; o.rare = rare;
    });
    put(this.HERBS, false, 0); put(this.LOTUS, true, 100);
    this.refresh(m);
  },
  ready(i) { const d = G.state.vars['herb_' + i]; return !d || G.state.vars.day - d >= this.REGROW; },
  refresh(m) {
    if (!m) return;
    for (const o of m.objects) if (o.herb != null) o.img = G.tiles.object(this.ready(o.herb) ? (o.rare ? 'herb_blue' : 'herb') : 'herb_cut').img;
  },
  pick(i, world) {
    const v = G.state.vars, rare = i >= 100;
    if (!this.ready(i)) return world.talk([{ text: `Здесь всё уже собрано. Трава отрастёт через ${this.REGROW - (v.day - v['herb_' + i])} дн.` }]);
    v['herb_' + i] = v.day; v.herbs = (v.herbs || 0) + 1;
    const got = [];
    if (rare) { G.game.give('herb_blue', 1); got.push('Голубой лотос'); }
    else {
      const n = 1 + (Math.random() < 0.45 ? 1 : 0) + (G.hero.has('eagle_eye') && Math.random() < 0.35 ? 1 : 0);
      G.game.give('herb', n); got.push('Лечебная трава ×' + n);
      if (Math.random() < 0.3) { G.game.give('berries', 2); got.push('ягоды ×2'); }
    }
    G.game.advance(5); G.train.addXp('know', 0.6);
    G.audio.sfx.confirm();
    this.refresh(G.world.get('konoha'));
    world.talk([{ text: (rare ? 'Ты осторожно срываешь цветок у самой воды. ' : 'Ты собираешь травы. ') + 'Получено: ' + got.join(', ') + '.' }]);
  },

  // ── рыбалка ──
  isWater(m, x, y) { const T = G.CONFIG.TILE; return m.outdoor && m.get(Math.floor(x / T), Math.floor(y / T)) === G.tiles.ID.WATER; },
  spotKind(m, x, y) {
    const T = G.CONFIG.TILE, d = m.districtAt(Math.floor(x / T), Math.floor(y / T));
    if (d && /lake|озер/i.test((d.type || '') + (d.name || ''))) return 'lake';
    return Math.hypot(x / T - 142, y / T - 100) < 14 ? 'lake' : 'river';
  },
  TABLE: {
    lake:  [['fish', 58], ['eel', 12], ['carp', 7], ['boot', 18], ['herb_blue', 5]],
    river: [['fish', 55], ['eel', 18], ['carp', 4], ['boot', 23]],
  },
  STRENGTH: { fish: 1, eel: 1.35, carp: 1.8, boot: 0.5, herb_blue: 0.6 },
  rollCatch(spot) {
    const t = G.state.vars.min % 1440, dusk = (t >= 5 * 60 && t < 8 * 60) || (t >= 17 * 60 && t < 20 * 60);
    const tab = this.TABLE[spot].map(([id, w]) => [id, (id === 'carp' || id === 'eel') && dusk ? w * 2 : id === 'fish' && G.life.raining() ? w * 1.3 : w]);
    let r = Math.random() * tab.reduce((a, x) => a + x[1], 0);
    for (const [id, w] of tab) { r -= w; if (r <= 0) return id; }
    return 'fish';
  },
  fish(world, spot) {
    const v = G.state.vars, d = G.state.daily;
    if (!G.game.count('fishing_rod')) return world.talk([{ text: 'Вода прозрачная, видно рыбу. Была бы удочка... (сувенирная лавка, 80 рё)' }]);
    if ((d.fish || 0) >= this.FISH_DAY) return world.talk([{ text: 'Рыба больше не клюёт. Приходи завтра.' }]);
    if (v.energy < 5) return world.talk([{ text: 'Ты слишком устал даже для рыбалки.' }]);
    G.scenes.push(G.scenes.make('fishing', { spot, left: () => this.FISH_DAY - (G.state.daily.fish || 0) }, (id) => {
      d.fish = (d.fish || 0) + 1; G.game.advance(20); v.energy = Math.max(0, v.energy - 3);
      if (id) { G.game.give(id, 1); v.fished = (v.fished || 0) + 1; if (id === 'carp') G.game.note('Поймал золотого карпа!'); G.train.addXp('ctrl', 0.5); }
    }, () => { world.softRefresh && world.softRefresh(); }));
  },

  // ── продажа ──
  sellPrice(id) { return Math.max(1, Math.round(G.ITEMS[id].price * this.SELL)); },
  sellMenu(n, world, done) {
    const shop = G.SHOPS[n.shop];
    const ids = shop.buys.filter((id) => G.game.count(id) > 0);
    if (!ids.length) { world.talk([{ who: shop.keeper.who, name: shop.keeper.name, text: 'Мне нечего у тебя купить.' }]); return; }
    const opts = ids.map((id) => ({ label: G.ITEMS[id].name, sub: `x${G.game.count(id)} · ${this.sellPrice(id)} рё`, desc: 'A — продать одну штуку.', id }));
    G.scenes.push(G.scenes.make('pick', { title: 'Продать: ' + (n.name || G.chars.nameOf(n.id)), text: `У тебя ${G.state.vars.money} рё`, options: opts }, (i) => {
      if (i < 0) return done && done();
      const id = opts[i].id, pr = this.sellPrice(id);
      G.game.give(id, -1); G.game.earn(pr); G.audio.sfx.confirm();
      this.sellMenu(n, world, done);
    }));
  },

  // ── сундук ──
  chest() { return G.state.chest || (G.state.chest = {}); },
  chestMenu(world) {
    const opts = [{ label: 'Хранилище', desc: 'Сложить вещи из сумки или забрать.' }, { label: 'Мамины письма', desc: 'Самое дорогое, что осталось.' }, { label: 'Закрыть' }];
    G.scenes.push(G.scenes.make('pick', { title: 'Сундук', options: opts }, (i) => {
      if (i === 0) G.scenes.push(G.scenes.make('storage'));
      else if (i === 1) world.talk([{ text: '«Мой маленький шиноби. Когда ты прочтёшь это, ты уже будешь в Академии...»' }, { text: 'Ты аккуратно складываешь письмо обратно, рядом с папиным протектором.' }]);
    }));
  },

  // ── травничество (стол дома) ──
  RECIPES: [
    { id: 'ointment', label: 'Мазь', need: { herb: 3 }, min: 30 },
    { id: 'herb_tea', label: 'Травяной чай', need: { herb: 2 }, min: 20 },
    { id: 'chakra_pill', label: 'Пилюля чакры', need: { herb: 2, herb_blue: 1 }, min: 45 },
    { id: 'bandage', label: 'Бинты с травой ×2', n: 2, need: { herb: 1 }, min: 15 },
  ],
  craftMenu(world) {
    const opts = this.RECIPES.map((r) => {
      const miss = Object.entries(r.need).filter(([k, n]) => G.game.count(k) < n);
      return { label: r.label, sub: r.min + ' мин', desc: 'Нужно: ' + Object.entries(r.need).map(([k, n]) => `${G.ITEMS[k].name} ×${n}`).join(', '), off: miss.length ? 'Не хватает: ' + miss.map(([k, n]) => `${G.ITEMS[k].name} (${G.game.count(k)}/${n})`).join(', ') : null };
    });
    G.scenes.push(G.scenes.make('pick', { title: 'Травничество', text: 'Травы растут в лесу Нара, у водопада, озера и на окраинах.', options: opts }, (i) => {
      if (i < 0) return;
      const r = this.RECIPES[i];
      for (const [k, n] of Object.entries(r.need)) G.game.give(k, -n);
      G.game.give(r.id, r.n || 1); G.game.advance(r.min); G.train.addXp('know', 1.5);
      G.audio.sfx.confirm();
      world.talk([{ text: `Готово: ${G.ITEMS[r.id].name}${r.n ? ' ×' + r.n : ''}.` }]);
    }));
  },
};

// Симулятор баланса (этап 10): бои без отрисовки, бот с «мастерством» 0..1, модель роста характеристик,
// экономика недели. Запуск: tools/balance.py (Playwright) → BALANCE.md. В игре не используется.
G.sim = {
  // ── стартовые сборки (12 очков поверх базовых 3, максимум 7) ──
  BUILDS: {
    tai: { name: 'Тайдзюцу', add: { tai: 4, spd: 2, end: 3, chakra: 1, ctrl: 1, nin: 1 }, skills: ['tough', 'grit'], focus: ['dummy', 'throw', 'log', 'run'] },
    nin: { name: 'Ниндзюцу', add: { nin: 4, chakra: 2, ctrl: 3, gen: 1, spd: 1, end: 1 }, skills: ['fast_hands', 'big_chakra'], focus: ['seals', 'falls', 'meditate', 'tree'] },
    gen: { name: 'Гендзюцу', add: { gen: 4, know: 3, ctrl: 1, chakra: 1, spd: 2, end: 1 }, skills: ['analyst', 'eagle_eye'], focus: ['stealth', 'library', 'meditate', 'seals'] },
    bal: { name: 'Универсал', add: { tai: 2, nin: 1, gen: 1, chakra: 2, ctrl: 2, spd: 2, end: 1, know: 1 }, skills: ['diligent', 'analyst'], focus: ['dummy', 'seals', 'run', 'meditate', 'library', 'throw'] },
  },
  LESSON_XP: [{ know: 6 }, { tai: 4, spd: 3 }, { nin: 5, ctrl: 2 }, { tai: 6, end: 2 }, { chakra: 4, ctrl: 3 }],
  startStats(b) { const s = {}; for (const st of G.STATS) s[st.id] = G.STAT_BASE + (this.BUILDS[b].add[st.id] || 0); return s; },

  // ── модель роста: средний игрок (оценки ~75%, 3 тренировки в будни, 5 в выходные, раз в день — с другом) ──
  growth(b, upto = 54, o = {}) {
    const B = this.BUILDS[b], s = this.startStats(b), xp = {}, cap = G.STAT_CAP, perDay = o.perDay || [2, 4], score = o.score ?? 0.75;
    const need = (st) => G.train.needAt(s[st]);
    const add = (st, n) => { xp[st] = (xp[st] || 0) + n; while (s[st] < cap && xp[st] >= need(st)) { xp[st] -= need(st); s[st]++; } };
    const dil = B.skills.includes('diligent') ? 1.25 : 1;
    const snaps = {};
    for (let d = 1; d <= upto; d++) {
      const wd = (d - 1) % 7, school = d >= 2 && d < 54 && wd < 5 && d !== 26 && d !== 38;
      if (school) for (const [k, n] of Object.entries(this.LESSON_XP[wd])) add(k, n * (0.5 + score));
      const n = d === 1 ? 0 : perDay[school ? 0 : 1];
      const pool = B.focus.filter((t) => t !== 'tree' || d >= 29);
      const count = {};
      for (let i = 0; i < n; i++) {
        const id = pool[i % pool.length]; const rep = count[id] = (count[id] || 0) + 1;
        let m = [1, 0.7, 0.45, 0.3][Math.min(3, rep - 1)] * dil * (i === 0 ? 1.5 : 1) * (0.35 + 0.65 * score);
        for (const [k, base] of Object.entries(G.TRAININGS[id].stats)) add(k, base * m);
      }
      if ([1, 3, 14, 18, 26, 38, 47, 54].includes(d)) snaps[d] = Object.assign({}, s);
    }
    return snaps;
  },
  techsAt(d) { const t = []; if (d >= 8) t.push('kawarimi'); if (d >= 15) t.push('henge'); if (d >= 17) t.push('fear'); if (d >= 43) t.push('bunshin'); if (d >= 20) t.push('fuuton'); if (d >= 24) t.push('katon'); return t; },
  combosAt(d) { const c = []; if (d >= 18) c.push('air'); if (d >= 40) c.push('whirl'); return c; },
  invAt(d) { return d < 14 ? { kunai: 6, shuriken: 8, bandage: 2, smoke_bomb: 1, wire: 1 } : d < 38 ? { kunai: 8, shuriken: 10, bandage: 3, smoke_bomb: 1, flash_bomb: 1, wire: 2, chakra_pill: 1 } : { kunai: 10, shuriken: 12, bandage: 3, smoke_bomb: 2, flash_bomb: 1, wire: 2, chakra_pill: 2, tag_explosive: 2 }; },

  // ── один бой ──
  battle(cfg) {
    const snap = JSON.stringify(G.state), st = G.state;
    const sndOld = G.audio.enabled; G.audio.enabled = false;
    const slowOld = G.storage.settings.reactSlow; G.storage.settings.reactSlow = !!cfg.slow;
    let out;
    try {
      st.hero.stats = Object.assign({}, cfg.stats); st.hero.skills = (cfg.skills || []).slice();
      for (const k of Object.keys(st.flags)) if (/^(tech_|combo_)/.test(k)) delete st.flags[k];
      for (const t of cfg.techs || []) { st.flags['tech_' + t] = 1; st.vars['use_' + t] = cfg.uses || 0; }
      for (const c of cfg.combos || []) st.flags['combo_' + c] = 1;
      st.flags.tactic = cfg.tactic ? 1 : 0;
      st.inv = Object.assign({}, cfg.inv || {}); st.vars.day = cfg.day || 1; st.vars.hp = 100; st.vars.chakra = 100;
      let res = null;
      const S = G.scenes.make('battle', { enemy: cfg.enemy, mode: cfg.mode || 'ko', terrain: cfg.terrain || 'field', turns: cfg.turns, story: cfg.story, allies: cfg.allies, will: cfg.will }, (r) => { res = r; });
      const log = cfg.log ? S.sim.startLog() : null;
      S.enter();
      let it = 0, turns = 0;
      const sk = cfg.skill ?? 0.65, R = Math.random;
      while (it++ < 40000) {
        const s = S.state;
        if (s === 'end') { res = S.sim.result(); break; }
        if (s === 'menu') { turns++; if (!this.decide(S, cfg)) S.sim.press('misc', 'Защита'); }
        else if (s === 'rhythm') { const x = R(); S.sim.rhythm(x < 0.05 + 0.5 * sk ? 'crit' : x < 0.45 + 0.45 * sk ? 'ok' : 'weak'); }
        else if (s === 'seals') { const x = R(), c = S.P.ctrl * 0.02; S.sim.seals(x < 0.08 + 0.55 * sk + c ? 'perfect' : x < 0.7 + 0.28 * sk + c ? 'ok' : 'fail'); }
        else if (s === 'react') this.react(S, sk);
        else if (s === 'target') S.sim.target(R() < (cfg.skills || []).includes('analyst') ? 0.6 : 0.34);
        else if (s === 'moment') S.sim.moment();
        S.update(0.1);
      }
      const P = S.P, E = S.E;
      out = { win: !!(res && res.win), ringout: !!(res && res.ringout), timeout: !res, turns, hp: Math.max(0, P.hp) / P.hpMax, log, ehp: Math.max(0, E.hp) / E.hpMax };
    } finally {
      const back = JSON.parse(snap);
      for (const k of Object.keys(G.state)) delete G.state[k];
      Object.assign(G.state, back);
      G.audio.enabled = sndOld; G.storage.settings.reactSlow = slowOld;
    }
    return out;
  },
  react(S, sk) {
    const R = Math.random, info = S.sim.reactInfo() || { dmg: 5 };
    if (R() < (1 - sk) * 0.35) return S.sim.react('none');                       // не успел
    if (info.kawa && info.dmg >= 8 && R() < 0.6) return S.sim.react(R() < 0.4 + 0.5 * sk ? 'kawa_ok' : 'kawa_fail');
    if (S.P.br >= 1 && info.dmg >= 6 && R() < 0.55) return S.sim.react('block');
    return S.sim.react('dodge');
  },
  // политика бота: true — действие выбрано
  decide(S, cfg) {
    const P = S.P, E = S.E, sim = S.sim, d = sim.dist(), b = cfg.build || 'bal', R = Math.random, mode = S.opts.mode;
    const can = (m, l) => { const x = sim.buttons(m).find((y) => y.label === l); return x && !x.off; };
    const tryP = (m, l) => can(m, l) && sim.press(m, l);
    const tech = (id) => G.combat.knows(id) && tryP('tech', G.TECHS[id].name);
    if (sim.menu() === 'momentPick') return sim.press('momentPick', 'Финал. комбо');
    if (P.will >= 100 && tryP('misc', 'Воля Огня!')) return true;
    if ((mode === 'bells' || mode === 'scroll') && d <= 1 && (E.s.stun || E.s.blind || E.s.bound || E.s.fear || R() < 0.3) && tryP('misc', mode === 'bells' ? 'Колокольчик' : 'Свиток')) return true;
    if (P.hp < P.hpMax * 0.35 && R() < 0.8 && tryP('tool', 'Бинт')) return true;
    if (P.ch < P.chMax * 0.2 && tryP('tool', 'Пилюля')) return true;
    if (!P.clones && R() < (b === 'nin' ? 0.45 : 0.2) && tech('bunshin')) return true;
    if (d <= 3 && R() < (b === 'nin' ? 0.55 : b === 'bal' ? 0.25 : 0.08) && (tech('katon') || tech('fuuton') || tech('suiton') || tech('raiton'))) return true;
    if (!E.s.fear && R() < (b === 'gen' ? 0.4 : 0.12) && tech('fear')) return true;
    if (!P.s.hidden && d >= 2 && R() < (b === 'nin' ? 0.4 : b === 'gen' ? 0.25 : 0.06) && tech('henge')) return true;
    if ((mode === 'bells' || mode === 'scroll') && d <= 2 && !E.s.blind && R() < 0.45 && (tryP('tool', 'Вспышка') || tryP('tool', 'Дым. бомба'))) return true;
    if (d <= 2 && R() < 0.08 && tryP('tool', 'Взрыв. печать')) return true;
    // ниндзюцу-игрок разрывает дистанцию, чтобы спрятаться в Хенге и ударить из засады
    if (b === 'nin' && d <= 1 && !P.s.hidden && P.ch >= 8 && G.combat.knows('henge') && R() < 0.4 && (tryP('move', 'Отскок') || tryP('move', 'Назад'))) return true;
    if (d <= 1) {
      if (P.br >= 3) for (const c of ['Вихрь Листа', 'Воздушное комбо', 'Связка Академии']) if (R() < 0.7 && tryP('tai', c)) return true;
      if (P.br >= 1) { const seqs = [['punch', 'kick', 'sweep'], ['sweep', 'upper', 'punch'], ['punch', 'punch', 'kick'], ['kick', 'punch', 'upper']]; S.act('tai', seqs[Math.floor(R() * seqs.length)].slice(0, Math.min(3, P.br))); return true; }
      return tryP('misc', 'Защита');
    }
    if (R() < (b === 'tai' ? 0.22 : 0.4) && tryP('throw', R() < 0.5 ? 'Кунай' : 'Сюрикен')) return true;
    if (d >= 3 && P.br >= 1 && R() < 0.5 && tryP('move', 'Рывок')) return true;
    if (P.ch < P.chMax * 0.4 && R() < 0.3 && tryP('misc', 'Концентр.')) return true;
    return tryP('move', 'Вперёд') || tryP('misc', 'Защита');
  },

  // ── сценарии сюжета: кто, когда, на каких условиях ──
  SCEN: [
    { id: 'kiba_d3', day: 3, enemy: 'kiba', mode: 'spar', terrain: 'yard', label: 'Киба, спарринг (д.3)' },
    { id: 'dummy2_d8', day: 8, enemy: 'dummy2', mode: 'spar', terrain: 'yard', label: 'Кусачий манекен (д.8)' },
    { id: 'bully_d12', day: 12, enemy: 'bully', mode: 'ko', terrain: 'street', label: 'Хулиган, событие (д.12)' },
    { id: 'dog_d12', day: 12, enemy: 'dog', mode: 'ko', terrain: 'street', label: 'Бродячий пёс (д.12)' },
    { id: 'naruto_d14', day: 14, enemy: 'naruto', mode: 'spar', terrain: 'yard', label: 'Наруто, урок (д.14)' },
    { id: 'lee_d18', day: 18, enemy: 'lee', mode: 'spar', terrain: 'field', label: 'Рок Ли (д.18)' },
    { id: 'choji_d26', day: 26, enemy: 'choji', mode: 'ringout', terrain: 'ring', label: 'Турнир: Чоджи (д.26)' },
    { id: 'kiba_d26', day: 26, enemy: 'kiba_t', mode: 'ringout', terrain: 'ring', label: 'Турнир: Киба (д.26)' },
    { id: 'sasuke_d26', day: 26, enemy: 'sasuke', mode: 'ringout', terrain: 'ring', story: true, label: 'Турнир: Саске (д.26)' },
    { id: 'bully_d33', day: 33, enemy: 'bully', mode: 'ko', terrain: 'street', label: 'Хулиган, событие (д.33)' },
    { id: 'thief_d30', day: 30, enemy: 'thief', mode: 'ko', terrain: 'night', label: 'Ночной вор (д.30)' },
    { id: 'senior_d38', day: 38, enemy: 'senior', mode: 'scroll', terrain: 'forest', turns: 12, label: 'Полевой выход: свиток (д.38)' },
    { id: 'iruka_d47', day: 47, enemy: 'iruka', mode: 'bells', terrain: 'yard', turns: 10, label: 'Колокольчики Ируки (д.47)' },
    { id: 'mizuki_d54', day: 54, enemy: 'mizuki', mode: 'ko', terrain: 'night', story: true, allies: ['iruka', 'naruto'], will: 30, label: 'ФИНАЛ: Мизуки (д.54)' },
  ],
  run(scId, build, skill, n = 20, statsDay = null) {
    const sc = this.SCEN.find((x) => x.id === scId), B = this.BUILDS[build];
    const g = this.growth(build, 54);
    const dd = statsDay || sc.day, key = Object.keys(g).map(Number).filter((k) => k <= dd).pop();
    const stats = g[key];
    const cfg = Object.assign({}, sc, { stats, skills: B.skills, build, skill, techs: this.techsAt(sc.day), combos: this.combosAt(sc.day), inv: this.invAt(sc.day), uses: Math.max(0, Math.round((sc.day - 8) * 0.5)) });
    let w = 0, turns = 0, hp = 0, ehp = 0, ro = 0, to = 0;
    for (let i = 0; i < n; i++) { const r = this.battle(cfg); if (r.win) { w++; hp += r.hp; } turns += r.turns; ehp += r.ehp; if (r.ringout) ro++; if (r.timeout) to++; }
    return { sc: scId, label: sc.label, build, skill, n, win: w / n, turns: turns / n, hpLeft: w ? hp / w : 0, enemyLeft: ehp / n, ringout: ro, timeout: to, stats };
  },

  // ── экономика: оценка средней недели ──
  economy() {
    const jobs = Object.values(G.JOBS), avgJob = jobs.reduce((a, j) => a + j.pay, 0) / jobs.length;
    const I = G.ITEMS;
    return {
      avgJob: Math.round(avgJob), jobScore: 0.8, jobPay: Math.round(avgJob * (0.4 + 0.6 * 0.8)),
      ramen: I.ramen_miso.price, foodPerDay: 6 * 16, riceFree: 2 * 25,
      fishSell: G.outdoor.sellPrice('fish'), carpSell: G.outdoor.sellPrice('carp'), herbSell: G.outdoor.sellPrice('herb'),
      kunai: I.kunai.price, bandage: I.bandage.price, pill: I.chakra_pill.price, rod: I.fishing_rod.price,
    };
  },
};

// ===== data/dialogs.js =====
// Диалоги и сюжет первого дня (Этап 3). Формат — см. systems/script.js.
// Сюжет дня 1: дом → Академия (Ирука) → Наруто у качелей → Ичираку → домой спать.
// Флаги: enrolled, naruto_invited, ramen_done, treated_naruto. Цели: G.game.GOALS.
G.script.parse(`
=== intro_name_confirm
iruka: Значит, тебя зовут {name}?
?
* Да, верно! -> yes
* Нет, ошибся. -> no
# yes
set flag.name_ok = 1
iruka: Добро пожаловать в Коноху, {name}! Я Умино Ирука, учитель Академии.
iruka: Завтра утром зайди ко мне в класс — оформим зачисление.
end
# no
set flag.name_ok = 0
iruka: Ничего страшного. Давай ещё раз.
end

=== confirm_new
: Начать новую игру? Текущее сохранение будет стёрто.
* Да, начать заново -> yes
* Нет -> no
# yes
set flag._confirm = 1
end
# no
set flag._confirm = 0
end

// ───────────── Утро ─────────────
=== home_wake
: Ты дома. Маленькая комната, татами, запах свежего дерева.
: Двенадцать лет ты прожил на дальнем посту. И вот — снова Коноха.
: Крестовина — ходить, B — бежать, A — говорить и осматривать. Дверь внизу ведёт на улицу.
: Внизу экрана — текущая цель, стрелка у края экрана покажет путь. ЦЕЛЬ — «чутьё ниндзя»: след до цели.
: КАРТА — карта деревни, МЕНЮ — задания, сумка и сохранение.
call quest start day1
end

=== home_bed
if flag.mizuki_beaten -> normal
if flag.st_exam -> tense
# normal
if var.min >= 1080 -> late
: Твоя постель. Солнце ещё высоко — спать рано.
end
# tense
: Ты ложишься... и тут же садишься снова. Тревожное предчувствие не даёт уснуть: этот день ещё не закончился.
: Нужно дождаться вечера.
end
# late
? Лечь спать? Игра сохранится.
* Лечь спать -> yes
* Ещё не время -> no
# yes
call sleep
end
# no
end

=== day2_morning
if rain -> rainy
: Утро. Сквозь сёдзи пробивается солнце.
-> next
# rainy
: Утро. По крыше барабанит дождь.
# next
: Вчерашний день был длинным: Академия, Наруто, рамен у Теучи...
: С сегодняшнего дня ты живёшь по часам Конохи. Уроки — по будням с 8:00 до 13:00.
: Следи за сытостью и энергией: голодному и уставшему тяжело. Дома всегда можно сварить рис.
: После 23:00 ученикам нельзя на улицу — патрули отправят домой. А в 2 часа ночи ты просто уснёшь где стоишь.
end

// ───────────── Академия ─────────────
=== iruka_class
if flag.ramen_done -> after
if flag.enrolled -> again
call met iruka
iruka: А, {name}! Пришёл вовремя — хорошее начало.
iruka: Так... документы с поста, рекомендательное письмо... Всё в порядке.
iruka: Поздравляю! С сегодняшнего дня ты — ученик выпускного класса Академии Конохи.
iruka: До экзамена на генина восемь недель. Догнать остальных будет непросто, но я в тебя верю.
? Что ответишь?
* Я не подведу, сенсей! -> brave
* Восемь недель?.. Это мало. -> worry
# brave
set var.friend_iruka += 1
iruka: Вот это настрой! Так держать.
-> task
# worry
iruka: Мало — если сидеть сложа руки. А если тренироваться каждый день — хватит.
# task
set flag.enrolled = 1
iruka: Осталась формальность — вступительный тест. Покажи, в чём ты силён, а я решу, чему тебя учить.
call charcreate
end
# again
iruka: Наруто на качелях, у дерева к востоку от Академии. Передай про проверку печатей!
end
# after
iruka: Опоздаешь завтра — будешь мыть доску вместе с Наруто.
end

=== iruka_retest
iruka: {name}! Чуть не забыл: ты так и не прошёл вступительный тест. Давай прямо сейчас.
call charcreate
end

=== iruka_after_test
iruka: Хм, интересно! Теперь я знаю, с чего начинать твои тренировки.
if quest.day1.iruka -> first
end
# first
call step day1 iruka
call note Зачислен в Академию
iruka: Кстати, есть первое поручение. Наруто опять сбежал с урока.
iruka: Наверняка сидит на качелях у Академии. Найди его и скажи: завтра проверка печатей!
iruka: И ещё: на урок метания приходи со своими кунаями. Три штуки — в Оружейной на Главной улице.
call time 12:30
call quest start homework
end

=== shikamaru_class
if qdone.shogi -> friend
if flag.met_shikamaru -> again
call met shikamaru
shikamaru: Эх... Пришёл в класс в обеденный перерыв. Как же хлопотно.
shikamaru: Я Нара Шикамару. Здесь тихо и можно спать. Не шуми, ладно?
end
# again
shikamaru: Облака сегодня хорошие... Хотел бы я быть облаком.
? Сыграть партию?
* Давай -> play
* Потом -> skip
# play
shikamaru: Только быстро. Я ещё не доспал.
call train shogi shikamaru
end
# skip
shikamaru: Хорошо... можно и спать.
end
end
# friend
shikamaru: Ты ходишь, как в шоги: сначала думаешь, потом делаешь. Мне нравится.
end

// ===== world/buildgfx.js =====
// Спрайты зданий, нарисованные кодом по шаблону из G.BUILDINGS.
// Вид 3/4: снизу — фасад (стена с дверью и окнами), выше — крыша. Крыша выступает на OV пикселей
// над «пятном» здания, поэтому персонаж, стоящий позади, частично скрыт (тогда здание полупрозрачно).
G.buildgfx = (() => {
  const T = G.CONFIG.TILE;
  const P = G.PAL;
  const H = G.util.hash2;
  const cache = {};
  let glowList = null;   // окна текущего здания (для ночного свечения)
  let eaves = null;      // V9: линии карнизов текущего здания — под ними ляжет мягкая тень

  function px(c, x, y, col, w = 1, h = 1) { c.fillStyle = col; c.fillRect(x, y, w, h); }
  function shade(hex, k) { // k < 0 — темнее, k > 0 — светлее
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = (v) => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)));
    return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
  }

  // Маленькие значки на вывесках 7×7
  const ICONS = {
    ramen: ['.......', 'o.o.o..', '.......', 'ooooooo', 'oyyyyyo', '.ooooo.', '..ooo..'],
    kunai: ['......o', '.....oo', '....oo.', '...oo..', '.ooo...', '.oo....', 'o.o....'],
    cross: ['..ooo..', '..ooo..', 'ooooooo', 'ooooooo', 'ooooooo', '..ooo..', '..ooo..'],
    book: ['.......', 'ooo.ooo', 'oyo.oyo', 'oyo.oyo', 'oyo.oyo', 'ooooooo', '.......'],
    flower: ['..o.o..', '.ooooo.', 'oooyooo', '.ooooo.', '..o.o..', '...o...', '...o...'],
    paw: ['.o...o.', '.o.o.o.', '.......', '..ooo..', '.ooooo.', '.ooooo.', '..o.o..'],
    gift: ['..o.o..', '...o...', 'ooooooo', 'oyyoyyo', 'oyyoyyo', 'oyyoyyo', 'ooooooo'],
    dango: ['......o', '..oo.o.', '.oooo..', '.oooo..', 'o.oo...', '.o.....', 'o......'],
    tea: ['.......', '..o.o..', '.......', 'ooooo..', 'oyyyooo', 'oyyyo.o', '.ooo...'],
    meat: ['.......', '..ooo..', '.ooyoo.', 'ooyyyoo', '.ooooo.', 'o.....o', '.......'],
    coin: ['..ooo..', '.oyyyo.', 'oyo.oyo', 'oy...yo', 'oyo.oyo', '.oyyyo.', '..ooo..'],
    onsen: ['.o.o.o.', 'o.o.o..', '.o.o.o.', '.......', 'o.....o', 'o.....o', '.ooooo.'],
    leaf: ['...oo..', '..oooo.', '.ooyoo.', '.oyooo.', '.ooooo.', '..ooo..', '...o...'],
    fire: ['...o...', '.o.o.o.', '.o.o.o.', '...o...', '..ooo..', '.o...o.', 'o.....o'],
  };
  const TPL_ICON = {
    ichiraku: 'ramen', weapons: 'kunai', pharmacy: 'cross', books: 'book', flowers: 'flower',
    inuzuka_shop: 'paw', souvenir: 'gift', dango: 'dango', teahouse: 'tea', yakiniku: 'meat',
    shop_generic: 'coin', onsen: 'onsen', hospital: 'cross', library: 'book', market: 'coin',
  };
  function icon(c, name, x, y, col, col2 = '#ffffff') {
    const rows = ICONS[name]; if (!rows) return;
    rows.forEach((r, yy) => [...r].forEach((ch, xx) => { if (ch === 'o') px(c, x + xx, y + yy, col); else if (ch === 'y') px(c, x + xx, y + yy, col2); }));
  }

  // Кандзи «火» 11×11
  const KANJI_FIRE = [
    '.....o.....', '.o...o...o.', '.o...o...o.', 'o....o...o.', 'o...ooo....',
    '....o.o....', '...o...o...', '..o.....o..', '.o.......o.', 'o.........o', '...........',
  ];
  function kanji(c, x, y, col, scale = 1) {
    KANJI_FIRE.forEach((r, yy) => [...r].forEach((ch, xx) => { if (ch === 'o') px(c, x + xx * scale, y + yy * scale, col, scale, scale); }));
  }

  // Знак Учиха (веер) 9×11
  function uchihaFan(c, x, y) {
    const rows = ['..ooooo..', '.orrrrro.', 'orrrrrrro', 'orrrrrrro', 'owwwwwwwo', 'owwwwwwwo', '.owwwwwo.', '..ooooo..', '....o....', '....o....', '....o....'];
    rows.forEach((r, yy) => [...r].forEach((ch, xx) => { const col = { o: '#2a1e18', r: '#d83a2a', w: '#f4ecd8' }[ch]; if (col) px(c, x + xx, y + yy, col); }));
  }

  // ---------- Части здания ----------
  function roofGable(c, x, y, w, h, col) {
    const dk = shade(col, -0.35), lt = shade(col, 0.18);
    px(c, x, y, P.ink, w, h);
    px(c, x + 1, y + 1, col, w - 2, h - 2);
    for (let yy = y + 4; yy < y + h - 4; yy += 4) {
      px(c, x + 1, yy, dk, w - 2, 1);
      const off = ((yy - y) / 4) % 2 ? 3 : 0;
      for (let xx = x + 2 + off; xx < x + w - 2; xx += 6) {
        px(c, xx, yy - 3, lt, 1, 2);
        const k = H(xx, yy, w + h);
        if (k > 0.9) px(c, xx + 1, yy - 3, dk, 3, 2);                   // тёмная выгоревшая черепица
        else if (k < 0.07) px(c, xx + 1, yy - 2, shade(col, 0.3), 3, 2); // новая светлая черепица
        else if (k > 0.84 && yy > y + h - 14) px(c, xx, yy - 2, '#5a8a48', 3, 1);   // мох у карниза
      }
    }
    // конёк
    const ry = y + Math.max(3, Math.floor(h * 0.18));
    px(c, x + 3, ry - 2, P.ink, w - 6, 4); px(c, x + 4, ry - 1, lt, w - 8, 1);
    // карниз
    px(c, x, y + h - 4, P.ink, w, 4); px(c, x + 1, y + h - 4, dk, w - 2, 2);
    // загнутые края
    px(c, x - 1, y + h - 6, P.ink, 2, 3); px(c, x + w - 1, y + h - 6, P.ink, 2, 3);
    roofLight(c, x, y, w, h);
  }
  // V9: свет на скате — у конька светлее, к карнизу плавно темнее, правый край чуть в тени
  function roofLight(c, x, y, w, h, k = 1) {
    G.shade.tint(c, x + 1, y + 1, w - 2, h - 2, (u, v) => k * (0.26 - 0.7 * v * v - 0.12 * (u - 0.5)));
    if (eaves && c.canvas.hi && c.canvas === eaves.cv) eaves.list.push([x, y + h, w]);
  }

  function roofFlat(c, x, y, w, h, col, seed, tank = true) {
    const top = shade(col, 0.45), edge = shade(col, -0.25);
    px(c, x, y, P.ink, w, h);
    px(c, x + 1, y + 1, top, w - 2, h - 2);
    px(c, x + 1, y + 1, shade(top, 0.25), w - 2, 2);       // парапет
    px(c, x + 3, y + 3, shade(top, -0.06), w - 6, h - 9);   // крыша
    px(c, x + 1, y + h - 5, edge, w - 2, 4);                // фасадная полоса
    px(c, x + 1, y + h - 5, col, w - 2, 1);
    if (tank && w >= 40) { // водяной бак — фирменная деталь Конохи
      const tx = x + 6 + Math.floor(H(seed, 1, 5) * (w - 26)), ty = y + 4;
      px(c, tx, ty + 2, P.ink, 14, 12); px(c, tx + 1, ty + 3, '#b8c0c8', 12, 10);
      px(c, tx + 1, ty + 3, '#d8e0e8', 12, 2); px(c, tx + 3, ty + 6, '#98a0a8', 1, 6);
      px(c, tx + 2, ty, P.ink, 10, 3); px(c, tx + 3, ty + 1, '#e8eef2', 8, 1);
    }
    // мелочи на плоской крыше: вентиляция, горшки, сушилка
    if (h > 18) {
      const k = H(seed, 4, 7);
      if (k > 0.3) { const vx = x + w - 12 - Math.floor(H(seed, 5, 2) * 8); px(c, vx, y + h - 12, P.ink, 6, 5); px(c, vx + 1, y + h - 11, '#9aa0a8', 4, 3); }
      if (k > 0.6 && w >= 40) for (let i = 0; i < 3; i++) { px(c, x + 5 + i * 5, y + h - 10, '#a8683a', 3, 3); px(c, x + 5 + i * 5, y + h - 12, '#4a8a3a', 3, 2); }
      else if (k < 0.2 && w >= 40) { px(c, x + 6, y + 5, '#5a4a3a', 1, 8); px(c, x + w - 7, y + 5, '#5a4a3a', 1, 8); px(c, x + 6, y + 5, '#d8d0c0', w - 12, 1); for (let i = 0; i < 4; i++) px(c, x + 9 + i * Math.floor((w - 20) / 4), y + 6, ['#e8f0f8', '#d84a3a', '#4a7ad0', '#f0c040'][i], 4, 5); }
    }
    if (H(seed, 2, 6) > 0.5 && w >= 64) { const ax = x + w - 12; px(c, ax, y + 3, '#5a5a6a', 1, 8); px(c, ax - 3, y + 5, '#5a5a6a', 7, 1); }
    // V9: плоская крыша — мягкий свет слева-сверху, фасадная полоса в тени
    G.shade.tint(c, x + 1, y + 1, w - 2, h - 2, (u, v) => (v > 1 - 5 / h ? -0.18 : 0.16 - 0.3 * v - 0.14 * u));
    if (eaves && c.canvas === eaves.cv) eaves.list.push([x, y + h, w]);
  }

  // Вальмовая крыша: скаты с торцов темнее, черепица рядами
  function roofHip(c, x, y, w, h, col) {
    const dk = shade(col, -0.35), sd = shade(col, -0.16), lt = shade(col, 0.2);
    const rid = Math.max(4, Math.floor(h * 0.32)), side = Math.max(6, Math.floor(w * 0.16));
    for (let yy = 0; yy < h - 3; yy++) {
      const ins = yy < rid ? Math.round((rid - yy) * 1.3) : 0;
      px(c, x + ins, y + yy, P.ink, w - ins * 2, 1);
      if (yy === 0) continue;
      px(c, x + ins + 1, y + yy, (yy % 4 === 0) ? dk : col, w - ins * 2 - 2, 1);
      const sw = Math.max(0, Math.min(side, Math.round(side * yy / (h - 3))) - ins);
      if (sw > 0) { px(c, x + ins + 1, y + yy, (yy % 4 === 0) ? shade(sd, -0.2) : sd, sw, 1); px(c, x + w - ins - 1 - sw, y + yy, (yy % 4 === 0) ? shade(sd, -0.2) : sd, sw, 1); }
      if (yy % 4 === 2) for (let xx = x + ins + side + 2 + (yy % 8 === 2 ? 3 : 0); xx < x + w - ins - side - 2; xx += 6) px(c, xx, y + yy, lt, 1, 1);
    }
    px(c, x + Math.round(rid * 1.3), y, lt, Math.max(2, w - Math.round(rid * 2.6)), 1);
    px(c, x, y + h - 4, P.ink, w, 4); px(c, x + 1, y + h - 4, dk, w - 2, 2);
    roofLight(c, x, y, w, h);
  }

  // ---------- Силуэты крыш (разнообразие домов) ----------
  // Рисуем обычную крышу на временном холсте и вырезаем по строкам нужный силуэт (spanFn(y) → [l, r]), затем обводим.
  function maskRows(c, tile, w, h, spanFn, x0 = 0, y0 = 0) {
    const t = G.gfx.canvas(w, h).getContext('2d'); tile(t, 0, 0, w, h);
    let pl = 0, pr = 0, started = false;
    for (let y = 0; y < h; y++) {
      const [l, r] = spanFn(y); if (r < l) continue;
      c.drawImage(t.canvas, l, y, r - l + 1, 1, x0 + l, y0 + y, r - l + 1, 1);
      if (!started) { px(c, x0 + l, y0 + y, P.ink, r - l + 1, 1); started = true; }
      else {
        px(c, x0 + l, y0 + y, P.ink, Math.max(1, pl - l + 1), 1);
        px(c, x0 + Math.min(r, pr), y0 + y, P.ink, Math.max(1, r - pr + 1), 1);
      }
      pl = l; pr = r;
    }
  }
  // «Буханка»: плавно закруглённая крыша (дома-«пузыри», как на карте Конохи)
  function roofCurved(c, x, y, w, h, col, seed, multi) {
    const drop = Math.max(8, Math.min(h - 8, Math.round(h * 0.62))), minF = 0.34 + H(seed, 22, 4) * 0.2;
    const tile = multi ? (cc, a, b, ww, hh) => roofFlat(cc, a, b, ww, hh, col, seed, false) : (cc, a, b, ww, hh) => roofGable(cc, a, b, ww, hh, col);
    maskRows(c, tile, w, h, (yy) => {
      if (yy >= drop) return [0, w - 1];
      const u = (drop - yy) / drop, half = (w / 2) * (minF + (1 - minF) * Math.sqrt(Math.max(0, 1 - u * u)));
      return [Math.round(w / 2 - half), Math.round(w / 2 + half) - 1];
    }, x, y);
    // блик по дуге
    const dk = shade(col, -0.25);
    px(c, x + Math.round(w * 0.2), y + Math.round(drop * 0.35), shade(col, 0.4), Math.round(w * 0.14), 1);
    px(c, x + 2, y + h - 6, dk, w - 4, 1);
  }
  // Фронтон: острая «пентагональная» крыша с круглым чердачным окном
  function roofFront(c, x, y, w, h, col, seed) {
    const apex = Math.round(h * 0.62);
    maskRows(c, (cc, a, b, ww, hh) => roofGable(cc, a, b, ww, hh, col), w, h, (yy) => {
      const half = yy >= apex ? w / 2 : (w / 2) * (0.1 + 0.9 * (yy / apex));
      return [Math.round(w / 2 - half), Math.round(w / 2 + half) - 1];
    }, x, y);
    const cx = x + Math.floor(w / 2), wy = y + Math.round(apex * 0.42);
    px(c, cx - 5, wy + 1, P.ink, 10, 8); px(c, cx - 4, wy, P.ink, 8, 10); px(c, cx - 3, wy + 1, '#f0e6d0', 6, 8);
    px(c, cx - 3, wy + 2, '#8ac0e0', 6, 6); px(c, cx - 1, wy + 2, '#4a3020', 1, 6); px(c, cx - 3, wy + 4, '#4a3020', 6, 1);
    px(c, cx - 2, wy + 2, '#c8e8f8', 1, 1);
  }
  // Двухъярусная пагода с загнутыми углами и золотым навершием
  function roofPagoda(c, x, y, w, h, col, seed) {
    const top = Math.round(h * 0.36), uw = Math.round(w * 0.58), ux = x + Math.floor((w - uw) / 2), uh = Math.round(h * 0.52);
    roofHip(c, x, y + top, w, h - top, col);
    px(c, x - 1, y + h - 7, P.ink, 2, 4); px(c, x + w - 1, y + h - 7, P.ink, 2, 4);
    px(c, x + 1, y + top + 1, shade(col, 0.28), w - 2, 1);
    // стенка-фонарь между ярусами
    px(c, ux + 2, y + uh - 2, P.ink, uw - 4, 6); px(c, ux + 3, y + uh - 1, '#e8dcc0', uw - 6, 4);
    for (let wx = ux + 6; wx < ux + uw - 8; wx += 8) px(c, wx, y + uh, '#4a3020', 3, 3);
    roofHip(c, ux, y, uw, uh, shade(col, -0.05));
    px(c, ux - 1, y + uh - 7, P.ink, 2, 4); px(c, ux + uw - 1, y + uh - 7, P.ink, 2, 4);
    const cx = x + Math.floor(w / 2); px(c, cx - 1, y, P.ink, 3, 3); px(c, cx, y, '#f0c040', 1, 2);
  }
  // Г-образный дом: высокое крыло с двускатной крышей и низкое с плоской
  function roofWing(c, x, y, w, h, col, seed) {
    const split = Math.round(w * (0.52 + H(seed, 23, 3) * 0.12)), flip = H(seed, 24, 2) > 0.5, top2 = Math.round(h * 0.38);
    const col2 = ROOFS[Math.floor(H(seed, 25, 6) * ROOFS.length)];
    const lowX = flip ? x : x + split - 4, lowW = w - split + 4, hiX = flip ? x + w - split - 2 : x, hiW = split + 2;
    roofFlat(c, lowX, y + top2, lowW, h - top2, col2, seed, false);
    roofGable(c, hiX, y, hiW, h, col);
    const sx = flip ? hiX : hiX + hiW - 1;
    px(c, sx, y + 3, P.ink, 1, h - 7);
  }

  // Общий выбор крыши
  function drawRoof(c, o, style, h, col, ex = {}) {
    const { W, seed } = o;
    if (style === 'flat') roofFlat(c, 0, 0, W, h, col, seed, ex.tank !== false);
    else if (style === 'hip') roofHip(c, 0, 0, W, h, col);
    else if (style === 'curved') roofCurved(c, 0, 0, W, h, col, seed, ex.multi);
    else if (style === 'front') roofFront(c, 0, 0, W, h, col, seed);
    else if (style === 'pagoda') roofPagoda(c, 0, 0, W, h, col, seed);
    else if (style === 'wing') roofWing(c, 0, 0, W, h, col, seed);
    else roofGable(c, 0, 0, W, h, col);
  }

  // Трубы с дымком и слуховые окна — только на скатных крышах
  function roofExtras(c, o, style, h) {
    const { W, seed } = o;
    if (!['gable', 'hip', 'front', 'wing'].includes(style)) return;
    if (H(seed, 26, 4) > 0.5 && W >= 40) {
      const cx = style === 'front' ? Math.round(W * 0.72) : 6 + Math.floor(H(seed, 27, 2) * (W * 0.3));
      const cy = Math.max(9, Math.round(h * 0.22));
      px(c, cx - 1, cy - 1, P.ink, 9, 2); px(c, cx, cy + 1, P.ink, 7, 11); px(c, cx + 1, cy + 1, '#a85a42', 5, 10); px(c, cx + 1, cy + 1, '#c8806a', 5, 1);
      px(c, cx + 1, cy + 5, '#8a4a38', 5, 1);
      c.globalAlpha = 0.75; px(c, cx + 2, cy - 4, '#eceef4', 3, 3); px(c, cx + 4, cy - 7, '#eceef4', 3, 3); px(c, cx + 3, cy - 10, '#eceef4', 2, 2); c.globalAlpha = 1;
    } else if (W >= 64 && h >= 50 && (style === 'gable' || style === 'hip') && H(seed, 28, 5) > 0.35) {
      dormer(c, Math.round(W * (0.18 + H(seed, 29, 3) * 0.4)), Math.round(h * 0.3), shade('#b8a888', 0));
    }
  }
  function dormer(c, x, y, wallCol) {
    for (let i = 0; i < 6; i++) px(c, x + 7 - i, y + i, P.ink, 2 * i + 2, 1);
    px(c, x + 2, y + 6, P.ink, 12, 10); px(c, x + 3, y + 6, '#9a6a3a', 10, 2); px(c, x + 3, y + 8, '#f0e6d0', 10, 7);
    px(c, x + 5, y + 8, '#4a3020', 6, 6); px(c, x + 6, y + 9, '#8ac0e0', 4, 4); px(c, x + 8, y + 9, '#4a3020', 1, 4);
  }

  // Круглый дом Конохи: цилиндр с плоской крышей-диском, конической крышей или куполом
  function roundHouse(c, o, plaster, roofCol, rstyle = 'round') {
    const { W, HF, OV, seed, tpl, id } = o;
    const wh = wallH(tpl, id), wy = OV + HF - wh, cx = W / 2;
    for (let x = 1; x < W - 1; x++) {
      const t = Math.abs((x - cx) / (cx - 1));
      const col = t > 0.85 ? shade(plaster, -0.28) : t > 0.6 ? shade(plaster, -0.12) : t < 0.2 ? shade(plaster, 0.12) : plaster;
      const cut = t > 0.92 ? 3 : t > 0.8 ? 1 : 0;
      px(c, x, wy + cut, col, 1, wh - cut * 2);
    }
    px(c, 0, wy + 3, P.ink, 1, wh - 6); px(c, W - 1, wy + 3, P.ink, 1, wh - 6);
    px(c, 2, OV + HF - 4, P.ink, W - 4, 2); px(c, 3, OV + HF - 5, '#8a8a98', W - 6, 1);
    const band = shade(roofCol, -0.1);
    for (let f = 0; f < 2; f++) {
      const yy = wy + 6 + f * 14;
      for (let x = 7; x + 9 < W - 6; x += 14) roundWindow(c, x, yy);
      px(c, 3, yy + 12, band, W - 6, 1);
    }
    const dx = tpl.door[0] * T + 2;
    px(c, dx - 1, OV + HF - 22, P.ink, 14, 22); px(c, dx, OV + HF - 21, '#7a4a2a', 12, 21); px(c, dx + 2, OV + HF - 13, '#f0c040', 1, 2);
    px(c, dx - 3, OV + HF - 24, P.ink, 18, 3); px(c, dx - 2, OV + HF - 23, roofCol, 16, 1);
    // крыша-диск
    const rh = wy + 5;
    if (rstyle === 'cone' || rstyle === 'dome') {
      const dk = shade(roofCol, -0.3);
      for (let y = 0; y < rh; y++) {
        const t = y / (rh - 1);
        const k = rstyle === 'cone' ? 0.05 + 0.95 * Math.min(1, t / 0.9) : 0.14 + 0.86 * Math.sqrt(Math.max(0, 1 - (1 - t) * (1 - t)));
        const half = y >= rh - 4 ? Math.floor(W / 2) : Math.max(1, Math.floor((W / 2) * k));
        px(c, cx - half, y, P.ink, half * 2, 1);
        if (y >= rh - 1) continue;
        const base = y >= rh - 4 ? dk : (y % 5 === 4 ? shade(roofCol, -0.18) : roofCol);
        px(c, cx - half + 1, y, base, half * 2 - 2, 1);
        if (y < rh - 4) {
          px(c, cx - half + 1, y, shade(base, 0.22), Math.max(1, Math.floor(half * 0.3)), 1);
          px(c, cx + Math.floor(half * 0.35), y, shade(base, -0.2), Math.max(1, Math.ceil(half * 0.65) - 1), 1);
        }
      }
      px(c, cx - 1, 0, '#f0c040', 2, 3);
      return;
    }
    for (let y = 0; y < rh; y++) {
      const t = y / rh, half = Math.floor((W / 2) * (t < 0.3 ? 0.75 + t * 0.8 : 1));
      px(c, cx - half, y, P.ink, half * 2, 1);
      if (y > 0 && y < rh - 1) px(c, cx - half + 1, y, y > rh - 6 ? shade(roofCol, -0.3) : y < 3 ? shade(roofCol, 0.3) : roofCol, half * 2 - 2, 1);
    }
    if (H(seed, 3, 3) > 0.35) { const tx = Math.floor(cx - 6); px(c, tx, 2, P.ink, 12, 10); px(c, tx + 1, 3, '#b8c0c8', 10, 8); px(c, tx + 1, 3, '#d8e0e8', 10, 2); px(c, tx + 3, 0, P.ink, 6, 3); }
  }

  // Мелкие детали фасада: водосток, кондиционер, горшки, фонарик, бельё
  function facadeDetails(c, o, wy, wh, dx, plaster) {
    const { W, HF, OV, seed } = o;
    const r = (k) => H(seed, k, 57);
    const by = OV + HF;
    if (r(1) > 0.45) { const x = r(2) > 0.5 ? 1 : W - 3; px(c, x, wy + 2, '#7a8088', 2, wh - 5); px(c, x, by - 4, '#5a6068', 3, 1); }
    if (r(3) > 0.5 && W >= 48) {
      let ax = 4 + Math.floor(r(4) * (W - 18));
      if (dx != null && ax + 10 > dx - 2 && ax < dx + 14) ax = dx + 16 < W - 12 ? dx + 16 : Math.max(3, dx - 14);
      const ay = wy + Math.floor(wh * 0.55);
      px(c, ax, ay, P.ink, 10, 7); px(c, ax + 1, ay + 1, '#d8dce0', 8, 5); for (let i = 0; i < 3; i++) px(c, ax + 2 + i * 2, ay + 2, '#8a9098', 1, 3);
    }
    if (dx != null) {
      if (r(5) > 0.4) { const px0 = dx + 13 < W - 6 ? dx + 13 : dx - 7; px(c, px0, by - 8, '#a8583a', 5, 4); px(c, px0 - 1, by - 13, '#3e8a42', 7, 5); px(c, px0 + 1, by - 14, '#5aaa5a', 2, 2); }
      if (r(6) > 0.72) { const lx = dx - 6 > 2 ? dx - 6 : dx + 14; px(c, lx, by - 21, P.ink, 5, 8); px(c, lx + 1, by - 20, '#e84a3a', 3, 6); px(c, lx + 1, by - 18, '#f0d040', 3, 1); }
      if (r(7) > 0.6) { px(c, dx + 3, by - 25, P.ink, 7, 4); px(c, dx + 4, by - 24, '#e8dcc0', 5, 2); }
    }
    if (r(8) > 0.7 && wh >= 28) { // бельё на верёвке под карнизом
      const ly = wy + 4, x0 = 4, x1 = W - 5;
      px(c, x0, ly, '#5a4a3a', x1 - x0, 1);
      for (let x = x0 + 3; x < x1 - 4; x += 7) { if (dx != null && x + 5 > dx && x < dx + 12) continue; px(c, x, ly + 1, ['#f4f4f4', '#d84a3a', '#4a7ad0', '#f0c040', '#7ac04a'][Math.floor(H(x, seed, 9) * 5)], 5, 5 + (x % 3)); }
    }
  }

  function wall(c, x, y, w, h, col, beam) {
    px(c, x, y, P.ink, w, h);
    px(c, x + 1, y, col, w - 2, h - 1);
    // фактура штукатурки: светлые и тёмные крапинки, подтёки
    for (let i = 0; i < w * h / 26; i++) {
      const rx = 1 + Math.floor(H(i, w + h, 31) * (w - 3)), ry = Math.floor(H(i, x + w, 32) * (h - 6));
      c.globalAlpha = 0.09; px(c, x + rx, y + ry, H(i, h, 33) > 0.5 ? '#ffffff' : '#000000', 1 + (i % 3 === 0 ? 1 : 0), 1); c.globalAlpha = 1;
    }
    // цоколь из каменных блоков
    px(c, x + 1, y + h - 4, shade(col, -0.22), w - 2, 3);
    for (let bx = x + 1; bx < x + w - 1; bx += 5) { const k = H(bx, y, 34); px(c, bx, y + h - 4, k > 0.5 ? '#9a9aa8' : '#8a8a98', 4, 2); px(c, bx + 4, y + h - 4, '#6a6a78', 1, 3); }
    px(c, x + 1, y + h - 2, '#6a6a78', w - 2, 1);
    if (beam) {
      px(c, x + 1, y, beam, 2, h - 4); px(c, x + w - 3, y, beam, 2, h - 4);
      for (let bx = x + 48; bx < x + w - 24; bx += 48) px(c, bx, y, beam, 2, h - 4);
    }
    // V9: свет слева, затемнение у цоколя (тень от карниза кладёт make() поверх всего)
    G.shade.tint(c, x + 1, y, w - 2, h - 1, (u, v) => {
      const py = v * (h - 1);
      return 0.07 - 0.17 * u - (py > h - 9 ? 0.14 * (py - h + 9) / 9 : 0);
    });
  }

  function windowAt(c, x, y, lit) {
    if (glowList) glowList.push([x + 1, y + 1, 8, 7]);
    px(c, x, y, '#4a3020', 10, 9); px(c, x + 1, y + 1, lit ? '#f0d890' : '#8ac0e0', 8, 7);
    px(c, x + 5, y + 1, '#4a3020', 1, 7); px(c, x + 1, y + 4, '#4a3020', 8, 1);
    px(c, x + 1, y + 1, lit ? '#fff0c0' : '#c8e8f8', 2, 1);
    const k = H(x, y, 41);
    px(c, x + 1, y + 6, 'rgba(255,255,255,0.28)', 3, 1);                 // блик на стекле
    if (k > 0.55 && k < 0.8) { px(c, x + 1, y + 1, '#e8b0b8', 2, 4); px(c, x + 7, y + 1, '#e8b0b8', 2, 4); }   // занавески
    px(c, x - 1, y + 9, '#e4d8bc', 12, 1); px(c, x - 1, y + 10, 'rgba(60,40,20,0.22)', 12, 1);                // подоконник и тень под ним
    px(c, x - 1, y - 1, '#7a5a3a', 12, 1);                                                                      // перемычка
    if (k >= 0.8) { // цветочный ящик
      px(c, x - 1, y + 9, '#7a4a2a', 12, 2); px(c, x, y + 10, '#5a3418', 10, 1);
      for (let i = 0; i < 5; i++) { px(c, x + i * 2, y + 8, i % 2 ? '#e84a6a' : '#f4d84a'); px(c, x + i * 2, y + 7, '#3e8a42'); }
    }
  }
  function roundWindow(c, x, y) {
    if (glowList) glowList.push([x + 2, y + 2, 6, 6]);
    px(c, x + 2, y, '#4a3020', 6, 10); px(c, x, y + 2, '#4a3020', 10, 6); px(c, x + 1, y + 1, '#4a3020', 8, 8);
    px(c, x + 2, y + 2, '#8ac0e0', 6, 6); px(c, x + 3, y + 1, '#8ac0e0', 4, 8); px(c, x + 1, y + 3, '#8ac0e0', 8, 4);
    px(c, x + 4, y + 1, '#4a3020', 1, 8); px(c, x + 3, y + 3, '#c8e8f8', 1, 1);
  }

  function door(c, x, y, h, kind, col) {
    if (kind === 'noren') { // занавеска норэн
      px(c, x - 1, y, P.ink, 14, h); px(c, x, y + 1, '#2a1e18', 12, h - 1);
      px(c, x - 2, y, '#5a3a24', 16, 2);
      for (let i = 0; i < 3; i++) px(c, x + i * 4, y + 2, col, 3, Math.floor(h * 0.55));
      px(c, x, y + 2 + Math.floor(h * 0.55), shade(col, -0.3), 12, 1);
    } else if (kind === 'big') {
      px(c, x - 3, y, P.ink, 18, h); px(c, x - 2, y + 1, '#7a4a2a', 16, h - 1);
      px(c, x + 5, y + 1, P.ink, 2, h - 1); px(c, x - 2, y + 1, '#9a6038', 16, 2);
      px(c, x + 3, y + h / 2, '#f0d040', 1, 2); px(c, x + 8, y + h / 2, '#f0d040', 1, 2);
    } else if (kind === 'arch') { // дверь с круглой аркой
      px(c, x, y + 3, P.ink, 12, h - 3); px(c, x + 1, y + 1, P.ink, 10, 2); px(c, x + 3, y, P.ink, 6, 1);
      px(c, x + 1, y + 4, '#8a5a34', 10, h - 4); px(c, x + 2, y + 2, '#8a5a34', 8, 2); px(c, x + 3, y + 1, '#8a5a34', 6, 1);
      px(c, x + 6, y + 2, '#5a3a20', 1, h - 2); px(c, x + 2, y + 5, '#a8703e', 3, 1); px(c, x + 8, y + Math.floor(h / 2), '#f0c040', 1, 2);
      px(c, x - 1, y + h - 2, '#8a8a98', 14, 2);
    } else { // раздвижная дверь седзи
      px(c, x, y, P.ink, 12, h); px(c, x + 1, y + 1, '#f0e6cc', 10, h - 1);
      px(c, x + 6, y + 1, '#5a3a24', 1, h - 1);
      for (let yy = y + 4; yy < y + h; yy += 4) px(c, x + 1, yy, '#b8a888', 10, 1);
      px(c, x + 3, y + 1, '#b8a888', 1, h - 1); px(c, x + 9, y + 1, '#b8a888', 1, h - 1);
    }
  }

  function signboard(c, x, y, w, col, iconName) {
    px(c, x, y, P.ink, w, 11); px(c, x + 1, y + 1, col, w - 2, 9);
    px(c, x + 1, y + 1, shade(col, 0.25), w - 2, 1);
    if (iconName) icon(c, iconName, x + Math.floor((w - 7) / 2), y + 2, '#f4ecd8', shade(col, -0.2));
  }

  // ---------- Основная функция ----------
  // tpl — объект шаблона, id — ключ, seed — для вариаций.
  function make(id, tpl, seed = 0) {
    const key = id + ':' + seed;
    if (cache[key]) return cache[key];
    const W = tpl.w * T, HF = tpl.h * T;
    let OV = tpl.ov || 16;
    if (id === 'hokage_tower') OV = 28;
    if (id === 'apartment' || id === 'naruto_flat') OV = 24;
    const style = pickStyle(id, tpl, seed);
    if (style) OV += EXTRA_OV[style] || 0;
    const c = G.gfx.canvas(W, HF + OV).getContext('2d');
    const draw = SPECIAL[id] || GENERIC[tpl.cat] || GENERIC.house;
    glowList = []; eaves = { cv: c.canvas, list: [] };
    G.shade.defer(c);   // V9: свет и тени копятся и ложатся за одно чтение пикселей
    draw(c, { id, tpl, W, HF, OV, seed, col: tpl.color, style });
    // V9: мягкая тень под карнизами — ложится на стену, окна и двери, сходит на нет за 9 px
    for (const [ex, ey, ew] of eaves.list) G.shade.tint(c, ex + 1, ey, ew - 2, 9, (u, v) => -0.6 * (1 - v) ** 1.6);
    G.shade.flush(c);
    eaves = null;
    G.gfx.smooth(c.canvas);
    const res = { img: c.canvas, ox: 0, oy: -OV, w: W, h: HF + OV };
    if (glowList.length) {
      const g = G.gfx.canvas(W, HF + OV), gc = g.getContext('2d');
      gc.fillStyle = '#ffb860'; for (const [x, y, w, h] of glowList) gc.fillRect(x, y, w, h);
      gc.fillStyle = '#ffe8a8'; for (const [x, y, w] of glowList) gc.fillRect(x + 1, y + 1, Math.max(1, w - 4), 2);
      res.glow = g;
    }
    glowList = null;
    cache[key] = res;
    return res;
  }

  // Разные силуэты крыш для типовых домов и лавок: у каждого шаблона свой набор
  const STYLE_POOL = {
    house_xs: ['gable', 'front', 'curved', 'hip', 'flat'],
    house_n: ['front', 'pagoda', 'flat', 'gable', 'curved'],
    house_s: ['gable', 'hip', 'flat', 'curved', 'front', 'pagoda'],
    house_m: ['gable', 'hip', 'flat', 'curved', 'front', 'pagoda', 'wing'],
    house_w: ['wing', 'curved', 'gable', 'hip', 'pagoda', 'flat'],
    house_t: ['pagoda', 'hip', 'front', 'gable', 'curved'],
    apartment_s: ['flat', 'curved', 'flat', 'hip'],
    tower_r: ['round', 'cone', 'dome'],
    shop_s: ['gable', 'hip', 'curved', 'pagoda'],
  };
  const EXTRA_OV = { front: 6, pagoda: 8, curved: 2, wing: 4 };
  function pickStyle(id, tpl, seed) {
    const pool = STYLE_POOL[id];
    if (!pool || tpl.unique) return null;
    return pool[Math.floor(H(seed, 17, 5) * pool.length)];
  }

  // Высота фасада
  function wallH(tpl, id) {
    if (tpl.wh) return tpl.wh;
    if (id === 'apartment' || id === 'naruto_flat' || tpl.multi) return tpl.h * T - 20;
    if (tpl.floors === 2 || tpl.style === 'round') return tpl.h * T - 30;
    return tpl.h >= 7 ? 44 : tpl.h >= 5 ? 36 : tpl.h >= 4 ? 30 : 26;
  }

  // Окна по фасаду с пропуском двери
  function windowsRow(c, o, wy, doorX, opts = {}) {
    const { W, seed } = o;
    for (let x = 6; x + 10 < W - 4; x += 16) {
      if (doorX != null && x + 10 > doorX - 4 && x < doorX + 16) continue;
      if (opts.every && ((x / 16) | 0) % opts.every) continue;
      if (o.shut) { px(c, x - 2, wy, o.shut, 2, 9); px(c, x + 10, wy, o.shut, 2, 9); px(c, x - 2, wy + 2, shade(o.shut, -0.3), 2, 1); px(c, x + 10, wy + 2, shade(o.shut, -0.3), 2, 1); }
      if (opts.round && H(x, seed, 3) > 0.6) roundWindow(c, x, wy); else windowAt(c, x, wy, false);
    }
  }

  const PLASTER = ['#f0e6d0', '#e8dcc0', '#f4ecd8', '#e0d4bc', '#ece0c8', '#f0dcc8', '#dce4d4', '#d8dce6', '#f0e0b0', '#e8d0c0', '#f2d8d0', '#d4e8d8', '#d0e0ee', '#f4d8b0'];
  const SHOPCOL = ['#a88a6a', '#3a7aa0', '#c8503a', '#5a9a5a', '#a05a8a', '#d89a3a', '#6a6aa8'];
  const WOODS = ['#b08058', '#a07048', '#c09068'];
  const ROOFS = ['#b84a3a', '#c86a3a', '#4a6a9a', '#5a8a5a', '#8a5a3a', '#a84a5a', '#6a5a8a', '#3a7a8a', '#9a8a5a', '#d8783a', '#5a6a7a', '#3a8a6a', '#c85a8a', '#7a8a3a'];

  const GENERIC = {
    house(c, o) {
      const { W, HF, OV, seed, tpl, id } = o;
      const r = (k) => H(seed, k, 91);
      const wh = wallH(tpl, id), wy = OV + HF - wh;
      const multi = id === 'apartment' || id === 'naruto_flat' || !!tpl.multi;
      const auto = !tpl.unique;
      const plaster = auto && !multi && r(2) > 0.8 ? WOODS[Math.floor(r(4) * WOODS.length)] : PLASTER[Math.floor(H(seed, 7, 1) * PLASTER.length)];
      const wooden = WOODS.includes(plaster);
      const roofCol = id === 'hero_home' ? '#d87a3a' : ROOFS[Math.floor(H(seed, 8, 2) * ROOFS.length)];
      let style = tpl.style || (multi ? 'flat' : id === 'hero_home' ? 'gable' : ['gable', 'flat', 'hip', 'flat', 'gable', 'hip', 'flat'][Math.floor(r(1) * 7)]);
      if (id === 'house_s' || id === 'house_m' || id === 'apartment') style = tpl.style || (multi ? 'flat' : H(seed, 9, 3) > 0.45 ? 'flat' : r(1) > 0.5 ? 'hip' : 'gable');
      if (o.style) style = o.style;
      if (style === 'round' || style === 'cone' || style === 'dome') { roundHouse(c, o, plaster, roofCol, style); return; }
      if (auto && !multi && r(31) > 0.62) o.shut = ['#4a8a6a', '#a84a3a', '#4a6aa0', '#8a6a3a'][Math.floor(r(32) * 4)];
      wall(c, 0, wy, W, wh, plaster, (style === 'gable' || style === 'wing') && !wooden ? '#7a4a2a' : null);
      if (wooden) for (let yy = wy + 4; yy < wy + wh - 4; yy += 4) px(c, 1, yy, shade(plaster, -0.2), W - 2, 1);
      const dx = tpl.door ? tpl.door[0] * T + 2 : null;
      if (multi) {
        const floors = Math.floor((wh - 8) / 14), balc = auto && r(5) > 0.35;
        for (let f = 0; f < floors; f++) {
          const yy = wy + 5 + f * 14;
          windowsRow(c, o, yy, f === floors - 1 ? dx : null);
          px(c, 1, yy + 11, shade(plaster, -0.12), W - 2, 1);
          if (balc && f < floors - 1) { // балконы с перилами и бельём
            px(c, 3, yy + 9, P.ink, W - 6, 4); px(c, 4, yy + 10, '#9aa0a8', W - 8, 1);
            for (let x = 5; x < W - 5; x += 3) px(c, x, yy + 10, '#6a7078', 1, 2);
            if (H(f, seed, 4) > 0.5) for (let x = 8; x < W - 8; x += 9) px(c, x, yy + 5, ['#f4f4f4', '#d84a3a', '#4a7ad0', '#f0c040'][Math.floor(H(x, f + seed, 5) * 4)], 4, 5);
          }
        }
        if (id === 'naruto_flat') { icon(c, 'leaf', W - 12, wy + 4, '#e8621a', '#f0c040'); }
      } else if (tpl.floors === 2) {
        windowsRow(c, o, wy + 5, null, { round: r(6) > 0.5 });
        px(c, 0, wy + 17, P.ink, W, 3); px(c, 1, wy + 17, shade(roofCol, -0.1), W - 2, 1);   // навес между этажами
        windowsRow(c, o, wy + 23, dx);
      } else {
        windowsRow(c, o, wy + Math.max(4, Math.floor((wh - 16) / 2)), dx, { round: true });
      }
      if (dx != null) {
        const dk = id === 'hero_home' ? 'shoji' : ['shoji', 'shoji', 'wood', 'noren', 'arch'][Math.floor(r(9) * 5)];
        if (dk === 'wood') { px(c, dx, OV + HF - 20, P.ink, 12, 20); px(c, dx + 1, OV + HF - 19, shade('#8a5a34', r(10) * 0.3 - 0.15), 10, 19); px(c, dx + 1, OV + HF - 19, '#a8703e', 10, 1); px(c, dx + 8, OV + HF - 10, '#f0c040', 1, 2); }
        else door(c, dx, OV + HF - 20, 20, dk, ROOFS[Math.floor(r(11) * ROOFS.length)]);
      }
      if (auto) facadeDetails(c, o, wy, wh, dx, plaster);
      drawRoof(c, o, style, wy + 4, roofCol, { multi, tank: multi || r(12) > 0.35 });
      if (auto) roofExtras(c, o, style, wy + 4);
      if (id === 'hero_home') { px(c, dx + 1, OV + HF - 25, P.ink, 10, 4); px(c, dx + 2, OV + HF - 24, '#f0c040', 8, 2); }
    },

    shop(c, o) {
      const { W, HF, OV, seed, tpl, id } = o;
      const col = tpl.unique ? tpl.color : SHOPCOL[Math.floor(H(seed, 13, 4) * SHOPCOL.length)];
      const wh = wallH(tpl, id), wy = OV + HF - wh;
      const plaster = PLASTER[Math.floor(H(seed, 7, 1) * PLASTER.length)];
      wall(c, 0, wy, W, wh, plaster, '#7a4a2a');
      const dx = tpl.door[0] * T + 2;
      // витрина
      for (let x = 5; x + 12 < W - 3; x += 16) {
        if (x + 12 > dx - 3 && x < dx + 15) continue;
        px(c, x, wy + 10, '#4a3020', 13, 11); px(c, x + 1, wy + 11, '#8ac0e0', 11, 9);
        for (let i = 0; i < 3; i++) px(c, x + 2 + i * 4, wy + 16, [col, '#f0c040', '#e84a3a'][i], 2, 3);
      }
      door(c, dx, OV + HF - 18, 18, 'noren', col);
      // навес
      const ay = wy - 1;
      for (let x = 0; x < W; x += 6) px(c, x, ay, (x / 6) % 2 ? '#f4ecd8' : col, 6, 6);
      px(c, 0, ay + 6, P.ink, W, 1);
      if (o.style && ['curved', 'pagoda'].includes(o.style)) drawRoof(c, o, o.style, wy, shade(col, -0.3));
      else if (!tpl.unique && (o.style === 'hip' || (!o.style && H(seed, 14, 2) > 0.55))) roofHip(c, 0, 0, W, wy, shade(col, -0.35)); else roofGable(c, 0, 0, W, wy, shade(col, -0.3));
      signboard(c, Math.floor(W / 2) - 9, wy - 14, 18, col, TPL_ICON[id] || 'coin');
    },

    food(c, o) {
      const { W, HF, OV, tpl, id } = o;
      const wh = wallH(tpl, id), wy = OV + HF - wh;
      wall(c, 0, wy, W, wh, '#e8d8b8', '#5a3a24');
      // широкие норэн во весь фасад (как у Ичираку)
      const ny = wy + 3;
      px(c, 2, ny - 1, '#5a3a24', W - 4, 2);
      const n = Math.floor((W - 6) / 9);
      for (let i = 0; i < n; i++) {
        const x = 3 + i * 9;
        px(c, x, ny + 1, P.ink, 8, 13); px(c, x + 1, ny + 1, tpl.color, 6, 12);
        if (i === Math.floor(n / 2)) icon(c, TPL_ICON[id] || 'coin', x, ny + 3, '#f4ecd8', shade(tpl.color, -0.3));
      }
      // стойка
      px(c, 1, OV + HF - 10, P.ink, W - 2, 7); px(c, 2, OV + HF - 9, '#a8703e', W - 4, 5); px(c, 2, OV + HF - 9, '#c88a4a', W - 4, 1);
      roofGable(c, 0, 0, W, wy + 3, shade(tpl.color, -0.25));
      // фонари
