name: Браузерные проверки

# Полный прогон в Chromium: Python-наборы (check_all.py) и tools/test_*.js.
# Не блокирует PR — запускается ночью и вручную (Actions → «Браузерные проверки» → Run workflow):
# раньше эти наборы запускал только тот, кто публикует, и пять из них месяцами были красными.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright (Python и Node, одна версия — один Chromium)
        run: |
          python -m pip install playwright==1.56.0 Pillow
          python -m playwright install --with-deps chromium
          npm install --no-save playwright@1.56.0
      - name: Сборка
        run: python3 build.py
      - name: Все наборы check_all.py
        run: python3 tools/check_all.py
      - name: Браузерные наборы tools/test_*.js
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          fail=0
          for f in tools/test_*.js; do
            echo "== $f"
            node "$f" || fail=1
          done
          exit $fail
